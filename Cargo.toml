[workspace]
resolver = "3"
members = [
    "crates/algoclerk-core",
    "crates/algoclerk-media",
    "crates/algoclerk-levels",
    "crates/algoclerk-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["The AlgoClerk contributors"]
repository = "https://github.com/ericcurtin/algoclerk"
homepage = "https://github.com/ericcurtin/algoclerk"
publish = false

[workspace.dependencies]
algoclerk-core = { path = "crates/algoclerk-core", default-features = false }
algoclerk-levels = { path = "crates/algoclerk-levels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
proptest = "1"
png = "0.18"
algoclerk-media = { path = "crates/algoclerk-media" }
algoclerk-game = { path = "crates/algoclerk-game" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Dependencies (Bevy, wgpu, ...) are compiled with full optimisation even in debug builds,
# otherwise the game is a slideshow. Workspace crates get light optimisation so `cargo run` is playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
