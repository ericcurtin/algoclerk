name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The differential tests compile the player's C++ with g++ and clang++ and compare the result with the
      # interpreter; the code generator tests also use rustc and gcc/clang. Every compiler run is wrapped in
      # GNU `timeout`, so macOS gets coreutils (gnubin puts `timeout` on PATH). A missing compiler skips its
      # tests with a message, so the Linux leg installs all of them and the `differential` job below runs the
      # compiler suites with more random programs.
      - name: Install compilers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config
      - name: Install GNU timeout (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Show the toolchains
        shell: bash
        run: |
          rustc --version
          g++ --version | head -n 1 || true
          clang++ --version | head -n 1 || true
          timeout --version | head -n 1 || true
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test --workspace
      # Windows has no GNU `timeout` (System32 ships a different program of that name), so the suites that
      # compile C++ or the translations are not run there; everything that only needs the interpreter is.
      - name: Tests without compiler suites (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --workspace --lib --bins
          cargo test -p algoclerk-core --test cpp_check_corpus --test cpp_check_negative --test cpp_check_stdlib --test cpp_interp_smoke --test cpp_interp_ub --test cpp_parse_fuzz --test cpp_prop_fuzz --test robustness
          cargo test -p algoclerk-levels --test oracles --test shipped
          cargo test -p algoclerk-cli
          cargo test -p algoclerk-game
      - name: Clippy with audio (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy -p algoclerk-app --all-targets --features audio -- -D warnings

  differential:
    name: differential tests against g++, clang++ and rustc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Both compilers for every program (the default compiles clang++ for a sample only), more random
      # programs than the default 40, and a seed that changes on every run so CI explores new programs.
      # The seed is printed with every run; ALGOCLERK_PROP_SEED=<n> reproduces a failure locally.
      ALGOCLERK_DIFF_CLANG: "1"
      ALGOCLERK_PROP_CASES: "400"
      ALGOCLERK_PROP_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install compilers (g++ brings the sanitizer runtimes)
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config
      - name: Show the toolchains
        run: |
          rustc --version
          g++ --version | head -n 1
          clang++ --version | head -n 1
          gcc --version | head -n 1
          clang --version | head -n 1
          timeout --version | head -n 1
      - name: Interpreter against compilers (snippets, round trip, random programs, UB table, fuzz)
        run: >
          cargo test -p algoclerk-core
          --test cpp_interp_diff --test cpp_parse_roundtrip --test cpp_harness_selftest
          --test cpp_prop_diff --test cpp_prop_ub --test cpp_prop_fuzz --test cpp_interp_ub
        env:
          RUST_BACKTRACE: "1"
      - name: Level solutions against compilers (reference and naive, warnings are errors, sanitizers)
        run: cargo test -p algoclerk-levels --test cpp_diff_levels
      - name: Rust and C translations against the interpreter
        run: |
          cargo test -p algoclerk-core --test cpp_codegen_random
          cargo test -p algoclerk-levels --test cpp_codegen_levels

  levels:
    name: validate levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p algoclerk-cli -- validate
      - run: cargo run -q -p algoclerk-cli -- table
      - run: cargo test -p algoclerk-levels --test oracles --test shipped

  deny:
    name: cargo-deny (licences, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  gui-smoke:
    name: real window smoke test (Xvfb + software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers libvulkan1 \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev pkg-config
      - run: scripts/gui-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gui-smoke
          path: dist/gui-smoke

  android-check:
    name: Android type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: cargo check for the three Android ABIs
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 check -p algoclerk-app --lib --features android-game-activity
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Core crates for Android targets
        run: cargo check -p algoclerk-core -p algoclerk-levels --target aarch64-linux-android

  ios-check:
    name: iOS type-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: cargo check for iOS device and simulator
        run: |
          cargo check -p algoclerk-app --lib --target aarch64-apple-ios
          cargo check -p algoclerk-app --lib --target aarch64-apple-ios-sim

  windows-cross:
    name: Windows cross-compile check (from Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo check --workspace --target x86_64-pc-windows-gnu --lib --bins
