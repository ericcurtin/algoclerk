version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint", "emath", "winit", "wgpu*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
