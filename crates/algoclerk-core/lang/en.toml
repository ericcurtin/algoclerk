[about]
line_game = "AlgoClerk is a puzzle game about teaching a tiny office clerk the algorithms behind classic interview questions. Solve a level and the game shows you the same program as C, C++ and Rust."
line_licence = "Free software under the Apache License 2.0. The source code lives at github.com/ericcurtin/algoclerk."
line_art = "All pixel art, both bitmap fonts, the music and the sound effects were made for this project as plain text files. Nothing is copied from other games."
line_music = "The chiptune songs are written as text and synthesised while you play. Turn them down in Settings; the game is fully playable in silence."
line_font = "The pixel fonts cover every character the code generator prints, so C, C++ and Rust listings never show a missing glyph."
line_levels = "48 levels in 7 packs, from the Mail Room to the Executive Floor. Programs run in AlgoClerk's own Rust interpreter: no scripting engine, no web build and no network access."
line_engine = "Built in Rust with Bevy for the window, input and sound. The game draws everything into a tiny 480x270 pixel screen in software and scales it with crisp integer pixels."
line_falabichos = "The art pipeline (text palette, .px sprites, bitmap font, chiptune synth, integer-scaled screen) follows the sibling project Falabichos by the same author."
line_privacy = "No accounts, no tracking. Your progress is saved on this device only."
line_source = "Want to add a level, a song, a palette or a clerk outfit? See CONTRIBUTING.md and docs/GOOD_FIRST_ISSUES.md."
line_howto = "Tip: click or tap a floor tile in the office to set the tile of the selected step."
line_thanks = "Thank you for playing!"
line_keys = "Keys: Space run or pause, S step, Z step back, R reset, 1 to 5 speed, T text mode, Tab palette, Esc back."
line_touch = "Touch: tap to select, tap a card to add, hold a slip to drag it, drag the lists to scroll."
