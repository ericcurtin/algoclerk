id = "echo-test"
title = "Echo"
summary = "Pass everything along."
story = "A story."
statement = "Output every input."

[[examples]]
input = [1, 2]
output = [1, 2]

[machine]
floor = 2
allowed = ["inbox", "outbox", "jump", "copyto", "copyfrom"]
[machine.prefill]
0 = 7

[tests]
seed = 3
[[tests.fixed]]
input = []
output = []
[[tests.fixed]]
input = "ab"
output = [97, 98]
[[tests.generators]]
count = 3
inbox = [ { kind = "list", len = [1, 4], range = [0, 9] } ]

[targets]
size_par = 3
size_ace = 3
speed_par = 12
speed_ace = 9

[solution]
asm = """
a:
INBOX
OUTBOX
JUMP a
"""
