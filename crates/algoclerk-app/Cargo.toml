[package]
name = "algoclerk-app"
description = "The AlgoClerk game client (Bevy): window, input, audio and the shell around algoclerk-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
publish.workspace = true

# `rlib` for the desktop binary, `cdylib` for Android (loaded by GameActivity), `staticlib` for iOS.
[lib]
name = "algoclerk_app"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "algoclerk"
path = "src/main.rs"

[features]
default = []
# Sound output through Bevy's audio (cpal). On Linux this needs the ALSA headers
# (libasound2-dev / alsa-lib-devel); everything else builds and runs without it.
audio = ["bevy/bevy_audio", "bevy/wav"]
# Android activity flavour (selected by mobile/android through cargo-ndk).
android-game-activity = ["bevy/android-game-activity"]
android-native-activity = ["bevy/android-native-activity"]

[dependencies]
algoclerk-core = { workspace = true }
algoclerk-levels.workspace = true
algoclerk-media = { path = "../algoclerk-media" }
algoclerk-game = { path = "../algoclerk-game" }
# Bevy 0.19.1 (same pin as the sibling project Falabichos): the newest release that builds with rustc 1.95.
# Default features are OFF; only 2D sprite rendering, windowing, input and gamepads are enabled.
# No web or wasm features.
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset",
  "bevy_window", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render",
  "bevy_camera", "bevy_color", "bevy_image", "png", "bevy_gilrs",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["x11", "wayland"] }

# System clipboard on the three desktop platforms (the mobile builds keep an in-app clipboard).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false }

[lints]
workspace = true
