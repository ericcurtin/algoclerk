[package]
name = "algoclerk-levels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shipped AlgoClerk puzzle packs, embedded into the binary"
build = "build.rs"

[dependencies]
algoclerk-core = { workspace = true, default-features = false }

[features]
default = ["compile-tests"]
# Compile the generated C, C++ and Rust of every reference solution with the host compilers.
compile-tests = ["algoclerk-core/compile-tests"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
