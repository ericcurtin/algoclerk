title = "The Cheapest Item on Top"
order = 4
story = "The supply cupboard is a stack of boxes, and the manager keeps asking: what is the cheapest item in the cupboard right now?"
statement = "Process ops in order: a positive number pushes that value; 0 pops the top item (nothing happens if the stack is empty). After every operation record the smallest value currently in the stack, or -1 if it is empty. Return the records."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> minStack(const std::vector<int>& ops)"
constraints = ["0 <= ops.size() <= 20000", "0 <= ops[i] <= 1000"]
technique = "Auxiliary stack of minimums"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>", "<algorithm>"]
hints = [
  "Scanning the whole stack for its minimum after every step is slow.",
  "Keep a second `std::stack<int>` (from `<stack>`): its top is always the minimum of the first stack.",
  "Push `std::min(op, mins.top())` (from `<algorithm>`) on the second stack whenever you push on the first, or just `op` when it is empty; pop both together. `pop()` returns nothing: read `top()` first if you need the value.",
]
reference = '''
#include <algorithm>
#include <stack>

std::vector<int> minStack(const std::vector<int>& ops) {
    std::stack<int> items;
    std::stack<int> mins;
    std::vector<int> out;
    for (int op : ops) {
        if (op == 0) {
            if (!items.empty()) {
                items.pop();
                mins.pop();
            }
        } else {
            items.push(op);
            if (mins.empty()) {
                mins.push(op);
            } else {
                mins.push(std::min(op, mins.top()));
            }
        }
        if (mins.empty()) {
            out.push_back(-1);
        } else {
            out.push_back(mins.top());
        }
    }
    return out;
}
'''
naive = '''
#include <algorithm>

std::vector<int> minStack(const std::vector<int>& ops) {
    std::vector<int> items;
    std::vector<int> out;
    for (int op : ops) {
        if (op == 0) {
            if (!items.empty()) {
                items.pop_back();
            }
        } else {
            items.push_back(op);
        }
        if (items.empty()) {
            out.push_back(-1);
        } else {
            out.push_back(*std::min_element(items.begin(), items.end()));
        }
    }
    return out;
}
'''

