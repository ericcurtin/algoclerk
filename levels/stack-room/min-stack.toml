title = "The Cheapest Item on Top"
order = 4
story = "The supply cupboard is a stack of boxes, and the manager keeps asking: what is the cheapest item in the cupboard right now?"
statement = "Process ops in order: a positive number pushes that value; 0 pops the top item (nothing happens if the stack is empty). After every operation record the smallest value currently in the stack, or -1 if it is empty. Return the records."
signature = "fn min_stack(ops: vec<int>) -> vec<int>"
constraints = ["0 <= len(ops) <= 20000", "0 <= ops[i] <= 1000"]
technique = "Auxiliary stack of minimums"
big_o = "O(n) time, O(n) space"
types = ["stack", "vec"]
builtins = ["is_empty", "min", "peek", "pop", "push"]
hints = [
  "Scanning the whole stack for its minimum after every step is slow.",
  "Keep a second stack: its top is always the minimum of the first stack.",
  "Push `min(op, current min)` on the second stack whenever you push on the first; pop both together.",
]
reference = '''
fn min_stack(ops: vec<int>) -> vec<int> {
    let items = stack<int>();
    let mins = stack<int>();
    let out: vec<int> = [];
    for op in ops {
        if op == 0 {
            if !items.is_empty() {
                items.pop();
                mins.pop();
            }
        } else {
            items.push(op);
            if mins.is_empty() or op < mins.peek() {
                mins.push(op);
            } else {
                mins.push(mins.peek());
            }
        }
        if mins.is_empty() {
            out.push(-1);
        } else {
            out.push(mins.peek());
        }
    }
    return out;
}
'''
naive = '''
fn min_stack(ops: vec<int>) -> vec<int> {
    let items: vec<int> = [];
    let out: vec<int> = [];
    for op in ops {
        if op == 0 {
            if !items.is_empty() {
                items.pop();
            }
        } else {
            items.push(op);
        }
        if items.is_empty() {
            out.push(-1);
        } else {
            out.push(min(items));
        }
    }
    return out;
}
'''

