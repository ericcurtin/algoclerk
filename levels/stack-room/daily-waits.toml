title = "Waiting for Warmer Weather"
order = 2
story = "The window cleaner checks the thermometer every morning and wonders how many days it will be until a warmer day."
statement = "For each day i, return how many days you must wait until a strictly warmer temperature. Use 0 if there is no warmer day."
signature = "fn wait_days(temps: vec<int>) -> vec<int>"
constraints = ["0 <= len(temps) <= 20000"]
technique = "Monotonic stack"
big_o = "O(n) time, O(n) space"
types = ["stack", "vec"]
builtins = ["is_empty", "len", "peek", "pop", "push"]
hints = [
  "Keep a stack of days that are still waiting for a warmer day.",
  "A new temperature settles every waiting day that is colder than it.",
  "Pop while the top is colder: its answer is `i - top`.",
]
reference = '''
fn wait_days(temps: vec<int>) -> vec<int> {
    let out = [0; len(temps)];
    let pending = stack<int>();
    for i in range(len(temps)) {
        while !pending.is_empty() and temps[pending.peek()] < temps[i] {
            let j = pending.pop();
            out[j] = i - j;
        }
        pending.push(i);
    }
    return out;
}
'''
naive = '''
fn wait_days(temps: vec<int>) -> vec<int> {
    let out = [0; len(temps)];
    for i in range(len(temps)) {
        for j in range(i + 1, len(temps)) {
            if temps[j] > temps[i] {
                out[i] = j - i;
                break;
            }
        }
    }
    return out;
}
'''

