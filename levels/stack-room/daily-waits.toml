title = "Waiting for Warmer Weather"
order = 2
story = "The window cleaner checks the thermometer every morning and wonders how many days it will be until a warmer day."
statement = "For each day i, return how many days you must wait until a strictly warmer temperature. Use 0 if there is no warmer day."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> waitDays(const std::vector<int>& temps)"
constraints = ["0 <= temps.size() <= 20000"]
technique = "Monotonic stack"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>"]
hints = [
  "Keep a `std::stack<int>` (from `<stack>`) of days that are still waiting for a warmer day.",
  "A new temperature settles every waiting day that is colder than it.",
  "While the stack is not empty and `temps[pending.top()] < temps[i]`, take `j = pending.top()`, call `pending.pop()` (it returns nothing) and set `out[j] = i - j`. Then push `i`.",
]
reference = '''
#include <stack>

std::vector<int> waitDays(const std::vector<int>& temps) {
    const int n = static_cast<int>(temps.size());
    std::vector<int> out(n, 0);
    std::stack<int> pending;
    for (int i = 0; i < n; ++i) {
        while (!pending.empty() && temps[pending.top()] < temps[i]) {
            const int j = pending.top();
            pending.pop();
            out[j] = i - j;
        }
        pending.push(i);
    }
    return out;
}
'''
naive = '''
std::vector<int> waitDays(const std::vector<int>& temps) {
    const int n = static_cast<int>(temps.size());
    std::vector<int> out(n, 0);
    for (int i = 0; i < n; ++i) {
        for (int j = i + 1; j < n; ++j) {
            if (temps[j] > temps[i]) {
                out[i] = j - i;
                break;
            }
        }
    }
    return out;
}
'''

