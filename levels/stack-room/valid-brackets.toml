title = "Matching Brackets"
order = 1
story = "The typesetter's drawers hold three kinds of brackets. A page is only printable when every bracket that opens is closed by the right kind, in the right order."
statement = "s contains only the characters ( ) [ ] { }. Return true if every opening bracket is closed by the same kind of closing bracket in the correct order."
signature = "fn is_balanced(s: string) -> bool"
constraints = ["0 <= len(s) <= 20000", "s uses only ( ) [ ] { }"]
technique = "Stack"
big_o = "O(n) time, O(n) space"
types = ["char", "stack", "string"]
builtins = ["is_empty", "len", "pop", "push", "replace"]
hints = [
  "The most recent unclosed bracket must be closed first: that is a stack.",
  "Push every opening bracket. For a closing bracket, pop and compare.",
  "Fail if the stack is empty on a closing bracket, and also fail if it is not empty at the end.",
]
reference = '''
fn is_balanced(s: string) -> bool {
    let open = stack<char>();
    for c in s {
        if c == '(' or c == '[' or c == '{' {
            open.push(c);
        } else {
            if open.is_empty() {
                return false;
            }
            let top = open.pop();
            if c == ')' and top != '(' {
                return false;
            }
            if c == ']' and top != '[' {
                return false;
            }
            if c == '}' and top != '{' {
                return false;
            }
        }
    }
    return open.is_empty();
}
'''
naive = '''
fn is_balanced(s: string) -> bool {
    let cur = s;
    while len(cur) > 0 {
        let next = cur.replace("()", "").replace("[]", "").replace("{}", "");
        if len(next) == len(cur) {
            return false;
        }
        cur = next;
    }
    return true;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [98, 77, 61]
speed = [213, 114, 80]

[[examples]]
args = ["\"()[]{}\""]
expect = "true"

[[examples]]
args = ["\"(]\""]
expect = "false"

[[examples]]
args = ["\"([{}])\""]
expect = "true"

[[examples]]
args = ["\"\""]
expect = "true"

[[tests]]
args = ["\")(\""]
expect = "false"

[[tests]]
args = ["\"((\""]
expect = "false"

[[tests]]
args = ["\"{[]}\""]
expect = "true"

