title = "Matching Brackets"
order = 1
story = "The typesetter's drawers hold three kinds of brackets. A page is only printable when every bracket that opens is closed by the right kind, in the right order."
statement = "s contains only the characters ( ) [ ] { }. Return true if every opening bracket is closed by the same kind of closing bracket in the correct order."
prelude = '''
#include <string>
'''
signature = "bool isBalanced(const std::string& s)"
constraints = ["0 <= s.size() <= 20000", "s uses only ( ) [ ] { }"]
technique = "Stack"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>"]
hints = [
  "The most recent unclosed bracket must be closed first: that is a `std::stack<char>` (from `<stack>`).",
  "Push every opening bracket. For a closing bracket, read `top()`, call `pop()` and compare.",
  "Fail if the stack is empty on a closing bracket (`top()` of an empty stack is an error), and also fail if it is not empty at the end.",
]
reference = '''
#include <stack>

bool isBalanced(const std::string& s) {
    std::stack<char> open;
    for (char c : s) {
        if (c == '(' || c == '[' || c == '{') {
            open.push(c);
        } else {
            if (open.empty()) {
                return false;
            }
            const char top = open.top();
            open.pop();
            if (c == ')' && top != '(') {
                return false;
            }
            if (c == ']' && top != '[') {
                return false;
            }
            if (c == '}' && top != '{') {
                return false;
            }
        }
    }
    return open.empty();
}
'''
naive = '''
bool isBalanced(const std::string& s) {
    std::string cur = s;
    bool changed = true;
    while (changed) {
        changed = false;
        for (std::size_t i = 0; i + 1 < cur.size(); ++i) {
            const char a = cur[i];
            const char b = cur[i + 1];
            if ((a == '(' && b == ')') || (a == '[' && b == ']') || (a == '{' && b == '}')) {
                cur.erase(i, 2);
                changed = true;
                break;
            }
        }
    }
    return cur.empty();
}
'''

