title = "Runner-Up Prize"
order = 6
story = "The sales board wants the kth biggest sale of the month, without sorting the entire ledger."
statement = "Return the kth largest number in nums (counting duplicates: in [5, 5, 3] the 2nd largest is 5)."
signature = "fn kth_largest(nums: vec<int>, k: int) -> int"
constraints = ["1 <= k <= len(nums) <= 20000"]
technique = "Heap of size k"
big_o = "O(n log k) time, O(k) space"
types = ["heap", "vec"]
builtins = ["len", "max", "peek", "pop", "push", "remove"]
hints = [
  "A heap keeps the extreme item ready. Ours gives the largest, so store negated numbers to get the smallest.",
  "Push every number (negated); if the heap grows beyond k, pop once.",
  "What remains on top is the kth largest (remember to negate it back).",
]
reference = '''
fn kth_largest(nums: vec<int>, k: int) -> int {
    let h = heap<int>();
    for x in nums {
        h.push(-x);
        if len(h) > k {
            h.pop();
        }
    }
    return -h.peek();
}
'''
naive = '''
fn kth_largest(nums: vec<int>, k: int) -> int {
    let rest = nums;
    for round in range(k - 1) {
        let best = 0;
        for i in range(1, len(rest)) {
            if rest[i] > rest[best] {
                best = i;
            }
        }
        rest.remove(best);
    }
    return max(rest);
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [34, 27, 21]
speed = [191, 102, 71]

[[examples]]
args = ["[3, 2, 1, 5, 6, 4]", "2"]
expect = "5"

[[examples]]
