title = "Back-to-Front Calculator"
order = 3
story = "The old office calculator takes its numbers first and its operator last: 3 4 + means 3 plus 4. The clerk needs a program that reads such tapes."
statement = "tokens is a valid expression in reverse Polish notation: numbers as text, and the operators + - * /. Return its value. Division truncates toward zero."
signature = "fn eval_rpn(tokens: vec<string>) -> int"
constraints = ["1 <= len(tokens) <= 20001", "the expression is valid and never divides by zero"]
technique = "Stack evaluation"
big_o = "O(n) time, O(n) space"
types = ["stack", "string", "vec"]
builtins = ["pop", "push", "to_int"]
hints = [
  "Numbers go on a stack. An operator takes the two top numbers.",
  "Pop `b` first, then `a`: the result is `a op b`.",
  "`to_int(token)` turns a numeral into a number; compare tokens with `==`.",
]
reference = '''
fn eval_rpn(tokens: vec<string>) -> int {
    let st = stack<int>();
    for t in tokens {
        if t == "+" or t == "-" or t == "*" or t == "/" {
            let b = st.pop();
            let a = st.pop();
            if t == "+" {
                st.push(a + b);
            } else if t == "-" {
                st.push(a - b);
            } else if t == "*" {
                st.push(a * b);
            } else {
                st.push(a / b);
            }
        } else {
            st.push(to_int(t));
        }
    }
    return st.pop();
}
'''

