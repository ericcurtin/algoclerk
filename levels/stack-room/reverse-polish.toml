title = "Back-to-Front Calculator"
order = 3
story = "The old office calculator takes its numbers first and its operator last: 3 4 + means 3 plus 4. The clerk needs a program that reads such tapes."
statement = "tokens is a valid expression in reverse Polish notation: numbers as text, and the operators + - * /. Return its value. Division truncates toward zero."
prelude = '''
#include <string>
#include <vector>
'''
signature = "int evalRpn(const std::vector<std::string>& tokens)"
constraints = ["1 <= tokens.size() <= 20001", "the expression is valid and never divides by zero", "every value fits in an int"]
technique = "Stack evaluation"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>"]
hints = [
  "Numbers go on a `std::stack<int>` (from `<stack>`). An operator takes the two top numbers.",
  "Read `top()` and call `pop()` for `b` first, then for `a`: the result is `a op b`.",
  "`std::stoi(token)` turns a numeral into a number (negative ones like \"-4\" too, so check `token.size() == 1` before you treat a '-' as an operator). Compare tokens with `==`, and loop with `const auto& t` to avoid copying each string.",
]
reference = '''
#include <stack>

int evalRpn(const std::vector<std::string>& tokens) {
    std::stack<int> st;
    for (const auto& t : tokens) {
        if (t == "+" || t == "-" || t == "*" || t == "/") {
            const int b = st.top();
            st.pop();
            const int a = st.top();
            st.pop();
            if (t == "+") {
                st.push(a + b);
            } else if (t == "-") {
                st.push(a - b);
            } else if (t == "*") {
                st.push(a * b);
            } else {
                st.push(a / b);
            }
        } else {
            st.push(std::stoi(t));
        }
    }
    return st.top();
}
'''

