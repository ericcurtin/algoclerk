title = "The Tallest in the Window"
order = 5
story = "A camera pans along a row of towers, seeing k of them at a time. For every position the director wants the height of the tallest tower in view."
statement = "Return the maximum of every window of k consecutive numbers of nums, from left to right. 1 <= k <= nums.size()."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> windowMax(const std::vector<int>& nums, int k)"
constraints = ["1 <= nums.size() <= 20000", "1 <= k <= nums.size()"]
technique = "Monotonic deque"
big_o = "O(n) time, O(k) space"
unlocked = ["<deque>", "<algorithm>"]
hints = [
  "Recomputing the maximum of every window costs O(n * k).",
  "Keep a `std::deque<int>` (from `<deque>`) of indices whose values are in decreasing order.",
  "Drop smaller values from the back (`pop_back`) as new numbers arrive, and drop the front (`pop_front`) when it leaves the window. Use `int` indices and `static_cast<int>(nums.size())` for the bound.",
]
reference = '''
#include <deque>

std::vector<int> windowMax(const std::vector<int>& nums, int k) {
    const int n = static_cast<int>(nums.size());
    std::vector<int> out;
    std::deque<int> window;
    for (int i = 0; i < n; ++i) {
        while (!window.empty() && nums[window.back()] <= nums[i]) {
            window.pop_back();
        }
        window.push_back(i);
        if (window.front() <= i - k) {
            window.pop_front();
        }
        if (i >= k - 1) {
            out.push_back(nums[window.front()]);
        }
    }
    return out;
}
'''
naive = '''
#include <algorithm>

std::vector<int> windowMax(const std::vector<int>& nums, int k) {
    const int n = static_cast<int>(nums.size());
    std::vector<int> out;
    for (int i = 0; i + k <= n; ++i) {
        int best = nums[i];
        for (int j = i; j < i + k; ++j) {
            best = std::max(best, nums[j]);
        }
        out.push_back(best);
    }
    return out;
}
'''

