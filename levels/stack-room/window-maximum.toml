title = "The Tallest in the Window"
order = 5
story = "A camera pans along a row of towers, seeing k of them at a time. For every position the director wants the height of the tallest tower in view."
statement = "Return the maximum of every window of k consecutive numbers of nums, from left to right. 1 <= k <= len(nums)."
signature = "fn window_max(nums: vec<int>, k: int) -> vec<int>"
constraints = ["1 <= len(nums) <= 20000", "1 <= k <= len(nums)"]
technique = "Monotonic deque"
big_o = "O(n) time, O(k) space"
types = ["deque", "vec"]
builtins = ["back", "front", "is_empty", "len", "max", "pop_back", "pop_front", "push", "push_back"]
hints = [
  "Recomputing the maximum of every window costs O(n * k).",
  "Keep a deque of indices whose values are in decreasing order.",
  "Drop smaller values from the back as new numbers arrive, and drop the front when it leaves the window.",
]
reference = '''
fn window_max(nums: vec<int>, k: int) -> vec<int> {
    let out: vec<int> = [];
    let dq = deque<int>();
    for i in range(len(nums)) {
        while !dq.is_empty() and nums[dq.back()] <= nums[i] {
            dq.pop_back();
        }
        dq.push_back(i);
        if dq.front() <= i - k {
            dq.pop_front();
        }
        if i >= k - 1 {
            out.push(nums[dq.front()]);
        }
    }
    return out;
}
'''
naive = '''
fn window_max(nums: vec<int>, k: int) -> vec<int> {
    let out: vec<int> = [];
    for i in range(len(nums) - k + 1) {
        let best = nums[i];
        for j in range(i, i + k) {
            best = max(best, nums[j]);
        }
        out.push(best);
    }
    return out;
}
'''

