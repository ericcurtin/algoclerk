title = "Merging the Queues"
order = 7
story = "Several branch offices each send a list of ticket numbers, already in order. Head office wants a single ordered list."
statement = "Merge the sorted lists into one sorted list that contains all their numbers (duplicates are kept)."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> mergeSorted(const std::vector<std::vector<int>>& lists)"
constraints = ["0 <= lists.size() <= 200", "total numbers <= 20000", "every list is sorted ascending"]
technique = "Heap of list heads"
big_o = "O(n log k) time, O(k) space"
unlocked = ["<queue>", "<functional>", "<tuple>"]
hints = [
  "Repeatedly taking the smallest head among k lists by scanning is O(n * k).",
  "Keep the current head of every list in a `std::priority_queue`. By default it hands out the largest item, so use `std::priority_queue<T, std::vector<T>, std::greater<T>>` (needs `<functional>`) to get the smallest.",
  "Let `T` be `std::tuple<int, int, int>` (value, list index, position) from `<tuple>`: tuples compare field by field. After popping, push the next element of that list. `auto [value, i, j] = heap.top();` unpacks the tuple; take `lists` by `const&`, so the lists are never copied.",
]
reference = '''
#include <functional>
#include <queue>
#include <tuple>

using Head = std::tuple<int, int, int>;

std::vector<int> mergeSorted(const std::vector<std::vector<int>>& lists) {
    std::priority_queue<Head, std::vector<Head>, std::greater<Head>> heap;
    for (int i = 0; i < static_cast<int>(lists.size()); ++i) {
        if (!lists[i].empty()) {
            heap.push(Head{lists[i][0], i, 0});
        }
    }
    std::vector<int> out;
    while (!heap.empty()) {
        auto [value, i, j] = heap.top();
        heap.pop();
        out.push_back(value);
        if (j + 1 < static_cast<int>(lists[i].size())) {
            heap.push(Head{lists[i][j + 1], i, j + 1});
        }
    }
    return out;
}
'''
naive = '''
std::vector<int> mergeSorted(const std::vector<std::vector<int>>& lists) {
    const int k = static_cast<int>(lists.size());
    std::vector<int> pos(k, 0);
    std::vector<int> out;
    while (true) {
        int best = -1;
        for (int i = 0; i < k; ++i) {
            if (pos[i] < static_cast<int>(lists[i].size()) &&
                (best < 0 || lists[i][pos[i]] < lists[best][pos[best]])) {
                best = i;
            }
        }
        if (best < 0) {
            break;
        }
        out.push_back(lists[best][pos[best]]);
        ++pos[best];
    }
    return out;
}
'''

