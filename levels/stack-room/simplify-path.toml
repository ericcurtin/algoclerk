title = "Tidy the Directions"
order = 8
story = "Visitors get directions like /a/./b/../c/. The receptionist wants the shortest equivalent path before she prints the map."
statement = "Simplify the path (which starts with /): ignore empty parts and \".\", let \"..\" go back up one level (nothing happens at the top), and return the cleaned path starting with / with no trailing / (except for the root path \"/\"). Other parts, even ones like \"...\", are normal names."
prelude = '''
#include <string>
#include <vector>
'''
signature = "std::string simplifyPath(const std::string& path)"
constraints = ["1 <= path.size() <= 20000", "path starts with /"]
technique = "Stack of path parts"
big_o = "O(n) time, O(n) space"
hints = [
  "Cut the path into parts at every '/': collect letters in a `std::string part` and handle it when you reach a '/' or the end of the path (loop `i` up to and including `path.size()`).",
  "Push normal names on a `std::vector<std::string>` used as a stack (`push_back`, `pop_back`); \"..\" pops (if there is something to pop); \"\" and \".\" do nothing. Do not forget `part.clear();`.",
  "Build the answer with `out += '/'; out += p;` for each kept part, and return \"/\" when the result is empty.",
]
reference = '''
std::string simplifyPath(const std::string& path) {
    std::vector<std::string> parts;
    std::string part;
    for (std::size_t i = 0; i <= path.size(); ++i) {
        if (i == path.size() || path[i] == '/') {
            if (part == "..") {
                if (!parts.empty()) {
                    parts.pop_back();
                }
            } else if (!part.empty() && part != ".") {
                parts.push_back(part);
            }
            part.clear();
        } else {
            part += path[i];
        }
    }
    std::string out;
    for (const auto& p : parts) {
        out += '/';
        out += p;
    }
    if (out.empty()) {
        return "/";
    }
    return out;
}
'''

[budgets]
large_steps = 3000000

