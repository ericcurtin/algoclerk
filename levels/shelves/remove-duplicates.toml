id = "remove-duplicates"
title = "De-Dupe"
order = 5
summary = "Remove repeated numbers from a sorted list."
story = "The mailing list was merged from several sources and sorted, but many addresses appear several times in a row. Each should be written only once."
statement = "The inbox holds a list of numbers in non-decreasing order, followed by a 0 marker. Output the list with every repeated number removed, keeping the order."
constraints = ["The list has between 0 and 10 numbers, each between 1 and 6, sorted in non-decreasing order."]
hints = [
  "Because the list is sorted, equal numbers are neighbours. Remember the last number you wrote.",
  "Output the first number unconditionally. For every other number, compare it with the last one written.",
]

[[examples]]
input = [1, 1, 2, 3, 3, 3, 5, 0]
output = [1, 2, 3, 5]

[machine]
floor = 2
names = ["last", "candidate"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "jump", "jumpz"]

[tests]
seed = 405
[[tests.fixed]]
input = [0]
output = []
[[tests.fixed]]
input = [4, 0]
output = [4]
[[tests.fixed]]
input = [2, 2, 2, 2, 0]
output = [2]
[[tests.fixed]]
input = [1, 2, 3, 4, 5, 6, 0]
output = [1, 2, 3, 4, 5, 6]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [0, 10], range = [1, 6], sort = "asc", terminator = 0 }]

[targets]
size_par = 16
size_ace = 13
speed_par = 42
speed_ace = 28

[solution]
asm = """
    INBOX
    JUMPZ done
    COPYTO 0
    OUTBOX
again:
    INBOX
    JUMPZ done
    COPYTO 1
    SUB 0
    JUMPZ again
    COPYFROM 1
    COPYTO 0
    OUTBOX
    JUMP again
done:
"""

[code]
function = "dedupe_sorted"
doc = "Returns the values of a sorted list with repeats removed."
params = [{ name = "values", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Two-pointer scan over sorted data"
text = "Sorted data groups equal values together, so comparing each element with the last kept one is enough. No hash set and no extra memory proportional to the input is needed."
