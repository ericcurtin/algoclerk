id = "merge-sorted"
title = "Zipper"
order = 7
summary = "Merge two sorted lists into one sorted list."
story = "Two sorted ledgers must be combined into one before the auditors arrive. The first ledger is read onto the shelf; the second is streamed past it."
statement = "The inbox holds two lists, each sorted in non-decreasing order and each followed by a 0 marker. Output all numbers of both lists in one sorted sequence."
constraints = ["The first list has between 0 and 5 numbers and the second between 0 and 6.", "Every number is between 1 and 20.", "Tile 0 holds 3 and tile 1 holds 4 at the start. Tiles 4 to 8 are free for the first list."]
hints = [
  "Store the first list on the shelf. Tile 0 is the address of its last element, tile 1 the address of the next element to output.",
  "For each number b of the second list, first output every stored number smaller than b, then output b.",
  "When the second list ends, output whatever is left of the first.",
]

[[examples]]
input = [1, 4, 6, 0, 2, 3, 7, 0]
output = [1, 2, 3, 4, 6, 7]

[machine]
floor = 9
names = ["last", "next", "tmp"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "bumpup", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
0 = 3
1 = 4

[tests]
seed = 407
[[tests.fixed]]
input = [0, 0]
output = []
[[tests.fixed]]
input = [5, 0, 0]
output = [5]
[[tests.fixed]]
input = [0, 5, 0]
output = [5]
[[tests.fixed]]
input = [1, 2, 3, 0, 4, 5, 6, 0]
output = [1, 2, 3, 4, 5, 6]
[[tests.fixed]]
input = [4, 5, 6, 0, 1, 2, 3, 0]
output = [1, 2, 3, 4, 5, 6]
[[tests.fixed]]
input = [2, 2, 0, 2, 2, 0]
output = [2, 2, 2, 2]
[[tests.generators]]
count = 9
inbox = [
  { kind = "list", len = [0, 5], range = [1, 20], sort = "asc", terminator = 0 },
  { kind = "list", len = [0, 6], range = [1, 20], sort = "asc", terminator = 0 },
]

[targets]
size_par = 38
size_ace = 31
speed_par = 108
speed_ace = 72

[solution]
asm = """
store:
    INBOX
    JUMPZ stream
    COPYTO 2
    BUMPUP 0
    COPYFROM 2
    COPYTO [0]
    JUMP store
stream:
    INBOX
    JUMPZ flush
    COPYTO 2
drain:
    COPYFROM 0
    SUB 1
    JUMPN emit
    COPYFROM [1]
    SUB 2
    JUMPN take
    JUMP emit
take:
    COPYFROM [1]
    OUTBOX
    BUMPUP 1
    JUMP drain
emit:
    COPYFROM 2
    OUTBOX
    JUMP stream
flush:
    COPYFROM 0
    SUB 1
    JUMPN done
    COPYFROM [1]
    OUTBOX
    BUMPUP 1
    JUMP flush
done:
"""

[code]
function = "merge_sorted"
doc = "Merges two sorted lists into one sorted list."
params = [{ name = "first", kind = "terminated" }, { name = "second", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Merge step of merge sort"
text = "Repeatedly emitting the smaller of the two list heads merges two sorted lists in linear time. This is the building block of merge sort and of external sorting."
