id = "valid-brackets"
title = "Matching Stamps"
order = 8
summary = "Check that every opening stamp is closed by the right closing stamp."
story = "The notary uses two kinds of stamps. Each opening stamp must be closed by its twin, and stamp pairs may be nested but never crossed. A stack of open stamps lives on the shelf."
statement = "The inbox holds a sequence of non-zero numbers followed by a 0 marker. A positive number k opens a stamp of kind k and the number -k closes it. The sequence is balanced if every closing stamp matches the most recent unclosed opening stamp, and nothing remains open at the end. Output 1 if balanced, otherwise 0."
constraints = ["The sequence has between 0 and 8 numbers, each one of 1, 2, -1, -2.", "Tile 0 holds 3, tile 2 holds 3 and tile 3 holds 1 at the start. Tiles 4 to 11 are free for the stack."]
hints = [
  "Keep a stack on the shelf: tile 0 is the address of its top element, and tile 2 is the address of an empty stack.",
  "Push each opening number. For a closing number, the top of the stack plus the closer must be 0.",
  "An empty stack when a closer arrives is an error, and so is a non-empty stack at the end.",
]

[[examples]]
input = [1, 2, -2, -1, 0]
output = [1]

[[examples]]
input = [1, 2, -1, -2, 0]
output = [0]
note = "The stamps cross."

[machine]
floor = 12
names = ["top", "tmp", "bottom", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "bumpup", "bumpdn", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
0 = 3
2 = 3
3 = 1

[tests]
seed = 408
[[tests.fixed]]
input = [0]
output = [1]
[[tests.fixed]]
input = [-1, 0]
output = [0]
[[tests.fixed]]
input = [1, 0]
output = [0]
[[tests.fixed]]
input = [2, -1, 0]
output = [0]
[[tests.fixed]]
input = [1, 1, 1, 1, -1, -1, -1, -1, 0]
output = [1]
[[tests.fixed]]
input = [1, -1, 2, -2, 1, -1, 2, -2, 0]
output = [1]
[[tests.generators]]
count = 8
inbox = [{ kind = "balanced", len = [2, 8], kinds = 2, chance = 55, terminator = 0 }]
[[tests.generators]]
count = 3
inbox = [{ kind = "balanced", len = [2, 8], kinds = 1, chance = 50, terminator = 0 }]

[targets]
size_par = 35
size_ace = 28
speed_par = 54
speed_ace = 36

[solution]
asm = """
again:
    INBOX
    JUMPZ finish
    JUMPN close
    COPYTO 1
    BUMPUP 0
    COPYFROM 1
    COPYTO [0]
    JUMP again
close:
    COPYTO 1
    COPYFROM 0
    SUB 2
    JUMPZ out
    COPYFROM [0]
    ADD 1
    JUMPZ pop
    COPYFROM 1
    SUB 1
    JUMP out
pop:
    BUMPDN 0
    JUMP again
finish:
    COPYFROM 0
    SUB 2
    JUMPZ yes
    COPYTO 1
    SUB 1
    JUMP out
yes:
    COPYFROM 3
out:
    OUTBOX
"""

[code]
function = "is_balanced"
doc = "Returns true if every closing stamp matches the latest open one and none stay open."
params = [{ name = "stamps", kind = "terminated" }]
returns = "scalar"
return_type = "bool"

[explain]
algorithm = "Stack-based bracket matching"
text = "The most recent unclosed opener must match the next closer, which is exactly last-in-first-out behaviour. The array on the shelf is a stack; tile 0 is its top pointer."
