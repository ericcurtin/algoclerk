id = "reverse-list"
title = "Last In, First Out"
order = 1
summary = "Output a list in reverse order."
story = "The archive wing has a long shelf. Tiles can now point at other tiles: writing [0] means 'the tile whose number is stored on tile 0'. That is all you need to build an array."
statement = "The inbox holds a list of non-zero numbers followed by a 0 marker. Output the numbers in reverse order, without the marker."
constraints = ["The list has between 0 and 8 numbers.", "Every number is between -9 and 9 and is not 0.", "Tile 0 holds 0 at the start. Tiles 1 to 8 are free for the list."]
hints = [
  "Use tile 0 as a counter that doubles as the address of the last stored value.",
  "BUMPUP 0 gives you the next free address. Then COPYTO [0] stores your value there.",
  "To read back, COPYFROM [0], then BUMPDN 0 moves to the previous value. Stop at zero.",
]

[[examples]]
input = [1, 2, 3, 0]
output = [3, 2, 1]

[machine]
floor = 10
names = ["count", "", "", "", "", "", "", "", "", "saved"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "bumpup", "bumpdn", "jump", "jumpz", "indirect"]
[machine.prefill]
0 = 0

[tests]
seed = 401
[[tests.fixed]]
input = [0]
output = []
[[tests.fixed]]
input = [5, 0]
output = [5]
[[tests.fixed]]
input = [1, -1, 2, -2, 3, -3, 4, -4, 0]
output = [-4, 4, -3, 3, -2, 2, -1, 1]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [0, 8], range = [-9, 9], nonzero = true, terminator = 0 }]

[targets]
size_par = 16
size_ace = 13
speed_par = 50
speed_ace = 33

[solution]
asm = """
read:
    INBOX
    JUMPZ unwind
    COPYTO 9
    BUMPUP 0
    COPYFROM 9
    COPYTO [0]
    JUMP read
unwind:
    COPYFROM 0
more:
    JUMPZ done
    COPYFROM [0]
    OUTBOX
    BUMPDN 0
    JUMP more
done:
"""

[code]
function = "reverse_list"
doc = "Returns the values in reverse order."
params = [{ name = "values", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Stack (array with a top pointer)"
text = "Pushing everything onto a stack and popping it again reverses the order. The array is a stack because only its top element, found through the pointer on tile 0, is ever touched."
