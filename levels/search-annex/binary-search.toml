title = "Halving the Catalogue"
order = 1
story = "The library catalogue is sorted by number. Walking the whole shelf to find one card takes all day; the librarian wants to find it in a few steps."
statement = "nums is sorted in ascending order with all values different. Return the index of target, or -1 if it is not there. Linear scans are too slow here!"
signature = "fn search(nums: vec<int>, target: int) -> int"
constraints = ["0 <= len(nums) <= 20000", "nums is strictly increasing"]
technique = "Binary search"
big_o = "O(log n) time, O(1) space"
types = ["vec"]
builtins = ["len"]
hints = [
  "Look at the middle element: it tells you which half to keep.",
  "Keep two indices `lo` and `hi` around the part that can still hold target.",
  "`let mid = lo + (hi - lo) / 2;` then move `lo` or `hi` past `mid`.",
]
reference = '''
fn search(nums: vec<int>, target: int) -> int {
    let lo = 0;
    let hi = len(nums) - 1;
    while lo <= hi {
        let mid = lo + (hi - lo) / 2;
        if nums[mid] == target {
            return mid;
        }
        if nums[mid] < target {
            lo = mid + 1;
        } else {
            hi = mid - 1;
        }
    }
    return -1;
}
'''
naive = '''
fn search(nums: vec<int>, target: int) -> int {
    for i in range(len(nums)) {
        if nums[i] == target {
            return i;
        }
    }
    return -1;
}
'''

[budgets]
steps = 200000
large_steps = 20000

[medals]
size = [72, 57, 45]
speed = [92, 49, 35]

[[examples]]
args = ["[-1, 0, 3, 5, 9, 12]", "9"]
expect = "4"

[[examples]]
args = ["[-1, 0, 3, 5, 9, 12]", "2"]
expect = "-1"

[[examples]]
args = ["[]", "1"]
expect = "-1"

[[tests]]
args = ["[5]", "5"]
expect = "0"

[[tests]]
args = ["[1, 3]", "3"]
expect = "1"

[[generate]]
seed = 401
count = 12
args = [
  { kind = "vec_int", len = [0, 12], range = [0, 40], sorted = true, distinct = true },
  { kind = "int", pick_from = 0, miss = 30, range = [-2, 42] },
]

