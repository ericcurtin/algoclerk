title = "The Best Streak"
order = 7
story = "A shop's daily profit goes up and down. Which run of consecutive days earned the most in total?"
statement = "Return the largest sum of any non-empty contiguous run of nums."
prelude = '''
#include <vector>
'''
signature = "int maxSubarray(const std::vector<int>& nums)"
constraints = ["1 <= nums.size() <= 20000"]
technique = "Kadane's algorithm"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>"]
hints = [
  "Track the best sum of a run that ends at the current day.",
  "That is either the current number alone or the current number added to the previous best run. `std::max` (from `<algorithm>`) picks the larger of two values of the same type.",
  "`cur = std::max(nums[i], cur + nums[i]);` and keep the overall best. Start both from `nums[0]`: the shelf is never empty, and a run must contain at least one day.",
]
reference = '''
#include <algorithm>

int maxSubarray(const std::vector<int>& nums) {
    int best = nums[0];
    int cur = nums[0];
    for (int i = 1; i < static_cast<int>(nums.size()); ++i) {
        cur = std::max(nums[i], cur + nums[i]);
        best = std::max(best, cur);
    }
    return best;
}
'''
naive = '''
#include <algorithm>

int maxSubarray(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    int best = nums[0];
    for (int i = 0; i < n; ++i) {
        int sum = 0;
        for (int j = i; j < n; ++j) {
            sum += nums[j];
            best = std::max(best, sum);
        }
    }
    return best;
}
'''

[budgets]
