title = "Overlapping Bookings"
order = 6
story = "The meeting-room calendar has bookings that overlap. The caretaker wants the fewest unbroken blocks of time."
statement = "intervals holds {start, end} pairs. Merge all intervals that overlap or touch (end of one equals the start of the next) and return the merged intervals sorted by start."
prelude = '''
#include <vector>
'''
signature = "std::vector<std::vector<int>> mergeIntervals(const std::vector<std::vector<int>>& intervals)"
constraints = ["0 <= intervals.size() <= 5000", "start <= end"]
technique = "Sort then sweep"
big_o = "O(n log n) time, O(n) space"
unlocked = ["<algorithm>", "<utility>"]
hints = [
  "After sorting by start, only the last merged interval can overlap the next one.",
  "`std::sort` on a `std::vector<std::vector<int>>` orders the pairs lexicographically, so {start, end} pairs sort by start. `intervals` is a read-only `const&`: sort a copy (`auto ordered = intervals;`, which costs one copy of every number).",
  "If the next start is <= `out.back()[1]`, extend that end to the larger end with `std::max`; otherwise `out.push_back(iv)`. Check `out.empty()` first.",
]
reference = '''
#include <algorithm>

std::vector<std::vector<int>> mergeIntervals(const std::vector<std::vector<int>>& intervals) {
    std::vector<std::vector<int>> ordered = intervals;
    std::sort(ordered.begin(), ordered.end());
    std::vector<std::vector<int>> out;
    for (const auto& iv : ordered) {
        if (!out.empty() && out.back()[1] >= iv[0]) {
            out.back()[1] = std::max(out.back()[1], iv[1]);
        } else {
            out.push_back(iv);
        }
    }
    return out;
}
'''
naive = '''
#include <algorithm>
#include <utility>

std::vector<std::vector<int>> mergeIntervals(const std::vector<std::vector<int>>& intervals) {
    std::vector<std::vector<int>> items = intervals;
    const int n = static_cast<int>(items.size());
    for (int i = 1; i < n; ++i) {
        for (int j = i; j > 0 && items[j - 1][0] > items[j][0]; --j) {
            std::swap(items[j - 1], items[j]);
        }
    }
    std::vector<std::vector<int>> out;
    for (const auto& iv : items) {
        if (!out.empty() && out.back()[1] >= iv[0]) {
            out.back()[1] = std::max(out.back()[1], iv[1]);
        } else {
            out.push_back(iv);
        }
    }
    return out;
}
'''

