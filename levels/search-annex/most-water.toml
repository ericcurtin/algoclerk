title = "The Widest Tank"
order = 8
story = "Vertical boards stand along a wall. Pick two of them as the sides of a water tank: the tank holds as much as the shorter side allows across the distance between them."
statement = "heights[i] is the height of board i. Choose two boards i < j; the water held is min(heights[i], heights[j]) * (j - i). Return the maximum, or 0 if there are fewer than two boards."
prelude = '''
#include <vector>
'''
signature = "int maxArea(const std::vector<int>& heights)"
constraints = ["0 <= heights.size() <= 20000"]
technique = "Two pointers"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>"]
hints = [
  "Start with the widest pair: first and last board.",
  "Moving the taller board inward can never help: the height is limited by the shorter one.",
  "Move the pointer at the shorter board inward and keep the best area with `std::max` / `std::min` (both from `<algorithm>`). With `int j = static_cast<int>(heights.size()) - 1;` an empty shelf simply never enters the loop.",
]
reference = '''
#include <algorithm>

int maxArea(const std::vector<int>& heights) {
    int i = 0;
    int j = static_cast<int>(heights.size()) - 1;
    int best = 0;
    while (i < j) {
        best = std::max(best, std::min(heights[i], heights[j]) * (j - i));
        if (heights[i] < heights[j]) {
            ++i;
        } else {
            --j;
        }
    }
    return best;
}
'''
naive = '''
#include <algorithm>

int maxArea(const std::vector<int>& heights) {
    const int n = static_cast<int>(heights.size());
    int best = 0;
    for (int i = 0; i < n; ++i) {
        for (int j = i + 1; j < n; ++j) {
            best = std::max(best, std::min(heights[i], heights[j]) * (j - i));
        }
    }
    return best;
}
'''

