title = "The Widest Tank"
order = 8
story = "Vertical boards stand along a wall. Pick two of them as the sides of a water tank: the tank holds as much as the shorter side allows across the distance between them."
statement = "heights[i] is the height of board i. Choose two boards i < j; the water held is min(heights[i], heights[j]) * (j - i). Return the maximum, or 0 if there are fewer than two boards."
signature = "fn max_area(heights: vec<int>) -> int"
constraints = ["0 <= len(heights) <= 20000"]
technique = "Two pointers"
big_o = "O(n) time, O(1) space"
types = ["vec"]
builtins = ["len", "max", "min"]
hints = [
  "Start with the widest pair: first and last board.",
  "Moving the taller board inward can never help: the height is limited by the shorter one.",
  "Move the pointer at the shorter board inward and keep the best area.",
]
reference = '''
fn max_area(heights: vec<int>) -> int {
    let i = 0;
    let j = len(heights) - 1;
    let best = 0;
    while i < j {
        best = max(best, min(heights[i], heights[j]) * (j - i));
        if heights[i] < heights[j] {
            i += 1;
        } else {
            j -= 1;
        }
    }
    return best;
}
'''
naive = '''
fn max_area(heights: vec<int>) -> int {
    let best = 0;
    for i in range(len(heights)) {
        for j in range(i + 1, len(heights)) {
            best = max(best, min(heights[i], heights[j]) * (j - i));
        }
    }
    return best;
}
'''

