title = "The Shifted Shelf"
order = 2
story = "Someone moved the front of the sorted shelf to the back. The numbers are still in two sorted runs. Find a card without sorting again."
statement = "nums was sorted ascending (all values different) and then rotated. Return the index of target or -1. Aim for O(log n); the library search tools (`std::find`, `std::binary_search`, `std::lower_bound`, `std::min_element`) are locked."
prelude = '''
#include <vector>
'''
signature = "int searchRotated(const std::vector<int>& nums, int target)"
constraints = ["0 <= nums.size() <= 20000", "values are different"]
technique = "Modified binary search"
big_o = "O(log n) time, O(1) space"
locked = [
  { name = "std::find", why = "A scan looks at every card; halving is the lesson." },
  { name = "std::binary_search", why = "It only works on a plainly sorted shelf, and would not find the index anyway." },
  { name = "std::lower_bound", why = "It only works on a plainly sorted shelf." },
  { name = "std::min_element", why = "Scanning for the break point costs a full pass." },
  { name = "<algorithm>", why = "That drawer only holds tools that scan the shelf for you." },
]
hints = [
  "At least one half of any split is properly sorted.",
  "Compare `nums[lo]` with `nums[mid]` to see which half is sorted. Walk with two `int` indices, starting from `hi = static_cast<int>(nums.size()) - 1`.",
  "If target lies inside the sorted half, search it; otherwise search the other half. `nums` is a `const&`: passing it by value would copy the shelf and spoil the O(log n).",
]
reference = '''
int searchRotated(const std::vector<int>& nums, int target) {
    int lo = 0;
    int hi = static_cast<int>(nums.size()) - 1;
    while (lo <= hi) {
        const int mid = lo + (hi - lo) / 2;
        if (nums[mid] == target) {
            return mid;
        }
        if (nums[lo] <= nums[mid]) {
            if (nums[lo] <= target && target < nums[mid]) {
                hi = mid - 1;
            } else {
                lo = mid + 1;
            }
        } else {
            if (nums[mid] < target && target <= nums[hi]) {
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
    }
    return -1;
}
'''
naive = '''
int searchRotated(const std::vector<int>& nums, int target) {
    const int n = static_cast<int>(nums.size());
    for (int i = 0; i < n; ++i) {
        if (nums[i] == target) {
            return i;
        }
    }
    return -1;
}
'''

[budgets]
steps = 200000
large_steps = 20000

[medals]
size = [154, 120, 96]
speed = [173, 93, 65]

[[examples]]
args = ["{4, 5, 6, 7, 0, 1, 2}", "0"]
expect = "4"

[[examples]]
args = ["{4, 5, 6, 7, 0, 1, 2}", "3"]
expect = "-1"

[[examples]]
args = ["{1}", "1"]
expect = "0"

[[tests]]
