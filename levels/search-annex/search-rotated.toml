title = "The Shifted Shelf"
order = 2
story = "Someone moved the front of the sorted shelf to the back. The numbers are still in two sorted runs. Find a card without sorting again."
statement = "nums was sorted ascending (all values different) and then rotated. Return the index of target or -1. Aim for O(log n)."
signature = "fn search_rotated(nums: vec<int>, target: int) -> int"
constraints = ["0 <= len(nums) <= 20000", "values are different"]
technique = "Modified binary search"
big_o = "O(log n) time, O(1) space"
types = ["vec"]
builtins = ["len"]
hints = [
  "At least one half of any split is properly sorted.",
  "Compare `nums[lo]` with `nums[mid]` to see which half is sorted.",
  "If target lies inside the sorted half, search it; otherwise search the other half.",
]
reference = '''
fn search_rotated(nums: vec<int>, target: int) -> int {
    let lo = 0;
    let hi = len(nums) - 1;
    while lo <= hi {
        let mid = lo + (hi - lo) / 2;
        if nums[mid] == target {
            return mid;
        }
        if nums[lo] <= nums[mid] {
            if nums[lo] <= target and target < nums[mid] {
                hi = mid - 1;
            } else {
                lo = mid + 1;
            }
        } else {
            if nums[mid] < target and target <= nums[hi] {
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
    }
    return -1;
}
'''
naive = '''
fn search_rotated(nums: vec<int>, target: int) -> int {
    for i in range(len(nums)) {
        if nums[i] == target {
            return i;
        }
    }
    return -1;
}
'''

[budgets]
steps = 200000
large_steps = 20000

[medals]
