title = "Sort It Yourself"
order = 10
story = "The sorting machine is broken, and the order desk is open. Sort the numbers by hand, but cleverly: dividing the pile is faster than shuffling it around."
statement = "Return nums in ascending order. The library sorting tools (`std::sort`, `std::stable_sort`, `std::partial_sort`, `std::merge`, `std::inplace_merge`) are locked. Helper functions and recursion are unlocked."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> sortShelf(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 3000"]
technique = "Merge sort (divide and conquer)"
big_o = "O(n log n) time, O(n) space"
locked = [
  { name = "std::sort", why = "Sorting it yourself is the lesson." },
  { name = "std::stable_sort", why = "Same reason." },
  { name = "std::partial_sort", why = "Same reason." },
  { name = "std::merge", why = "Merging is the half of the lesson you have to write." },
  { name = "std::inplace_merge", why = "Same reason." },
  { name = "<algorithm>", why = "That drawer only holds tools that sort or merge for you." },
]
hints = [
  "Split the shelf in the middle, sort both halves, then merge.",
  "Merging two sorted shelves: repeatedly take the smaller front item. Write it as a helper `std::vector<int> mergeHalves(const std::vector<int>& left, const std::vector<int>& right)`.",
  "`sortShelf` can call itself on the halves: `std::vector<int> left(nums.begin(), nums.begin() + mid);` copies the first half (a copy costs its length, which is where the O(n) per level comes from). Take every shelf by `const&` so that only these deliberate copies are charged.",
]
reference = '''
std::vector<int> mergeHalves(const std::vector<int>& left, const std::vector<int>& right) {
    const int n = static_cast<int>(left.size());
    const int m = static_cast<int>(right.size());
    std::vector<int> out;
    int i = 0;
    int j = 0;
    while (i < n && j < m) {
        if (left[i] <= right[j]) {
            out.push_back(left[i]);
            ++i;
        } else {
            out.push_back(right[j]);
            ++j;
        }
    }
    while (i < n) {
        out.push_back(left[i]);
        ++i;
    }
    while (j < m) {
        out.push_back(right[j]);
        ++j;
    }
    return out;
}

std::vector<int> sortShelf(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    if (n <= 1) {
        return nums;
    }
    const int mid = n / 2;
    const std::vector<int> left = sortShelf(std::vector<int>(nums.begin(), nums.begin() + mid));
    const std::vector<int> right = sortShelf(std::vector<int>(nums.begin() + mid, nums.end()));
    return mergeHalves(left, right);
}
'''
naive = '''
std::vector<int> sortShelf(const std::vector<int>& nums) {
    std::vector<int> out = nums;
    const int n = static_cast<int>(out.size());
    for (int i = 1; i < n; ++i) {
        const int value = out[i];
        int j = i;
        while (j > 0 && out[j - 1] > value) {
            out[j] = out[j - 1];
            --j;
        }
        out[j] = value;
    }
    return out;
}
'''

