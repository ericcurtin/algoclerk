title = "Spin the Carousel"
order = 4
story = "The parcel carousel turns k places to the right: the last k parcels come round to the front."
statement = "Return nums rotated to the right by k places: the last k % nums.size() items move to the front, in order. `std::rotate` is locked."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> rotateShelf(const std::vector<int>& nums, int k)"
constraints = ["0 <= nums.size() <= 20000", "0 <= k <= 100000"]
technique = "Slicing and concatenation"
big_o = "O(n) time, O(n) space"
locked = [
  { name = "std::rotate", why = "It is exactly this job, done for you." },
  { name = "std::rotate_copy", why = "Same reason." },
]
hints = [
  "Rotating by k and by k % n is the same. Be careful with an empty shelf: k % 0 is a division by zero.",
  "The answer is the last `shift` items followed by the first `n - shift` items.",
  "A vector can be built from a pair of iterators: `std::vector<int> out(nums.end() - shift, nums.end());`, then `out.insert(out.end(), nums.begin(), nums.end() - shift);` appends the rest. `nums` is a read-only `const&`, so only these two copies cost anything.",
]
reference = '''
std::vector<int> rotateShelf(const std::vector<int>& nums, int k) {
    const int n = static_cast<int>(nums.size());
    if (n == 0) {
        return {};
    }
    const int shift = k % n;
    std::vector<int> out(nums.end() - shift, nums.end());
    out.insert(out.end(), nums.begin(), nums.end() - shift);
    return out;
}
'''
naive = '''
std::vector<int> rotateShelf(const std::vector<int>& nums, int k) {
    const int n = static_cast<int>(nums.size());
    std::vector<int> out = nums;
    if (n == 0) {
        return out;
    }
    for (int round = 0; round < k % n; ++round) {
        out.insert(out.begin(), out.back());
        out.pop_back();
    }
    return out;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [68, 53, 42]
speed = [73, 39, 28]

[[examples]]
args = ["{1, 2, 3, 4, 5, 6, 7}", "3"]
expect = "{5, 6, 7, 1, 2, 3, 4}"

[[examples]]
args = ["{1, 2}", "5"]
expect = "{2, 1}"

[[examples]]
args = ["{}", "4"]
expect = "{}"

[[tests]]
args = ["{1, 2, 3}", "0"]
expect = "{1, 2, 3}"

[[tests]]
args = ["{1, 2, 3}", "3"]
expect = "{1, 2, 3}"

