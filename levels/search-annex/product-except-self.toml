title = "Everyone Else's Product"
order = 5
story = "The statistician wants, for every measurement, the product of all the other measurements, and her calculator has no divide key."
statement = "Return a shelf where slot i holds the product of every number in nums except nums[i]. Do not use division."
prelude = '''
#include <vector>
'''
signature = "std::vector<long long> productExceptSelf(const std::vector<long long>& nums)"
constraints = ["0 <= nums.size() <= 20000", "the product of all numbers fits in a 64-bit number"]
technique = "Prefix and suffix products"
big_o = "O(n) time, O(n) space"
hints = [
  "The answer for slot i is (product of everything left of i) * (product of everything right of i).",
  "A first pass fills the slots with the left products: `std::vector<long long> out(n, 1);` and a running `long long left = 1;`. Products grow fast, which is why this level uses `long long` instead of `int` (an `int` overflow is undefined behaviour in C++).",
  "A second pass from the right multiplies in the right products with a running variable: `for (int i = n - 1; i >= 0; --i) { out[i] *= right; right *= nums[i]; }`.",
]
reference = '''
std::vector<long long> productExceptSelf(const std::vector<long long>& nums) {
    const int n = static_cast<int>(nums.size());
    std::vector<long long> out(n, 1);
    long long left = 1;
    for (int i = 0; i < n; ++i) {
        out[i] = left;
        left *= nums[i];
    }
    long long right = 1;
    for (int i = n - 1; i >= 0; --i) {
        out[i] *= right;
        right *= nums[i];
    }
    return out;
}
'''
naive = '''
std::vector<long long> productExceptSelf(const std::vector<long long>& nums) {
    const int n = static_cast<int>(nums.size());
    std::vector<long long> out;
    for (int i = 0; i < n; ++i) {
        long long p = 1;
        for (int j = 0; j < n; ++j) {
            if (j != i) {
                p *= nums[j];
            }
        }
        out.push_back(p);
    }
    return out;
}
'''

