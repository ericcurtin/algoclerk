title = "Zeroes to the Back"
order = 11
story = "A shelf of folders has empty folders (marked 0) scattered through it. Push them all to the back without changing the order of the others, and without adding or removing slots."
statement = "Return nums with every 0 moved to the end, keeping the order of the non-zero items. The tools that grow or shrink a shelf (push, insert, remove) are locked: write into slots with a write pointer."
signature = "fn move_zeroes(nums: vec<int>) -> vec<int>"
constraints = ["0 <= len(nums) <= 20000"]
technique = "Two pointers (read and write)"
big_o = "O(n) time, O(n) space"
types = ["vec"]
builtins = ["len"]
locked = [{ name = "push", why = "Overwrite slots instead." }, { name = "insert", why = "Overwrite slots instead." }, { name = "remove", why = "Overwrite slots instead." }]
hints = [
  "Keep a write index `w` that points at the next slot for a non-zero item.",
  "Walk the shelf; every non-zero item is copied to slot `w`, then `w` grows.",
  "Afterwards fill the slots from `w` to the end with zeros.",
]
reference = '''
fn move_zeroes(nums: vec<int>) -> vec<int> {
    let out = nums;
    let w = 0;
    for i in range(len(out)) {
        if out[i] != 0 {
            out[w] = out[i];
            w += 1;
        }
    }
    for i in range(w, len(out)) {
        out[i] = 0;
    }
    return out;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [55, 43, 34]
speed = [159, 85, 59]

