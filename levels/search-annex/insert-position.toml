title = "Where Does It Go?"
order = 3
story = "A new card arrives for the sorted catalogue. The librarian only needs to know the position where it belongs."
statement = "nums is sorted ascending (duplicates allowed). Return the smallest index i such that nums[i] >= target, or len(nums) if every value is smaller."
signature = "fn lower_bound(nums: vec<int>, target: int) -> int"
constraints = ["0 <= len(nums) <= 20000"]
technique = "Binary search on the answer boundary"
big_o = "O(log n) time, O(1) space"
types = ["vec"]
builtins = ["len"]
hints = [
  "Search the half-open range [lo, hi) for the first position that is not smaller than target.",
  "If `nums[mid] < target` the answer is right of mid, otherwise mid itself may be the answer.",
  "`lo = mid + 1` or `hi = mid`; stop when they meet.",
]
reference = '''
fn lower_bound(nums: vec<int>, target: int) -> int {
    let lo = 0;
    let hi = len(nums);
    while lo < hi {
        let mid = lo + (hi - lo) / 2;
        if nums[mid] < target {
            lo = mid + 1;
        } else {
            hi = mid;
        }
    }
    return lo;
}
'''
naive = '''
fn lower_bound(nums: vec<int>, target: int) -> int {
    for i in range(len(nums)) {
        if nums[i] >= target {
            return i;
        }
    }
    return len(nums);
}
'''

