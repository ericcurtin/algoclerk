title = "Prerequisites"
order = 7
story = "The training department lists which courses must be taken before others. Can anyone finish every course, or is there a circular rule?"
statement = "There are n courses (0 to n-1). Each pair {a, b} means course b must be taken before course a. Return true if all courses can be completed."
prelude = '''
#include <vector>
'''
signature = "bool canFinish(int n, const std::vector<std::vector<int>>& prereqs)"
constraints = ["0 <= n <= 4000", "0 <= prereqs.size() <= 6000"]
technique = "Topological sort (Kahn's algorithm)"
big_o = "O(n) time, O(n) space"
unlocked = ["<queue>"]
hints = [
  "Count how many prerequisites each course still waits for (its in-degree): `std::vector<int> indeg(n, 0);`.",
  "Courses with in-degree 0 can be taken now: put them in a `std::queue<int>` (from `<queue>`).",
  "Keep for every course the list of courses that need it (`std::vector<std::vector<int>> after(n);`). Taking a course lowers the in-degree of those; when one reaches 0 it is ready too. If you take all n, it works out.",
]
reference = '''
#include <queue>

bool canFinish(int n, const std::vector<std::vector<int>>& prereqs) {
    std::vector<int> indeg(n, 0);
    std::vector<std::vector<int>> after(n);
    for (const auto& p : prereqs) {
        after[p[1]].push_back(p[0]);
        ++indeg[p[0]];
    }
    std::queue<int> ready;
    for (int i = 0; i < n; ++i) {
        if (indeg[i] == 0) {
            ready.push(i);
        }
    }
    int done = 0;
    while (!ready.empty()) {
        const int u = ready.front();
        ready.pop();
        ++done;
        for (int v : after[u]) {
            if (--indeg[v] == 0) {
                ready.push(v);
            }
        }
    }
    return done == n;
}
'''

