title = "Prerequisites"
order = 7
story = "The training department lists which courses must be taken before others. Can anyone finish every course, or is there a circular rule?"
statement = "There are n courses (0 to n-1). Each pair [a, b] means course b must be taken before course a. Return true if all courses can be completed."
signature = "fn can_finish(n: int, prereqs: vec<vec<int>>) -> bool"
constraints = ["0 <= n <= 4000", "0 <= len(prereqs) <= 6000"]
technique = "Topological sort (Kahn's algorithm)"
big_o = "O(n) time, O(n) space"
types = ["map", "queue", "vec"]
builtins = ["contains", "get", "is_empty", "pop", "push"]
hints = [
  "Count how many prerequisites each course still waits for (its in-degree).",
  "Courses with in-degree 0 can be taken now: put them in a queue.",
  "Taking a course lowers the in-degree of the courses that need it. If you take all n, it works out.",
]
reference = '''
fn can_finish(n: int, prereqs: vec<vec<int>>) -> bool {
    let indeg = [0; n];
    let after = map<int, vec<int>>();
    for p in prereqs {
        if !after.contains(p[1]) {
            after[p[1]] = [];
        }
        after[p[1]].push(p[0]);
        indeg[p[0]] += 1;
    }
    let ready = queue<int>();
    for i in range(n) {
        if indeg[i] == 0 {
            ready.push(i);
        }
    }
    let done = 0;
    while !ready.is_empty() {
        let u = ready.pop();
        done += 1;
        for v in after.get(u, []) {
            indeg[v] -= 1;
            if indeg[v] == 0 {
                ready.push(v);
            }
        }
    }
    return done == n;
}
'''

