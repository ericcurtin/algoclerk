title = "Shortest Route"
order = 6
story = "The courier network connects branch offices by two-way roads. Find the fewest roads between two branches."
statement = "The graph has n nodes (0 to n-1) and undirected edges given as [a, b] pairs. Return the minimum number of edges on a path from src to dst, or -1 if dst cannot be reached."
signature = "fn shortest_path(n: int, edges: vec<vec<int>>, src: int, dst: int) -> int"
constraints = ["1 <= n <= 4000", "0 <= len(edges) <= 6000", "0 <= src, dst < n"]
technique = "Breadth-first search with an adjacency map"
big_o = "O(n) time, O(n) space"
types = ["map", "queue", "vec"]
builtins = ["contains", "get", "is_empty", "pop", "push"]
hints = [
  "Turn the edge list into an adjacency map: node -> shelf of neighbours.",
  "Breadth-first search with a queue discovers nodes in order of distance.",
  "`adj.get(u, [])` gives the neighbours of u, or an empty shelf.",
]
reference = '''
fn shortest_path(n: int, edges: vec<vec<int>>, src: int, dst: int) -> int {
    let adj = map<int, vec<int>>();
    for e in edges {
        if !adj.contains(e[0]) {
            adj[e[0]] = [];
        }
        if !adj.contains(e[1]) {
            adj[e[1]] = [];
        }
        adj[e[0]].push(e[1]);
        adj[e[1]].push(e[0]);
    }
    let dist = map<int, int>();
    dist[src] = 0;
    let q = queue<int>();
    q.push(src);
    while !q.is_empty() {
        let u = q.pop();
        if u == dst {
            return dist[u];
        }
        for v in adj.get(u, []) {
            if !dist.contains(v) {
                dist[v] = dist[u] + 1;
                q.push(v);
            }
        }
    }
    return -1;
}
'''

