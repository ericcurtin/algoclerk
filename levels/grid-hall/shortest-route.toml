title = "Shortest Route"
order = 6
story = "The courier network connects branch offices by two-way roads. Find the fewest roads between two branches."
statement = "The graph has n nodes (0 to n-1) and undirected edges given as {a, b} pairs. Return the minimum number of edges on a path from src to dst, or -1 if dst cannot be reached."
prelude = '''
#include <vector>
'''
signature = "int shortestPath(int n, const std::vector<std::vector<int>>& edges, int src, int dst)"
constraints = ["1 <= n <= 4000", "0 <= edges.size() <= 6000", "0 <= src, dst < n"]
technique = "Breadth-first search with an adjacency list"
big_o = "O(n) time, O(n) space"
unlocked = ["<queue>"]
hints = [
  "Turn the edge list into an adjacency list: `std::vector<std::vector<int>> adj(n);` where `adj[u]` holds the neighbours of u.",
  "Breadth-first search with a `std::queue<int>` (from `<queue>`) discovers nodes in order of distance. Keep `std::vector<int> dist(n, -1);` and treat -1 as not yet seen.",
  "For every edge `{a, b}` add b to `adj[a]` and a to `adj[b]`. Loop with `const auto& e : edges` so no edge is copied, and `for (int v : adj[u])` for the neighbours (ints are cheap to copy).",
]
reference = '''
#include <queue>

int shortestPath(int n, const std::vector<std::vector<int>>& edges, int src, int dst) {
    std::vector<std::vector<int>> adj(n);
    for (const auto& e : edges) {
        adj[e[0]].push_back(e[1]);
        adj[e[1]].push_back(e[0]);
    }
    std::vector<int> dist(n, -1);
    dist[src] = 0;
    std::queue<int> q;
    q.push(src);
    while (!q.empty()) {
        const int u = q.front();
        q.pop();
        if (u == dst) {
            return dist[u];
        }
        for (int v : adj[u]) {
            if (dist[v] < 0) {
                dist[v] = dist[u] + 1;
                q.push(v);
            }
        }
    }
    return -1;
}
'''

