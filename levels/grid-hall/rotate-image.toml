title = "Turn the Blueprint"
order = 3
story = "The blueprint is pinned the wrong way round. Rotate the square plan a quarter turn clockwise."
statement = "Return the square matrix grid rotated 90 degrees clockwise."
prelude = '''
#include <vector>
'''
signature = "std::vector<std::vector<int>> rotateImage(const std::vector<std::vector<int>>& grid)"
constraints = ["1 <= n, grid is n x n", "n * n <= 40000"]
technique = "Index mapping"
big_o = "O(n) time, O(n) space"
hints = [
  "The item at row i, column j ends up in row j, column n - 1 - i.",
  "Start from a fresh n x n matrix: `std::vector<std::vector<int>> out(n, std::vector<int>(n));`.",
  "Two nested loops copy every item to its new place: `out[j][n - 1 - i] = grid[i][j];`. Keep `grid` a `const&` parameter so it is not copied.",
]
reference = '''
std::vector<std::vector<int>> rotateImage(const std::vector<std::vector<int>>& grid) {
    const int n = static_cast<int>(grid.size());
    std::vector<std::vector<int>> out(n, std::vector<int>(n));
    for (int i = 0; i < n; ++i) {
        for (int j = 0; j < n; ++j) {
            out[j][n - 1 - i] = grid[i][j];
        }
    }
    return out;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [72, 57, 45]
speed = [490, 262, 181]

[[examples]]
args = ["{{1, 2}, {3, 4}}"]
expect = "{{3, 1}, {4, 2}}"

[[examples]]
args = ["{{1, 2, 3}, {4, 5, 6}, {7, 8, 9}}"]
expect = "{{7, 4, 1}, {8, 5, 2}, {9, 6, 3}}"

[[examples]]
args = ["{{1}}"]
expect = "{{1}}"

[[generate]]
seed = 621
count = 10
args = [
  { kind = "grid_int", rows = [1, 5], square = true, range = [0, 9] },
]

[[generate]]
seed = 622
count = 1
large = true
n = 40000
args = [
