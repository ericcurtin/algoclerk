title = "Counting Islands"
order = 4
story = "The harbour map marks land with 1 and water with 0. The ferry company wants to know how many separate islands there are."
statement = "Count the groups of '1' cells that are connected horizontally or vertically."
prelude = '''
#include <vector>
'''
signature = "int countIslands(const std::vector<std::vector<char>>& grid)"
constraints = ["1 <= rows, cols", "rows * cols <= 10000", "cells are '0' or '1'"]
technique = "Breadth-first flood fill"
big_o = "O(n) time, O(n) space"
unlocked = ["<queue>", "<utility>"]
hints = [
  "Scan every cell. A land cell you have not visited starts a new island. Keep your own `std::vector<std::vector<int>> seen(rows, std::vector<int>(cols, 0));` since the grid is a `const` reference you may not change.",
  "From it, flood outwards with a `std::queue<std::pair<int, int>>` and mark everything reached as seen. `auto [y, x] = q.front(); q.pop();` unpacks a pair.",
  "The neighbours of (y, x) are (y+1, x), (y-1, x), (y, x+1), (y, x-1): check the bounds before you index.",
]
reference = '''
#include <queue>
#include <utility>

int countIslands(const std::vector<std::vector<char>>& grid) {
    const int rows = static_cast<int>(grid.size());
    const int dy[4] = {1, -1, 0, 0};
    const int dx[4] = {0, 0, 1, -1};
    std::vector<std::vector<int>> seen(rows);
    for (int r = 0; r < rows; ++r) {
        seen[r].assign(grid[r].size(), 0);
    }
    int count = 0;
    for (int r = 0; r < rows; ++r) {
        for (int c = 0; c < static_cast<int>(grid[r].size()); ++c) {
            if (grid[r][c] != '1' || seen[r][c] != 0) {
                continue;
            }
            count += 1;
            std::queue<std::pair<int, int>> q;
            q.push({r, c});
            seen[r][c] = 1;
            while (!q.empty()) {
                auto [y, x] = q.front();
                q.pop();
                for (int d = 0; d < 4; ++d) {
                    const int ny = y + dy[d];
                    const int nx = x + dx[d];
                    if (ny >= 0 && ny < rows && nx >= 0 && nx < static_cast<int>(grid[ny].size()) &&
                        grid[ny][nx] == '1' && seen[ny][nx] == 0) {
                        seen[ny][nx] = 1;
                        q.push({ny, nx});
                    }
                }
            }
        }
    }
    return count;
}
'''

