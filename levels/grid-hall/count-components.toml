title = "Separate Networks"
order = 8
story = "The IT department has a list of cables between computers. How many separate networks are there?"
statement = "n nodes (0 to n-1) and undirected edges as [a, b] pairs. Return the number of connected components (an isolated node counts as one)."
signature = "fn count_components(n: int, edges: vec<vec<int>>) -> int"
constraints = ["0 <= n <= 4000", "0 <= len(edges) <= 6000"]
technique = "Depth-first search with a stack"
big_o = "O(n) time, O(n) space"
types = ["map", "set", "stack", "vec"]
builtins = ["add", "contains", "get", "is_empty", "pop", "push"]
hints = [
  "Build an adjacency map first.",
  "For each node not yet seen, start a new component and explore everything it reaches.",
  "A stack (or queue) of nodes to explore, plus a `set<int>` of seen nodes.",
]
reference = '''
fn count_components(n: int, edges: vec<vec<int>>) -> int {
    let adj = map<int, vec<int>>();
    for e in edges {
        if !adj.contains(e[0]) {
            adj[e[0]] = [];
        }
        if !adj.contains(e[1]) {
            adj[e[1]] = [];
        }
        adj[e[0]].push(e[1]);
        adj[e[1]].push(e[0]);
    }
    let seen = set<int>();
    let count = 0;
    for start in range(n) {
        if !seen.contains(start) {
            count += 1;
            let todo = stack<int>();
            todo.push(start);
            seen.add(start);
            while !todo.is_empty() {
                let u = todo.pop();
                for v in adj.get(u, []) {
                    if !seen.contains(v) {
                        seen.add(v);
                        todo.push(v);
                    }
                }
            }
        }
    }
    return count;
}
'''

