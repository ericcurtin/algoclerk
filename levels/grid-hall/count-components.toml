title = "Separate Networks"
order = 8
story = "The IT department has a list of cables between computers. How many separate networks are there?"
statement = "n nodes (0 to n-1) and undirected edges as {a, b} pairs. Return the number of connected components (an isolated node counts as one)."
prelude = '''
#include <vector>
'''
signature = "int countComponents(int n, const std::vector<std::vector<int>>& edges)"
constraints = ["0 <= n <= 4000", "0 <= edges.size() <= 6000"]
technique = "Depth-first search with a stack"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>"]
hints = [
  "Build an adjacency list first: `std::vector<std::vector<int>> adj(n);` and add both directions of every edge.",
  "For each node not yet seen, start a new component and explore everything it reaches.",
  "A `std::stack<int>` (from `<stack>`) of nodes to explore, plus a `std::vector<int> seen(n, 0)` marking visited nodes. Mark a node when you push it, not when you pop it, so it is never pushed twice.",
]
reference = '''
#include <stack>

int countComponents(int n, const std::vector<std::vector<int>>& edges) {
    std::vector<std::vector<int>> adj(n);
    for (const auto& e : edges) {
        adj[e[0]].push_back(e[1]);
        adj[e[1]].push_back(e[0]);
    }
    std::vector<int> seen(n, 0);
    int count = 0;
    for (int start = 0; start < n; ++start) {
        if (seen[start] != 0) {
            continue;
        }
        ++count;
        std::stack<int> todo;
        todo.push(start);
        seen[start] = 1;
        while (!todo.empty()) {
            const int u = todo.top();
            todo.pop();
            for (int v : adj[u]) {
                if (seen[v] == 0) {
                    seen[v] = 1;
                    todo.push(v);
                }
            }
        }
    }
    return count;
}
'''

