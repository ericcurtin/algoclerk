title = "Most Requested Files"
order = 5
story = "The archive counts how often every file number is requested. The manager wants the k most requested numbers for the lobby board."
statement = "Return the k values that occur most often in nums, ordered from most to least frequent; values with the same count are ordered smaller first. If there are fewer than k different values, return all of them."
signature = "fn top_k(nums: vec<int>, k: int) -> vec<int>"
constraints = ["0 <= len(nums) <= 20000", "0 <= k"]
technique = "Hash map counting plus sorting"
big_o = "O(n log n) time, O(n) space"
types = ["map", "tuple", "vec"]
builtins = ["get", "items", "len", "min", "push", "sorted", "swap"]
hints = [
  "First count every value with a map.",
  "`counts.items()` gives (value, count) pairs. Make pairs `(-count, value)`: sorting them puts the most frequent first, ties by smaller value.",
  "Take the first k entries of the sorted shelf (watch out when k is bigger than the shelf!).",
]
reference = '''
fn top_k(nums: vec<int>, k: int) -> vec<int> {
    let counts = map<int, int>();
    for x in nums {
        counts[x] = counts.get(x, 0) + 1;
    }
    let ranked: vec<(int, int)> = [];
    for (v, c) in counts.items() {
        ranked.push((-c, v));
    }
    let order = sorted(ranked);
    let out: vec<int> = [];
    for i in range(min(k, len(order))) {
        out.push(order[i].1);
    }
    return out;
}
'''
naive = '''
fn top_k(nums: vec<int>, k: int) -> vec<int> {
    let counts = map<int, int>();
    for x in nums {
        counts[x] = counts.get(x, 0) + 1;
    }
    let ranked: vec<(int, int)> = [];
    for (v, c) in counts.items() {
        ranked.push((-c, v));
    }
    let out: vec<int> = [];
    for round in range(min(k, len(ranked))) {
        let best = round;
        for i in range(round + 1, len(ranked)) {
            if ranked[i] < ranked[best] {
                best = i;
            }
        }
        ranked.swap(round, best);
        out.push(ranked[round].1);
    }
    return out;
}
'''

