title = "Most Requested Files"
order = 5
story = "The archive counts how often every file number is requested. The manager wants the k most requested numbers for the lobby board."
statement = "Return the k values that occur most often in nums, ordered from most to least frequent; values with the same count are ordered smaller first. If there are fewer than k different values, return all of them."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> topK(const std::vector<int>& nums, int k)"
constraints = ["0 <= nums.size() <= 20000", "0 <= k"]
technique = "Hash map counting plus sorting"
big_o = "O(n log n) time, O(n) space"
unlocked = ["<unordered_map>", "<map>", "<algorithm>", "<utility>"]
hints = [
  "First count every value with a map: `++counts[x];`.",
  "Walk the map with `for (const auto& [value, count] : counts)` and make pairs `{-count, value}`: sorting `std::pair`s compares the first member, then the second, so the most frequent come first and ties go to the smaller value.",
  "Sort the pairs with `std::sort(ranked.begin(), ranked.end())` and take the first k entries: `std::min(k, static_cast<int>(ranked.size()))` guards against a k bigger than the shelf.",
]
reference = '''
#include <algorithm>
#include <unordered_map>
#include <utility>

std::vector<int> topK(const std::vector<int>& nums, int k) {
    std::unordered_map<int, int> counts;
    for (int x : nums) {
        ++counts[x];
    }
    std::vector<std::pair<int, int>> ranked;
    for (const auto& [value, count] : counts) {
        ranked.push_back({-count, value});
    }
    std::sort(ranked.begin(), ranked.end());
    std::vector<int> out;
    const int take = std::min(k, static_cast<int>(ranked.size()));
    for (int i = 0; i < take; ++i) {
        out.push_back(ranked[i].second);
    }
    return out;
}
'''
naive = '''
#include <algorithm>
#include <unordered_map>
#include <utility>

std::vector<int> topK(const std::vector<int>& nums, int k) {
    std::unordered_map<int, int> counts;
    for (int x : nums) {
        ++counts[x];
    }
    std::vector<std::pair<int, int>> ranked;
    for (const auto& [value, count] : counts) {
        ranked.push_back({-count, value});
    }
    const int n = static_cast<int>(ranked.size());
    std::vector<int> out;
    for (int round = 0; round < std::min(k, n); ++round) {
        int best = round;
        for (int i = round + 1; i < n; ++i) {
            if (ranked[i] < ranked[best]) {
                best = i;
            }
        }
        std::swap(ranked[round], ranked[best]);
        out.push_back(ranked[round].second);
    }
    return out;
}
'''

