title = "Unbroken Numbers"
order = 8
story = "Case files are numbered but scattered. The clerk wants the longest run of numbers that follow each other with no gap (like 4, 5, 6, 7)."
statement = "Return the length of the longest sequence of consecutive integers that all appear in nums (order on the shelf does not matter)."
prelude = '''
#include <vector>
'''
signature = "int longestRun(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 20000"]
technique = "Hash set, start only at run beginnings"
big_o = "O(n) time, O(n) space"
unlocked = ["<unordered_set>", "<algorithm>"]
hints = [
  "Put all numbers in a `std::unordered_set<int>` so that membership costs one step: `std::unordered_set<int> present(nums.begin(), nums.end());` (it also drops duplicates).",
  "A number x starts a run only if `present.count(x - 1) == 0`. Walk the set, not the vector: a value that appears many times would otherwise start the same run over and over.",
  "From each run start, count upwards while `present.count(y + 1) != 0`, and keep the longest with `std::max` from `<algorithm>`.",
]
reference = '''
#include <algorithm>
#include <unordered_set>

int longestRun(const std::vector<int>& nums) {
    std::unordered_set<int> present(nums.begin(), nums.end());
    int best = 0;
    for (int x : present) {
        if (present.count(x - 1) == 0) {
            int y = x;
            while (present.count(y + 1) != 0) {
                ++y;
            }
            best = std::max(best, y - x + 1);
        }
    }
    return best;
}
'''
naive = '''
#include <algorithm>

int longestRun(const std::vector<int>& nums) {
    int best = 0;
    for (int x : nums) {
        int y = x;
        while (std::find(nums.begin(), nums.end(), y + 1) != nums.end()) {
            ++y;
        }
        best = std::max(best, y - x + 1);
    }
    return best;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [80, 63, 50]
speed = [212, 113, 79]

[[examples]]
args = ["{100, 4, 200, 1, 3, 2}"]
expect = "4"

[[examples]]
args = ["{0, 3, 7, 2, 5, 8, 4, 6, 0, 1}"]
expect = "9"

[[examples]]
args = ["{}"]
expect = "0"

[[tests]]
args = ["{5}"]
expect = "1"

[[tests]]
args = ["{1, 1, 1}"]
expect = "1"

