title = "Cut-Out Letters"
order = 9
story = "A prankster builds a note by cutting letters out of a magazine. Can the magazine supply every letter of the note?"
statement = "Return true if note can be written using letters cut from magazine, each magazine letter used at most once."
prelude = '''
#include <string>
'''
signature = "bool canBuild(const std::string& note, const std::string& magazine)"
constraints = ["0 <= note.size(), magazine.size() <= 20000"]
technique = "Hash map counting"
big_o = "O(n) time, O(k) space"
unlocked = ["<unordered_map>"]
hints = [
  "Count how many of each letter the magazine has: a `std::unordered_map<char, int>` from letter to count, filled with `++stock[c];`.",
  "Walk the note and use up one count for each letter. Both strings are `const std::string&`, so reading them never copies them.",
  "If the count of a letter is already zero, the note cannot be built: `if (stock[c] == 0) { return false; }`, otherwise `--stock[c];`.",
]
reference = '''
#include <unordered_map>

bool canBuild(const std::string& note, const std::string& magazine) {
    std::unordered_map<char, int> stock;
    for (char c : magazine) {
        ++stock[c];
    }
    for (char c : note) {
        if (stock[c] == 0) {
            return false;
        }
        --stock[c];
    }
    return true;
}
'''
naive = '''
bool canBuild(const std::string& note, const std::string& magazine) {
    std::string rest = magazine;
    for (char c : note) {
        const std::size_t i = rest.find(c);
        if (i == std::string::npos) {
            return false;
        }
        rest.erase(i, 1);
    }
    return true;
}
'''

[budgets]
