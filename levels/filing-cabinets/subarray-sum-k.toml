title = "Ledger Stretches"
order = 7
story = "The auditor wants to know how many consecutive runs of entries in the ledger add up to exactly k."
statement = "Return the number of contiguous, non-empty subarrays of nums whose sum equals k."
prelude = '''
#include <vector>
'''
signature = "int countSubarrays(const std::vector<int>& nums, int k)"
constraints = ["0 <= nums.size() <= 20000", "-5 <= nums[i] <= 5"]
technique = "Prefix sums with a hash map"
big_o = "O(n) time, O(n) space"
unlocked = ["<unordered_map>"]
hints = [
  "The sum of nums[i..j] is prefix[j] - prefix[i].",
  "While walking, keep a running prefix sum and a `std::unordered_map<int, int>`: how many times has each prefix sum been seen? Start it with `seen[0] = 1` (the empty prefix).",
  "At every step look up `prefix - k` with `seen.find(...)` and add the count you find to the answer (a plain `seen[prefix - k]` would insert a useless zero entry), then record the current prefix with `++seen[prefix]`.",
]
reference = '''
#include <unordered_map>

int countSubarrays(const std::vector<int>& nums, int k) {
    std::unordered_map<int, int> seen;
    seen[0] = 1;
    int prefix = 0;
    int total = 0;
    for (int x : nums) {
        prefix += x;
        if (auto it = seen.find(prefix - k); it != seen.end()) {
            total += it->second;
        }
        ++seen[prefix];
    }
    return total;
}
'''
naive = '''
int countSubarrays(const std::vector<int>& nums, int k) {
    const int n = static_cast<int>(nums.size());
    int total = 0;
    for (int i = 0; i < n; ++i) {
        int sum = 0;
        for (int j = i; j < n; ++j) {
            sum += nums[j];
            if (sum == k) {
                ++total;
            }
        }
    }
    return total;
}
'''

