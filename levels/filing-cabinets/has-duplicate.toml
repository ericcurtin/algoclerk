title = "Double Filed"
order = 2
story = "Somebody filed the same invoice twice. Before the audit, find out whether any invoice number shows up more than once."
statement = "Return true if some value appears at least twice in nums."
prelude = '''
#include <vector>
'''
signature = "bool hasDuplicate(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 20000"]
technique = "Hash set membership"
big_o = "O(n) time, O(n) space"
unlocked = ["<unordered_set>"]
hints = [
  "Remember every number you have already seen.",
  "A `std::unordered_set<int>` answers `seen.count(x)` in one step (1 if present, 0 if not). `nums` is a `const std::vector<int>&`, so reading it never copies it.",
  "If the current number is already in the set, return true; otherwise `seen.insert(x);` and carry on. `insert` even tells you whether the value was new: `seen.insert(x).second`.",
]
reference = '''
#include <unordered_set>

bool hasDuplicate(const std::vector<int>& nums) {
    std::unordered_set<int> seen;
    for (int x : nums) {
        if (!seen.insert(x).second) {
            return true;
        }
    }
    return false;
}
'''
naive = '''
bool hasDuplicate(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    for (int i = 0; i < n; ++i) {
        for (int j = i + 1; j < n; ++j) {
            if (nums[i] == nums[j]) {
                return true;
            }
        }
    }
    return false;
}
'''

