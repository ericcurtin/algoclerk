title = "Double Filed"
order = 2
story = "Somebody filed the same invoice twice. Before the audit, find out whether any invoice number shows up more than once."
statement = "Return true if some value appears at least twice in nums."
signature = "fn has_duplicate(nums: vec<int>) -> bool"
constraints = ["0 <= len(nums) <= 20000"]
technique = "Hash set membership"
big_o = "O(n) time, O(n) space"
types = ["set", "vec"]
builtins = ["add", "contains", "len"]
hints = [
  "Remember every number you have already seen.",
  "A `set<int>` answers `contains` in one step.",
  "If the current number is in the set, return true; otherwise add it.",
]
reference = '''
fn has_duplicate(nums: vec<int>) -> bool {
    let seen = set<int>();
    for x in nums {
        if seen.contains(x) {
            return true;
        }
        seen.add(x);
    }
    return false;
}
'''
naive = '''
fn has_duplicate(nums: vec<int>) -> bool {
    for i in range(len(nums)) {
        for j in range(i + 1, len(nums)) {
            if nums[i] == nums[j] {
                return true;
            }
        }
    }
    return false;
}
'''

