title = "The Missing Folder"
order = 3
story = "Folders are numbered 0 to n and one went missing from the cart. Which number is gone?"
statement = "nums holds the numbers 0..n in some order with exactly one of them missing (n is the length of nums). Return the missing number."
prelude = '''
#include <vector>
'''
signature = "int missingNumber(const std::vector<int>& nums)"
constraints = ["1 <= nums.size() <= 20000", "values are different and in 0..=nums.size()"]
technique = "Sum formula or XOR"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>", "<numeric>"]
hints = [
  "If nothing were missing the total would be n * (n + 1) / 2.",
  "Subtract what is actually on the shelf: a loop `total -= nums[i];` does it, and so does `std::accumulate` from `<numeric>`.",
  "n is `static_cast<int>(nums.size())`: `size()` returns an unsigned number, and n * (n + 1) is fine as an `int` for 20000 folders. Taking `nums` by `const&` means the walk costs nothing extra.",
]
reference = '''
int missingNumber(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    int total = n * (n + 1) / 2;
    for (int x : nums) {
        total -= x;
    }
    return total;
}
'''
naive = '''
#include <algorithm>

int missingNumber(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    for (int want = 0; want <= n; ++want) {
        if (std::find(nums.begin(), nums.end(), want) == nums.end()) {
            return want;
        }
    }
    return -1;
}
'''

[budgets]
large_steps = 2500000

