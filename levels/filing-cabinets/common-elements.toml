title = "Both Cabinets"
order = 6
story = "Two cabinets hold lists of client numbers. Which clients are in both?"
statement = "Return the numbers that occur in both a and b, each exactly once, in ascending order."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> commonElements(const std::vector<int>& a, const std::vector<int>& b)"
constraints = ["0 <= a.size(), b.size() <= 20000"]
technique = "Hash set intersection"
big_o = "O(n log n) time, O(n) space"
unlocked = ["<unordered_set>", "<set>", "<algorithm>"]
hints = [
  "Turn one shelf into a set so that asking \"is this client in there?\" costs one step.",
  "`std::unordered_set<int> inA(a.begin(), a.end());` builds the set from a whole shelf. Then walk `b` and ask `inA.count(x)`. Both shelves arrive as `const&`, so reading them never copies.",
  "Each client must appear once and in ascending order: collect the matches in a `std::set<int>` (it keeps its keys sorted and drops repeats), then copy it into the answer with `std::vector<int>(common.begin(), common.end())`.",
]
reference = '''
#include <set>
#include <unordered_set>

std::vector<int> commonElements(const std::vector<int>& a, const std::vector<int>& b) {
    std::unordered_set<int> inA(a.begin(), a.end());
    std::set<int> common;
    for (int x : b) {
        if (inA.count(x) != 0) {
            common.insert(x);
        }
    }
    return std::vector<int>(common.begin(), common.end());
}
'''
naive = '''
#include <algorithm>

std::vector<int> commonElements(const std::vector<int>& a, const std::vector<int>& b) {
    std::vector<int> out;
    for (int x : a) {
        const bool inB = std::find(b.begin(), b.end(), x) != b.end();
        const bool seen = std::find(out.begin(), out.end(), x) != out.end();
        if (inB && !seen) {
            out.push_back(x);
        }
    }
    std::sort(out.begin(), out.end());
    return out;
}
'''

