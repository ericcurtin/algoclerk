title = "Both Cabinets"
order = 6
story = "Two cabinets hold lists of client numbers. Which clients are in both?"
statement = "Return the numbers that occur in both a and b, each exactly once, in ascending order."
signature = "fn common_elements(a: vec<int>, b: vec<int>) -> vec<int>"
constraints = ["0 <= len(a), len(b) <= 20000"]
technique = "Hash set intersection"
big_o = "O(n log n) time, O(n) space"
types = ["set", "vec"]
builtins = ["add", "contains", "intersection", "push", "sorted"]
hints = [
  "Turn each shelf into a set.",
  "Sets know how to `intersection` with each other.",
  "Finish with `sorted(...)` to get an ascending shelf.",
]
reference = '''
fn common_elements(a: vec<int>, b: vec<int>) -> vec<int> {
    let left = set<int>();
    for x in a {
        left.add(x);
    }
    let right = set<int>();
    for x in b {
        right.add(x);
    }
    return sorted(left.intersection(right));
}
'''
naive = '''
fn common_elements(a: vec<int>, b: vec<int>) -> vec<int> {
    let out: vec<int> = [];
    for x in a {
        if b.contains(x) and !out.contains(x) {
            out.push(x);
        }
    }
    return sorted(out);
}
'''

