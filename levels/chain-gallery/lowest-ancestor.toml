title = "Closest Common Boss"
order = 9
story = "Two employees need a joint meeting, so they must be called by the lowest manager who is above both of them."
statement = "The tree has different values. p and q both occur in it (they may be equal). Return the value of the lowest node that has both p and q in its subtree (a node counts as being in its own subtree)."
prelude = '''
struct TreeNode {
    int val;
    TreeNode* left;
    TreeNode* right;
    TreeNode(int v) : val(v), left(nullptr), right(nullptr) {}
};
'''
signature = "int lca(TreeNode* root, int p, int q)"
constraints = ["1 <= nodes <= 20000", "values are different", "p and q are in the tree"]
technique = "Recursive search on both subtrees"
big_o = "O(n) time, O(n) space"
unlock = { helpers = true, recursion = true }
hints = [
  "If the current node is p or q, it is the answer for this part of the tree.",
  "Write a helper that returns a `TreeNode*` (or `nullptr`): look for p and q in the left and right subtrees.",
  "If both sides found something, the current node is the lowest common ancestor; otherwise pass up whichever side found one. The entry function returns `->val` of the helper's result.",
]
reference = '''
TreeNode* findNode(TreeNode* node, int p, int q) {
    if (node == nullptr) {
        return nullptr;
    }
    if (node->val == p || node->val == q) {
        return node;
    }
    TreeNode* l = findNode(node->left, p, q);
    TreeNode* r = findNode(node->right, p, q);
    if (l != nullptr && r != nullptr) {
        return node;
    }
    return (l != nullptr) ? l : r;
}

int lca(TreeNode* root, int p, int q) {
    return findNode(root, p, q)->val;
}
'''

