title = "Floor by Floor"
order = 10
story = "The building directory lists employees by org-chart level: the boss first, then their reports, then their reports' reports."
statement = "Return the values of the tree level by level, left to right, as a shelf of shelves (one inner shelf per level). An empty tree gives an empty shelf."
prelude = '''
#include <vector>

struct TreeNode {
    int val;
    TreeNode* left;
    TreeNode* right;
    TreeNode(int v) : val(v), left(nullptr), right(nullptr) {}
};
'''
signature = "std::vector<std::vector<int>> levelOrder(TreeNode* root)"
constraints = ["0 <= nodes <= 20000"]
technique = "Breadth-first search with a queue"
big_o = "O(n) time, O(n) space"
unlocked = ["<queue>"]
hints = [
  "A `std::queue<TreeNode*>` (`#include <queue>`) holds the nodes of the level you are about to read.",
  "For each level, take exactly `size` nodes from the queue: measure `q.size()` first (store it in an `int` with `static_cast<int>`), because the queue keeps growing while you work.",
  "Push each node's non-null children as you go; they form the next level. Use `q.front()` then `q.pop()` to take a node.",
]
reference = '''
#include <queue>

std::vector<std::vector<int>> levelOrder(TreeNode* root) {
    std::vector<std::vector<int>> out;
    if (root == nullptr) {
        return out;
    }
    std::queue<TreeNode*> q;
    q.push(root);
    while (!q.empty()) {
        const int size = static_cast<int>(q.size());
        std::vector<int> level;
        for (int i = 0; i < size; ++i) {
            TreeNode* node = q.front();
            q.pop();
            level.push_back(node->val);
            if (node->left != nullptr) {
                q.push(node->left);
            }
            if (node->right != nullptr) {
                q.push(node->right);
            }
        }
        out.push_back(level);
    }
    return out;
}
'''

