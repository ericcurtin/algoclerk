title = "Zip the Two Chains"
order = 3
story = "Two chains of tags are each in order. Link them into a single ordered chain without making new tags."
statement = "a and b are sorted linked lists. Return the head of one sorted list made by splicing their nodes together."
signature = "fn merge_lists(a: lnode, b: lnode) -> lnode"
constraints = ["0 <= length of each <= 10000"]
technique = "Dummy head and tail pointer"
big_o = "O(n) time, O(1) space"
types = ["lnode"]
builtins = ["lnode"]
hints = [
  "A dummy node in front saves you from special-casing the first node.",
  "Keep a `tail`; attach whichever list has the smaller front node and advance that list.",
  "When one list runs out, attach the rest of the other.",
]
reference = '''
fn merge_lists(a: lnode, b: lnode) -> lnode {
    let dummy = lnode(0, null);
    let tail = dummy;
    let x = a;
    let y = b;
    while x != null and y != null {
        if x.val <= y.val {
            tail.next = x;
            x = x.next;
        } else {
            tail.next = y;
            y = y.next;
        }
        tail = tail.next;
    }
    if x != null {
        tail.next = x;
    } else {
        tail.next = y;
    }
    return dummy.next;
}
'''

