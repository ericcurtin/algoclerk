title = "Zip the Two Chains"
order = 3
story = "Two chains of tags are each in order. Link them into a single ordered chain without making new tags."
statement = "a and b are sorted linked lists. Return the head of one sorted list made by splicing their nodes together."
prelude = '''
struct ListNode {
    int val;
    ListNode* next;
    ListNode(int v) : val(v), next(nullptr) {}
};
'''
signature = "ListNode* mergeLists(ListNode* a, ListNode* b)"
constraints = ["0 <= length of each <= 10000"]
technique = "Dummy head and tail pointer"
big_o = "O(n) time, O(1) space"
hints = [
  "A dummy node in front saves you from special-casing the first node: `ListNode dummy(0);` is a local variable, `&dummy` is a pointer to it.",
  "Keep a `ListNode* tail`; attach whichever list has the smaller front node (`tail->next = a;`) and advance that list. Only pointers are copied, never nodes.",
  "When one list runs out, attach the rest of the other, then return `dummy.next`.",
]
reference = '''
ListNode* mergeLists(ListNode* a, ListNode* b) {
    ListNode dummy(0);
    ListNode* tail = &dummy;
    while (a != nullptr && b != nullptr) {
        if (a->val <= b->val) {
            tail->next = a;
            a = a->next;
        } else {
            tail->next = b;
            b = b->next;
        }
        tail = tail->next;
    }
    tail->next = (a != nullptr) ? a : b;
    return dummy.next;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [96, 75, 60]
speed = [348, 186, 129]

[[examples]]
args = ["{1, 2, 4}", "{1, 3, 4}"]
expect = "{1, 1, 2, 3, 4, 4}"

