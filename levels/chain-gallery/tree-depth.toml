title = "How Tall Is the Org Chart?"
order = 6
story = "The company org chart is a tree: every manager has at most a left and a right report. How many levels does it have?"
statement = "Return the maximum depth of the binary tree: the number of nodes on the longest path from the root down to a leaf. An empty tree has depth 0. A tree node has `val`, `left` and `right`."
prelude = '''
struct TreeNode {
    int val;
    TreeNode* left;
    TreeNode* right;
    TreeNode(int v) : val(v), left(nullptr), right(nullptr) {}
};
'''
signature = "int maxDepth(TreeNode* root)"
constraints = ["0 <= nodes <= 20000", "the depth is below 150"]
technique = "Recursion on a tree"
big_o = "O(n) time, O(n) space"
unlocked = ["<algorithm>"]
unlock = { recursion = true }
hints = [
  "The depth of a tree is 1 plus the larger depth of its two subtrees.",
  "The depth of an empty tree (`nullptr`) is 0.",
  "A function may call itself here: recursion is unlocked. `#include <algorithm>` gives you `std::max`, which needs two arguments of the same type.",
]
reference = '''
#include <algorithm>

int maxDepth(TreeNode* root) {
    if (root == nullptr) {
        return 0;
    }
    return 1 + std::max(maxDepth(root->left), maxDepth(root->right));
}
'''

