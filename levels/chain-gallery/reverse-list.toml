title = "Turn the Chain Around"
order = 1
story = "A chain of name tags hangs along the corridor, each tag pointing at the next. The boss wants the chain hung in the opposite direction."
statement = "Reverse the linked list and return the new head. A list node has `val` and `next`; `nullptr` marks the end. Change the `next` links instead of building a new list."
prelude = '''
struct ListNode {
    int val;
    ListNode* next;
    ListNode(int v) : val(v), next(nullptr) {}
};
'''
signature = "ListNode* reverseList(ListNode* head)"
constraints = ["0 <= length <= 20000"]
technique = "Pointer reversal"
big_o = "O(n) time, O(1) space"
hints = [
  "Walk the chain with a `ListNode* cur`, keeping a `ListNode* prev` (start it as `nullptr`). A pointer is passed by value, but it points at the caller's nodes: changing `cur->next` changes the real chain, and copying the pointer costs nothing.",
  "Before changing `cur->next`, save the old next node in a local pointer.",
  "Point `cur->next` at `prev`, then move both forward. When `cur` is `nullptr`, `prev` is the new head.",
]
reference = '''
ListNode* reverseList(ListNode* head) {
    ListNode* prev = nullptr;
    ListNode* cur = head;
    while (cur != nullptr) {
        ListNode* next = cur->next;
        cur->next = prev;
        prev = cur;
        cur = next;
    }
    return prev;
}
'''

