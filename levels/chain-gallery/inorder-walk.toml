title = "Reading the Tree in Order"
order = 7
story = "The records are stored in a tree, and the archivist reads them left subtree, node, right subtree. She does not trust recursion on long chains, so a stack it is."
statement = "Return the values of the binary tree in in-order (left, node, right). Try it without recursion, using a stack of nodes."
prelude = '''
#include <vector>

struct TreeNode {
    int val;
    TreeNode* left;
    TreeNode* right;
    TreeNode(int v) : val(v), left(nullptr), right(nullptr) {}
};
'''
signature = "std::vector<int> inorder(TreeNode* root)"
constraints = ["0 <= nodes <= 20000"]
technique = "Iterative traversal with a stack"
big_o = "O(n) time, O(n) space"
unlocked = ["<stack>"]
hints = [
  "Go left as far as you can, remembering the nodes on a `std::stack<TreeNode*>` (`#include <stack>`).",
  "Then take `todo.top()`, call `todo.pop()`, record its `val` and move to its right child.",
  "Stop when the current node is `nullptr` and the stack is empty.",
]
reference = '''
#include <stack>

std::vector<int> inorder(TreeNode* root) {
    std::vector<int> out;
    std::stack<TreeNode*> todo;
    TreeNode* cur = root;
    while (cur != nullptr || !todo.empty()) {
        while (cur != nullptr) {
            todo.push(cur);
            cur = cur->left;
        }
        cur = todo.top();
        todo.pop();
        out.push_back(cur->val);
        cur = cur->right;
    }
    return out;
}
'''

