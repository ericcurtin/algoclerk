title = "Drop the Tag from the End"
order = 5
story = "The nth tag from the end of the chain was misprinted and has to be removed, but the chain is too long to count by hand."
statement = "Remove the nth node from the end of the list (n is at least 1 and at most the length) and return the head."
signature = "fn remove_nth(head: lnode, n: int) -> lnode"
constraints = ["1 <= n <= length <= 20000"]
technique = "Two pointers with a gap"
big_o = "O(n) time, O(1) space"
types = ["lnode"]
builtins = ["lnode"]
hints = [
  "Put a dummy node in front so removing the first node is not special.",
  "Move a `fast` pointer n steps ahead of a `slow` pointer.",
  "Then move both until fast is at the last node: slow is just before the node to remove.",
]
reference = '''
fn remove_nth(head: lnode, n: int) -> lnode {
    let dummy = lnode(0, head);
    let fast = dummy;
    let slow = dummy;
    for i in range(n) {
        fast = fast.next;
    }
    while fast.next != null {
        fast = fast.next;
        slow = slow.next;
    }
    slow.next = slow.next.next;
    return dummy.next;
}
'''

[budgets]
large_steps = 2000000

[medals]
size = [58, 45, 36]
speed = [103, 55, 39]

[[examples]]
args = ["[1, 2, 3, 4, 5]", "2"]
expect = "[1, 2, 3, 5]"

[[examples]]
args = ["[1]", "1"]
expect = "[]"

[[examples]]
args = ["[1, 2]", "1"]
expect = "[1]"

[[tests]]
args = ["[1, 2]", "2"]
expect = "[2]"

