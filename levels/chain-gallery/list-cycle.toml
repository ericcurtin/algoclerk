title = "Going in Circles"
order = 2
story = "Somebody tied the end of the chain back onto one of its tags. Anyone following it will walk forever. Is the chain a loop?"
statement = "Return true if following `next` from head ever revisits a node (the list has a cycle), false if it ends at nullptr. Aim for O(1) extra space."
prelude = '''
struct ListNode {
    int val;
    ListNode* next;
    ListNode(int v) : val(v), next(nullptr) {}
};
'''
signature = "bool hasCycle(ListNode* head)"
constraints = ["0 <= length <= 20000"]
technique = "Fast and slow pointers"
big_o = "O(n) time, O(1) space"
unlocked = ["<vector>", "<algorithm>"]
hints = [
  "Remembering every visited node in a `std::vector<ListNode*>` works but is slow with long lists: every lookup walks the whole memory.",
  "Move one pointer one step at a time and another two steps at a time. Test `fast != nullptr && fast->next != nullptr` before stepping twice.",
  "If there is a cycle the fast pointer eventually catches the slow one (`slow == fast`); if it reaches `nullptr` there is none.",
]
reference = '''
bool hasCycle(ListNode* head) {
    ListNode* slow = head;
    ListNode* fast = head;
    while (fast != nullptr && fast->next != nullptr) {
        slow = slow->next;
        fast = fast->next->next;
        if (slow == fast) {
            return true;
        }
    }
    return false;
}
'''
naive = '''
#include <algorithm>
#include <vector>

bool hasCycle(ListNode* head) {
    std::vector<ListNode*> seen;
    for (ListNode* cur = head; cur != nullptr; cur = cur->next) {
        if (std::find(seen.begin(), seen.end(), cur) != seen.end()) {
            return true;
        }
        seen.push_back(cur);
    }
    return false;
}
'''

