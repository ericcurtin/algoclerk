title = "Is It Sorted by Branch?"
order = 8
story = "A search tree only works if everything left of a node is smaller and everything right is larger. The auditor suspects somebody hand-edited this one."
statement = "Return true if the tree is a valid binary search tree: for every node all values in its left subtree are smaller and all values in its right subtree are larger. All values are different."
signature = "fn is_bst(root: tnode) -> bool"
constraints = ["0 <= nodes <= 20000", "values are different", "-1000000 <= val <= 1000000"]
technique = "Recursion with value bounds"
big_o = "O(n) time, O(n) space"
types = ["tnode"]
builtins = []
hints = [
  "Checking only a node against its children is not enough.",
  "Pass down the open interval (lo, hi) in which a subtree's values must lie.",
  "A helper `check(node, lo, hi)`: the left child gets hi = node.val, the right child gets lo = node.val.",
]
reference = '''
fn check(node: tnode, lo: int, hi: int) -> bool {
    if node == null {
        return true;
    }
    if node.val <= lo or node.val >= hi {
        return false;
    }
    return check(node.left, lo, node.val) and check(node.right, node.val, hi);
}

fn is_bst(root: tnode) -> bool {
    return check(root, -1000000000, 1000000000);
}
'''

