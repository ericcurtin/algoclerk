id = "sieve"
title = "The Great Sieve"
order = 1
summary = "List all prime numbers up to n by crossing out multiples."
story = "The Executive Floor has a very long filing wall. To find which drawers hold special documents, the director crosses out every multiple of every drawer number already known to be special. What remains is special."
statement = "The inbox holds a number n. Output all prime numbers from 2 up to n in ascending order, using the sieve of Eratosthenes: whenever you meet a number that is not crossed out, output it and cross out its multiples."
constraints = ["2 <= n <= 30.", "Tiles 0 to 30 hold 0 (not crossed out) and tiles 32 and 34 hold 1 at the start. Tiles 31 and 33 are free."]
hints = [
  "Tile k is the flag for the number k: 0 means not crossed out, 1 means crossed out.",
  "Walk i from 2 to n. If flag[i] is still 0, i is prime: output it.",
  "Cross out the multiples of i starting at i * i (smaller multiples were crossed out by smaller primes) in steps of i.",
]

[[examples]]
input = [10]
output = [2, 3, 5, 7]

[machine]
floor = 35
names = ["flag_0", "flag_1", "flag_2", "flag_3", "flag_4", "flag_5", "flag_6", "flag_7", "flag_8", "flag_9", "flag_10", "flag_11", "flag_12", "flag_13", "flag_14", "flag_15", "flag_16", "flag_17", "flag_18", "flag_19", "flag_20", "flag_21", "flag_22", "flag_23", "flag_24", "flag_25", "flag_26", "flag_27", "flag_28", "flag_29", "flag_30", "limit", "candidate", "multiple", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "bumpup", "jump", "jumpz", "jumpn", "indirect"]
