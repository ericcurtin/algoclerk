id = "run-length-encode"
title = "Squeeze Packing"
order = 2
summary = "Compress repeated neighbours into (value, count) pairs."
story = "The postal van is nearly full, but many envelopes in a row are identical. The director wants every streak replaced by a single note: the value and how often it repeats."
statement = "The inbox holds a list of numbers between 1 and 3 followed by a 0 marker. Output the run-length encoding: for every maximal run of equal neighbours, output the value and then the length of the run."
constraints = ["The list has between 0 and 10 numbers, each 1, 2 or 3.", "Tile 3 holds 1 at the start."]
hints = [
  "Remember the current value and how many times in a row it has appeared.",
  "When the next number differs, output the pair for the finished run and start a new run of length 1.",
  "Do not forget the last run: it is still open when the marker arrives.",
]

[[examples]]
input = [1, 1, 1, 2, 2, 1, 0]
output = [1, 3, 2, 2, 1, 1]

[machine]
floor = 4
names = ["value", "run", "next", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "bumpup", "jump", "jumpz"]
[machine.prefill]
3 = 1

[tests]
seed = 702
[[tests.fixed]]
input = [0]
output = []
[[tests.fixed]]
input = [2, 0]
output = [2, 1]
[[tests.fixed]]
input = [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 0]
output = [3, 10]
[[tests.fixed]]
input = [1, 2, 1, 2, 0]
output = [1, 1, 2, 1, 1, 1, 2, 1]
[[tests.generators]]
count = 10
inbox = [{ kind = "list", len = [0, 10], range = [1, 3], terminator = 0 }]

[targets]
size_par = 31
size_ace = 25
speed_par = 92
speed_ace = 61

[solution]
asm = """
    INBOX
    JUMPZ end
    COPYTO 0
    COPYFROM 3
    COPYTO 1
loop:
    INBOX
    JUMPZ flush
    COPYTO 2
    SUB 0
    JUMPZ same
    COPYFROM 0
    OUTBOX
    COPYFROM 1
    OUTBOX
    COPYFROM 2
    COPYTO 0
    COPYFROM 3
    COPYTO 1
    JUMP loop
same:
    BUMPUP 1
    JUMP loop
flush:
    COPYFROM 0
    OUTBOX
    COPYFROM 1
    OUTBOX
end:
"""

[code]
function = "run_length_encode"
doc = "Returns (value, run length) pairs for every run of equal neighbours."
params = [{ name = "values", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Run-length encoding"
text = "One pass with a current value and a run counter. The pair for a run is emitted when the run ends, which includes the end of the input: forgetting that last flush is the usual bug."
