title = "Boss: Every Possible Team"
order = 4
story = "The HR manager wants to list every possible team that can be picked from a short list of staff, including the empty team and the full team."
statement = "Return all subsets of nums (the power set). The order of the subsets, and the order inside a subset, does not matter. nums has no duplicates."
prelude = '''
#include <vector>
'''
signature = "std::vector<std::vector<int>> subsets(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 10", "values are different"]
technique = "Backtracking"
big_o = "O(2^n) time, O(2^n) space"
compare = "sort_all"
hints = [
  "For each item there are two choices: leave it out or take it.",
  "A helper can walk through the indices; it needs the current team and the result shelf, passed as non-const references (`std::vector<int>& cur`, `std::vector<std::vector<int>>& out`). Pass `nums` as `const&` too, or every call copies it.",
  "At the end of the list, `out.push_back(cur)` stores a copy of the current team. After taking an item with `cur.push_back(nums[i])`, remember to `cur.pop_back()` it again.",
]
reference = '''
void walk(const std::vector<int>& nums, int i, std::vector<int>& cur, std::vector<std::vector<int>>& out) {
    if (i == static_cast<int>(nums.size())) {
        out.push_back(cur);
        return;
    }
    walk(nums, i + 1, cur, out);
    cur.push_back(nums[i]);
    walk(nums, i + 1, cur, out);
    cur.pop_back();
}

std::vector<std::vector<int>> subsets(const std::vector<int>& nums) {
    std::vector<std::vector<int>> out;
    std::vector<int> cur;
    walk(nums, 0, cur, out);
    return out;
}
'''

[unlock]
helpers = true
recursion = true

