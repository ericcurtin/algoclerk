title = "Boss: Every Possible Team"
order = 4
story = "The HR manager wants to list every possible team that can be picked from a short list of staff, including the empty team and the full team."
statement = "Return all subsets of nums (the power set). The order of the subsets, and the order inside a subset, does not matter. nums has no duplicates."
signature = "fn subsets(nums: vec<int>) -> vec<vec<int>>"
constraints = ["0 <= len(nums) <= 10", "values are different"]
technique = "Backtracking"
big_o = "O(2^n) time, O(2^n) space"
compare = "sort_all"
types = ["vec"]
builtins = ["len", "pop", "push"]
hints = [
  "For each item there are two choices: leave it out or take it.",
  "A helper can walk through the indices; it needs the current team and the result shelf, passed as `&mut` parameters.",
  "At the end of the list, push a copy of the current team. After taking an item, remember to pop it again.",
]
reference = '''
fn walk(nums: vec<int>, i: int, cur: &mut vec<int>, out: &mut vec<vec<int>>) {
    if i == len(nums) {
        out.push(cur);
        return;
    }
    walk(nums, i + 1, cur, out);
    cur.push(nums[i]);
    walk(nums, i + 1, cur, out);
    cur.pop();
}

fn subsets(nums: vec<int>) -> vec<vec<int>> {
    let out: vec<vec<int>> = [];
    let cur: vec<int> = [];
    walk(nums, 0, cur, out);
    return out;
}
'''

[unlock]
helpers = true
recursion = true

