title = "Boss: The Longest Mirror"
order = 2
story = "The sign painter wants the longest stretch of a street name that reads the same backwards, to paint on the banner."
statement = "Return the longest palindromic substring of s. If several have the same length, return the one that starts earliest. The empty string gives the empty string."
prelude = '''
#include <string>
'''
signature = "std::string longestPalindrome(const std::string& s)"
constraints = ["0 <= s.size() <= 1000"]
technique = "Expand around the centre"
big_o = "O(n^2) time, O(1) space"
hints = [
  "Checking every substring takes O(n cubed). Take `s` by `const&` (it is already) so no pass copies the street name.",
  "Every palindrome has a centre: a letter (odd length) or the gap between two letters (even length).",
  "From each centre, grow outwards with two `int` indices while both ends match, and remember the longest start and length. `s.substr(start, length)` cuts out the answer (an empty `s` with `substr(0, 0)` is fine).",
]
reference = '''
std::string longestPalindrome(const std::string& s) {
    const int n = static_cast<int>(s.size());
    int bestStart = 0;
    int bestLen = 0;
    for (int centre = 0; centre < n; ++centre) {
        for (int width = 0; width < 2; ++width) {
            int lo = centre;
            int hi = centre + width;
            while (lo >= 0 && hi < n && s[lo] == s[hi]) {
                --lo;
                ++hi;
            }
            const int length = hi - lo - 1;
            if (length > bestLen) {
                bestLen = length;
                bestStart = lo + 1;
            }
        }
    }
    return s.substr(bestStart, bestLen);
}
'''
naive = '''
std::string longestPalindrome(const std::string& s) {
    const int n = static_cast<int>(s.size());
    std::string best;
    for (int i = 0; i < n; ++i) {
        for (int j = i; j < n; ++j) {
            bool ok = true;
            int a = i;
            int b = j;
            while (a < b) {
                if (s[a] != s[b]) {
                    ok = false;
                    break;
                }
                ++a;
                --b;
            }
            if (ok && j - i + 1 > static_cast<int>(best.size())) {
                best = s.substr(i, j - i + 1);
            }
        }
    }
    return best;
}
'''

