title = "Boss: Rain on the Roofs"
order = 1
story = "The skyline of the old town is a row of roofs of different heights. After a heavy rain, water pools between taller roofs. How much is trapped?"
statement = "heights[i] is the height of a unit-wide roof. Return the total units of water trapped between them after rain."
signature = "fn trap(heights: vec<int>) -> int"
constraints = ["0 <= len(heights) <= 20000", "0 <= heights[i] <= 1000"]
technique = "Two pointers with running maxima"
big_o = "O(n) time, O(1) space"
types = ["vec"]
builtins = ["len", "max", "min"]
hints = [
  "The water above a roof depends on the tallest roof to its left and right: min of the two minus its own height.",
  "Recomputing both maxima for every roof is O(n squared).",
  "Walk two pointers inward; always advance the side with the lower roof, tracking the best seen on that side.",
]
reference = '''
fn trap(heights: vec<int>) -> int {
    let i = 0;
    let j = len(heights) - 1;
    let left_max = 0;
    let right_max = 0;
    let water = 0;
    while i < j {
        if heights[i] < heights[j] {
            if heights[i] >= left_max {
                left_max = heights[i];
            } else {
                water += left_max - heights[i];
            }
            i += 1;
        } else {
            if heights[j] >= right_max {
                right_max = heights[j];
            } else {
                water += right_max - heights[j];
            }
            j -= 1;
        }
    }
    return water;
}
'''
naive = '''
fn trap(heights: vec<int>) -> int {
    let water = 0;
    for i in range(len(heights)) {
        let left = 0;
        for j in range(i + 1) {
            left = max(left, heights[j]);
        }
        let right = 0;
        for j in range(i, len(heights)) {
            right = max(right, heights[j]);
        }
        water += min(left, right) - heights[i];
    }
    return water;
}
'''

