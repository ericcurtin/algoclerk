title = "Boss: Rain on the Roofs"
order = 1
story = "The skyline of the old town is a row of roofs of different heights. After a heavy rain, water pools between taller roofs. How much is trapped?"
statement = "heights[i] is the height of a unit-wide roof. Return the total units of water trapped between them after rain."
prelude = '''
#include <vector>
'''
signature = "int trap(const std::vector<int>& heights)"
constraints = ["0 <= heights.size() <= 20000", "0 <= heights[i] <= 1000"]
technique = "Two pointers with running maxima"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>"]
hints = [
  "The water above a roof depends on the tallest roof to its left and right: min of the two minus its own height.",
  "Recomputing both maxima for every roof is O(n squared). `heights` is a `const&`, so scanning it repeatedly does not copy it, but it still costs a full pass each time.",
  "Walk two pointers inward (`int i = 0, j = static_cast<int>(heights.size()) - 1;`, so an empty row gives `j = -1`); always advance the side with the lower roof, tracking the best seen on that side.",
]
reference = '''
int trap(const std::vector<int>& heights) {
    int i = 0;
    int j = static_cast<int>(heights.size()) - 1;
    int leftMax = 0;
    int rightMax = 0;
    int water = 0;
    while (i < j) {
        if (heights[i] < heights[j]) {
            if (heights[i] >= leftMax) {
                leftMax = heights[i];
            } else {
                water += leftMax - heights[i];
            }
            ++i;
        } else {
            if (heights[j] >= rightMax) {
                rightMax = heights[j];
            } else {
                water += rightMax - heights[j];
            }
            --j;
        }
    }
    return water;
}
'''
naive = '''
#include <algorithm>

int trap(const std::vector<int>& heights) {
    const int n = static_cast<int>(heights.size());
    int water = 0;
    for (int i = 0; i < n; ++i) {
        int left = 0;
        for (int j = 0; j <= i; ++j) {
            left = std::max(left, heights[j]);
        }
        int right = 0;
        for (int j = i; j < n; ++j) {
            right = std::max(right, heights[j]);
        }
        water += std::min(left, right) - heights[i];
    }
    return water;
}
'''

