title = "Boss: Eight Chess Queens"
order = 3
story = "The CEO collects chess queens and wants to know in how many ways n of them can sit on an n by n board without any two attacking each other."
statement = "Return the number of ways to place n queens on an n x n board so that no two share a row, column or diagonal."
prelude = '''
'''
signature = "int countQueens(int n)"
constraints = ["0 <= n <= 8"]
technique = "Backtracking"
big_o = "O(n) time, O(n) space"
unlocked = ["<unordered_set>", "<vector>", "<cstdlib>"]
hints = [
  "Place queens one row at a time.",
  "Keep three sets: used columns, used diagonals (row - col) and anti-diagonals (row + col). `std::unordered_set<int>` from `<unordered_set>` has `count`, `insert` and `erase`.",
  "A helper with reference parameters, like `int place(int row, int n, std::unordered_set<int>& cols, std::unordered_set<int>& d1, std::unordered_set<int>& d2)`, lets the recursion share the sets (a by-value set would be copied on every call): insert before the recursive call, erase after.",
]
reference = '''
#include <unordered_set>

int place(int row, int n, std::unordered_set<int>& cols, std::unordered_set<int>& d1,
          std::unordered_set<int>& d2) {
    if (row == n) {
        return 1;
    }
    int total = 0;
    for (int c = 0; c < n; ++c) {
        if (cols.count(c) != 0 || d1.count(row - c) != 0 || d2.count(row + c) != 0) {
            continue;
        }
        cols.insert(c);
        d1.insert(row - c);
        d2.insert(row + c);
        total += place(row + 1, n, cols, d1, d2);
        cols.erase(c);
        d1.erase(row - c);
        d2.erase(row + c);
    }
    return total;
}

int countQueens(int n) {
    std::unordered_set<int> cols;
    std::unordered_set<int> d1;
    std::unordered_set<int> d2;
    return place(0, n, cols, d1, d2);
}
'''
naive = '''
#include <cstdlib>
#include <vector>

int countQueens(int n) {
    int total = 0;
    int limit = 1;
    for (int i = 0; i < n; ++i) {
        limit *= n;
    }
    for (int code = 0; code < limit; ++code) {
        std::vector<int> cols;
        int x = code;
        for (int r = 0; r < n; ++r) {
            cols.push_back(x % n);
            x /= n;
        }
        bool ok = true;
        for (int a = 0; a < n; ++a) {
            for (int b = a + 1; b < n; ++b) {
                if (cols[a] == cols[b] || std::abs(cols[a] - cols[b]) == b - a) {
                    ok = false;
                }
            }
        }
        if (ok) {
            total += 1;
        }
    }
    return total;
}
'''

