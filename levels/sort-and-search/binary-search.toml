id = "binary-search"
title = "Halving the Haystack"
order = 4
summary = "Find a number in a sorted row by repeatedly halving the search range."
story = "The row of filing drawers is sorted by number. Checking every drawer would take all day; opening the middle drawer and deciding which half to look in next takes a handful of steps."
statement = "The floor holds n different numbers in ascending order on tiles 0 to n-1. The inbox holds n and then a target number. Output the position (0-based) of the target, or -1 if it is not there."
constraints = ["0 <= n <= 8. The numbers are between 1 and 30 and strictly ascending.", "Tile 8 holds 0, tile 12 holds 2, tile 13 holds -1 and tile 14 holds 1 at the start."]
hints = [
  "Keep a low and a high position, initially 0 and n-1. Stop when low is above high.",
  "The middle is (low + high) div 2. Read the number there with COPYFROM [mid] after saving mid on a tile.",
  "If the middle number is too small, continue above it (low = mid + 1); if too large, continue below it (high = mid - 1).",
]

[[examples]]
input = [5, 7]
floor = [{ at = 0, values = [1, 3, 7, 9, 12] }]
output = [2]

[[examples]]
input = [3, 4]
floor = [{ at = 0, values = [1, 3, 7] }]
output = [-1]

[machine]
floor = 15
names = ["", "", "", "", "", "", "", "", "low", "high", "mid", "target", "two", "minus_one", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "div", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
8 = 0
12 = 2
13 = -1
14 = 1

[tests]
seed = 504
[[tests.fixed]]
input = [0, 5]
output = [-1]
[[tests.fixed]]
input = [1, 5]
floor = [{ at = 0, values = [5] }]
output = [0]
[[tests.fixed]]
input = [8, 1]
floor = [{ at = 0, values = [1, 2, 3, 4, 5, 6, 7, 8] }]
output = [0]
[[tests.fixed]]
input = [8, 8]
floor = [{ at = 0, values = [1, 2, 3, 4, 5, 6, 7, 8] }]
output = [7]
[[tests.fixed]]
input = [8, 9]
floor = [{ at = 0, values = [1, 2, 3, 4, 5, 6, 7, 8] }]
output = [-1]
[[tests.generators]]
count = 10
vars = [{ kind = "list", len = [0, 8], range = [1, 30], distinct = true, sort = "asc" }]
floor = [{ at = 0, seg = { kind = "copy", of = 0 } }]
inbox = [
  { kind = "len", of = 0 },
  { kind = "pick", of = 0, chance = 60, range = [1, 30] },
]

[targets]
size_par = 35
size_ace = 28
speed_par = 56
speed_ace = 37

[solution]
asm = """
    INBOX
    SUB 14
    COPYTO 9
    INBOX
    COPYTO 11
loop:
    COPYFROM 9
    SUB 8
    JUMPN notfound
    COPYFROM 8
    ADD 9
    DIV 12
    COPYTO 10
    COPYFROM [10]
    SUB 11
    JUMPZ found
    JUMPN right
    COPYFROM 10
    SUB 14
    COPYTO 9
    JUMP loop
right:
    COPYFROM 10
    ADD 14
    COPYTO 8
    JUMP loop
found:
    COPYFROM 10
    JUMP out
notfound:
    COPYFROM 13
out:
    OUTBOX
"""

[code]
function = "binary_search"
doc = "Returns the index of the target in the sorted values, or -1."
params = [
  { name = "values", kind = "list", at = 0, cap = 8 },
  { name = "n", kind = "length", of = "values" },
  { name = "target", kind = "scalar" },
]
returns = "scalar"

[explain]
algorithm = "Binary search"
text = "Every probe throws away half of the remaining range, so a sorted array of n items needs only about log2(n) probes. Getting the boundaries (low > high, mid + 1, mid - 1) exactly right is the classic source of off-by-one bugs."
