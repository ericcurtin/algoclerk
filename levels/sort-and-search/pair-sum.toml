id = "pair-sum"
title = "Two Dials"
order = 5
summary = "Is there a pair of numbers in a sorted row that adds up to a target?"
story = "A safe has two dials. The combination is a pair of different numbers from a sorted row of keys, and the pair must add up to today's code. Rather than try every pair, move one dial in from each end of the row."
statement = "The floor holds n different numbers in ascending order on tiles 0 to n-1. The inbox holds n and then a target. Output 1 if two numbers at different positions add up to the target, otherwise 0."
constraints = ["0 <= n <= 8. The numbers are between 1 and 25 and strictly ascending.", "Tile 8 holds 0, tile 11 holds 1 and tile 12 holds 0 at the start."]
hints = [
  "Keep two positions: low starts at the first number, high at the last.",
  "If the pair adds up to too little, the low number can never work with anything smaller than high, so move low up. If it is too large, move high down.",
  "Stop when the positions meet. ADD [9] adds the number at the position stored on tile 9.",
]

[[examples]]
input = [5, 16]
floor = [{ at = 0, values = [2, 4, 7, 9, 12] }]
output = [1]
note = "4 + 12 = 16"

[[examples]]
input = [3, 8]
floor = [{ at = 0, values = [1, 4, 6] }]
output = [0]

[machine]
floor = 13
names = ["", "", "", "", "", "", "", "", "low", "high", "wanted", "one", "zero"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "bumpup", "bumpdn", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
8 = 0
11 = 1
12 = 0

[tests]
seed = 505
[[tests.fixed]]
input = [0, 3]
output = [0]
[[tests.fixed]]
input = [1, 4]
floor = [{ at = 0, values = [2] }]
output = [0]
[[tests.fixed]]
input = [2, 5]
floor = [{ at = 0, values = [2, 3] }]
output = [1]
[[tests.fixed]]
input = [8, 49]
floor = [{ at = 0, values = [18, 19, 20, 21, 22, 23, 24, 25] }]
output = [1]
[[tests.generators]]
count = 11
vars = [{ kind = "list", len = [0, 8], range = [1, 25], distinct = true, sort = "asc" }]
floor = [{ at = 0, seg = { kind = "copy", of = 0 } }]
inbox = [
  { kind = "len", of = 0 },
  { kind = "pairsum", of = 0, chance = 55, range = [2, 50] },
]

[targets]
size_par = 27
size_ace = 22
speed_par = 65
speed_ace = 43

[solution]
asm = """
    INBOX
    SUB 11
    COPYTO 9
    INBOX
    COPYTO 10
loop:
    COPYFROM 9
    SUB 8
    JUMPN no
    JUMPZ no
    COPYFROM [8]
    ADD [9]
    SUB 10
    JUMPZ yes
    JUMPN up
    BUMPDN 9
    JUMP loop
up:
    BUMPUP 8
    JUMP loop
yes:
    COPYFROM 11
    JUMP out
no:
    COPYFROM 12
out:
    OUTBOX
"""

[code]
function = "has_pair_with_sum"
doc = "Returns true if two different positions hold numbers that add up to the target."
params = [
  { name = "values", kind = "list", at = 0, cap = 8 },
  { name = "n", kind = "length", of = "values" },
  { name = "target", kind = "scalar" },
]
returns = "scalar"
return_type = "bool"

[explain]
algorithm = "Two pointers on sorted data"
text = "Because the row is sorted, comparing the current pair sum with the target tells which pointer to move, so every position is visited at most once: O(n) instead of the O(n^2) of trying all pairs."
