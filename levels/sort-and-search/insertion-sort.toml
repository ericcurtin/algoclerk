id = "insertion-sort"
title = "Card Hand"
order = 1
summary = "Sort numbers as they arrive by sliding each into place."
story = "A card player sorts a hand by picking up one card at a time and sliding it into its place among the cards already held. The Shelves hold the hand; a blank tile at the left edge acts as a stopper."
statement = "The inbox holds a list of numbers between 1 and 9 followed by a 0 marker. Output the numbers in ascending order."
constraints = ["The list has between 0 and 8 numbers, each between 1 and 9.", "Tile 0 holds 4, tile 4 holds 0 (a stopper smaller than every number) and tile 13 holds 4. Tiles 5 to 12 are free for the hand."]
hints = [
  "Keep the sorted hand on tiles 5, 6, 7, ... with tile 0 pointing at its last element.",
  "To insert x: open a hole after the last element, then shift larger elements one place to the right until the element to the left is not larger than x.",
  "The stopper on tile 4 ends the shifting when x is the smallest value so far.",
]

[[examples]]
input = [3, 1, 2, 0]
output = [1, 2, 3]

[machine]
floor = 14
names = ["last", "x", "left", "hole", "stopper"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "bumpup", "bumpdn", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
0 = 4
4 = 0
13 = 4

[tests]
seed = 501
[[tests.fixed]]
input = [0]
output = []
[[tests.fixed]]
input = [5, 0]
output = [5]
[[tests.fixed]]
input = [9, 8, 7, 6, 5, 4, 3, 2, 0]
output = [2, 3, 4, 5, 6, 7, 8, 9]
[[tests.fixed]]
input = [1, 2, 3, 4, 5, 6, 7, 8, 0]
output = [1, 2, 3, 4, 5, 6, 7, 8]
[[tests.fixed]]
input = [4, 4, 4, 1, 1, 0]
output = [1, 1, 4, 4, 4]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [0, 8], range = [1, 9], terminator = 0 }]

[targets]
size_par = 35
size_ace = 28
speed_par = 206
speed_ace = 137

[solution]
asm = """
read:
    INBOX
    JUMPZ out
    COPYTO 1
    BUMPUP 0
    COPYTO 3
find:
    COPYFROM 3
    COPYTO 2
    BUMPDN 2
    COPYFROM [2]
    SUB 1
    JUMPN place
    JUMPZ place
    COPYFROM [2]
    COPYTO [3]
    BUMPDN 3
    JUMP find
place:
    COPYFROM 1
    COPYTO [3]
    JUMP read
out:
    COPYFROM 13
    COPYTO 2
print:
    COPYFROM 2
    SUB 0
    JUMPZ end
    BUMPUP 2
    COPYFROM [2]
    OUTBOX
    JUMP print
end:
"""

[code]
function = "insertion_sort"
doc = "Returns the values in ascending order."
params = [{ name = "values", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Insertion sort"
text = "Each new element is inserted into the already sorted prefix by shifting larger elements aside. It is O(n^2) in the worst case but very fast on nearly sorted data, and works online, one element at a time."
