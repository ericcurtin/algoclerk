id = "coin-change"
title = "Exact Change"
order = 2
summary = "Find the fewest coins that make an amount, with coins worth 1, 3 and 4."
story = "The vending machine in the lobby only has coins worth 1, 3 and 4 pennies. It must always give change with as few coins as possible, but handing out the biggest coin first does not always work."
statement = "The inbox holds an amount a. Output the smallest number of coins (worth 1, 3 or 4) that add up to exactly a."
constraints = ["1 <= a <= 12.", "Tiles 0 to 3 hold 99 (a value no real answer reaches), tile 4 holds 0, tile 17 holds 4 and tile 22 holds 1 at the start. Tiles 5 to 16 are free for the table."]
hints = [
  "Fill a table: best(x) = 1 + the smallest of best(x-1), best(x-3) and best(x-4). The table entry for 0 is 0.",
  "Tiles 0 to 3 act as padding that holds 99, so looking back before the start of the table never wins and needs no special case.",
  "Table entry x lives on tile 4 + x. Use a pointer tile that moves up one tile per amount and a second one that you move back to read the three earlier entries.",
]

[[examples]]
input = [6]
output = [2]
note = "3 + 3. Greedy would use 4 + 1 + 1."

[machine]
floor = 23
names = ["pad", "pad", "pad", "pad", "zero_coins", "", "", "", "", "", "", "", "", "", "", "", "", "here", "look", "best", "remaining", "", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "bumpdn", "bumpup", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
0 = 99
1 = 99
2 = 99
3 = 99
4 = 0
17 = 4
22 = 1

[tests]
seed = 602
[[tests.fixed]]
input = [1]
output = [1]
[[tests.fixed]]
input = [3]
output = [1]
[[tests.fixed]]
input = [6]
output = [2]
[[tests.fixed]]
input = [11]
output = [3]
[[tests.fixed]]
input = [12]
output = [3]
[[tests.generators]]
count = 8
inbox = [{ kind = "int", range = [1, 12] }]

[targets]
size_par = 38
size_ace = 31
speed_par = 210
speed_ace = 140

[solution]
asm = """
    INBOX
    COPYTO 20
loop:
    COPYFROM 20
    JUMPZ done
    BUMPUP 17
    COPYTO 18
    BUMPDN 18
    COPYFROM [18]
    COPYTO 19
    BUMPDN 18
    BUMPDN 18
    COPYFROM [18]
    SUB 19
    JUMPN take3
back3:
    BUMPDN 18
    COPYFROM [18]
    SUB 19
    JUMPN take4
store:
    COPYFROM 19
    ADD 22
    COPYTO [17]
    BUMPDN 20
    JUMP loop
take3:
    COPYFROM [18]
    COPYTO 19
    JUMP back3
take4:
    COPYFROM [18]
    COPYTO 19
    JUMP store
done:
    COPYFROM [17]
    OUTBOX
"""

[code]
function = "min_coins"
doc = "Returns the fewest coins of value 1, 3 and 4 that make the amount."
params = [{ name = "amount", kind = "scalar" }]
returns = "scalar"

[explain]
algorithm = "Bottom-up dynamic programming"
text = "Greedy choices fail for these coins, so every smaller amount is solved first and stored in a table; each entry combines the already known best answers. Padding the table avoids bounds checks at the start."
