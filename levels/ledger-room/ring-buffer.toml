id = "ring-buffer"
title = "Round Robin Queue"
order = 4
summary = "Simulate a waiting line that holds at most three people."
story = "The reception desk has three chairs. Visitors join the line at one end and are called from the other, in the order they arrived. When all chairs are taken, a new visitor is turned away. The chairs form a ring: after the last chair comes the first."
statement = "The inbox holds commands followed by a 0 marker. A positive number joins the line, unless three people are already waiting, in which case it is ignored. A negative number calls the person who has waited longest and outputs their number, or outputs 0 if nobody is waiting."
constraints = ["There are between 0 and 12 commands, each between -3 and 6 and not 0.", "Tiles 0 and 1 hold 0, tile 4 holds 3, tile 5 holds 1 and tile 6 holds 8 at the start. Tiles 8 to 10 are the three chairs."]
hints = [
  "Keep the position of the oldest person (head) and the number of people waiting (count) on tiles.",
  "A newcomer sits at position (head + count) mod 3. The person called leaves position head, and head moves on to (head + 1) mod 3.",
  "Chair k is tile 8 + k. Add the base 8 to an index before using it as a pointer.",
]

[[examples]]
input = [4, 5, -1, 6, 7, 8, -1, -1, 0]
output = [4, 5, 6]
note = "8 is turned away because three people are waiting."

[machine]
floor = 11
names = ["head", "count", "newcomer", "", "capacity", "one", "base", "chair", "chair_0", "chair_1", "chair_2"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn", "indirect"]
[machine.prefill]
0 = 0
1 = 0
4 = 3
5 = 1
6 = 8

[tests]
seed = 604
[[tests.fixed]]
input = [0]
output = []
[[tests.fixed]]
input = [-1, 0]
output = [0]
[[tests.fixed]]
input = [1, 2, 3, 4, 5, -1, -1, -1, -1, 0]
output = [1, 2, 3, 0]
[[tests.fixed]]
input = [1, -1, 2, -1, 3, -1, 4, -1, 0]
output = [1, 2, 3, 4]
[[tests.fixed]]
input = [1, 2, 3, -1, 4, 5, -1, 6, -1, -1, -1, 0]
output = [1, 2, 3, 4, 6]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [0, 12], range = [-3, 6], nonzero = true, terminator = 0 }]

[targets]
size_par = 38
size_ace = 31
speed_par = 144
speed_ace = 96

[solution]
asm = """
loop:
    INBOX
    JUMPZ end
    JUMPN pop
    COPYTO 2
    COPYFROM 1
    SUB 4
    JUMPZ loop
    COPYFROM 0
    ADD 1
    MOD 4
    ADD 6
    COPYTO 7
    COPYFROM 2
    COPYTO [7]
    BUMPUP 1
    JUMP loop
pop:
    COPYFROM 1
    JUMPZ none
    COPYFROM 0
    ADD 6
    COPYTO 7
    COPYFROM [7]
    OUTBOX
    COPYFROM 0
    ADD 5
    MOD 4
    COPYTO 0
    BUMPDN 1
    JUMP loop
none:
    OUTBOX
    JUMP loop
end:
"""

[code]
function = "run_queue"
doc = "Simulates the three-chair queue and returns the people called."
params = [{ name = "commands", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Ring buffer (circular queue)"
text = "A fixed array with a head index and a count makes a queue with O(1) push and pop and no shifting. Indexes wrap around with a modulo, so the array is treated as a ring."
