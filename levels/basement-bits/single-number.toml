title = "The Odd One Out"
order = 1
story = "Every badge in the box was scanned twice, except one that was scanned once. Which badge is the loner?"
statement = "Every value in nums appears exactly twice except one value that appears once. Return that value."
prelude = '''
#include <vector>
'''
signature = "int singleNumber(const std::vector<int>& nums)"
constraints = ["1 <= nums.size() <= 20001, odd length"]
technique = "XOR cancellation"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>"]
hints = [
  "A number xor itself is 0, and xor with 0 changes nothing.",
  "The order of xors does not matter.",
  "xor all numbers together with `^=`: the pairs cancel and the loner remains. Loop with `for (int x : nums)`; `nums` is a `const&`, so nothing is copied.",
]
reference = '''
int singleNumber(const std::vector<int>& nums) {
    int acc = 0;
    for (int x : nums) {
        acc ^= x;
    }
    return acc;
}
'''
naive = '''
#include <algorithm>

int singleNumber(const std::vector<int>& nums) {
    for (int x : nums) {
        if (std::count(nums.begin(), nums.end(), x) == 1) {
            return x;
        }
    }
    return 0;
}
'''

[budgets]
large_steps = 3000000

[medals]
size = [18, 14, 11]
speed = [60, 32, 23]

[[examples]]
args = ["{2, 2, 1}"]
expect = "1"

[[examples]]
args = ["{4, 1, 2, 1, 2}"]
expect = "4"

[[examples]]
args = ["{7}"]
expect = "7"

[[tests]]
args = ["{-3, 5, 5}"]
expect = "-3"

