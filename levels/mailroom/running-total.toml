title = "Running Total"
order = 8
story = "The cashier writes down the till total after every sale, so the auditor can see exactly when the money went missing."
statement = "Return a shelf of the same length where slot i holds the sum of nums[0] up to nums[i]. `std::partial_sum` and `std::accumulate` are locked."
prelude = '''
#include <vector>
'''
signature = "std::vector<int> runningTotal(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 100000", "-1000 <= nums[i] <= 1000"]
technique = "Prefix sums"
big_o = "O(n) time, O(n) space"
locked = [
  { name = "std::partial_sum", why = "It is exactly this exercise." },
  { name = "std::accumulate", why = "Re-summing every prefix would be O(n^2); build it incrementally." },
  { name = "<numeric>", why = "That drawer only holds the adding-up tools." },
]
hints = [
  "Keep one running variable and push it onto the result after every number.",
  "`total += x; out.push_back(total);`. Loop with `for (int x : nums)`, and remember `nums` is a `const std::vector<int>&`: reading it is free, while a by-value `std::vector<int>` would copy all n numbers on every call.",
  "Each answer reuses the previous one: that is the prefix-sum trick.",
]
reference = '''
std::vector<int> runningTotal(const std::vector<int>& nums) {
    std::vector<int> out;
    int total = 0;
    for (int x : nums) {
        total += x;
        out.push_back(total);
    }
    return out;
}
'''
naive = '''
std::vector<int> runningTotal(const std::vector<int>& nums) {
    std::vector<int> out;
    for (std::size_t i = 0; i < nums.size(); ++i) {
        int total = 0;
        for (std::size_t j = 0; j <= i; ++j) {
            total += nums[j];
        }
        out.push_back(total);
    }
    return out;
}
'''

[medals]
size = [28, 22, 17]
speed = [100, 54, 38]

[[examples]]
args = ["{1, 2, 3, 4}"]
expect = "{1, 3, 6, 10}"

[[examples]]
args = ["{}"]
expect = "{}"

[[tests]]
args = ["{5, -5, 5}"]
expect = "{5, 0, 5}"

