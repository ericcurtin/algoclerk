title = "Running Total"
order = 8
story = "The cashier writes down the till total after every sale, so the auditor can see exactly when the money went missing."
statement = "Return a shelf of the same length where slot i holds the sum of nums[0] up to nums[i]."
signature = "fn running_total(nums: vec<int>) -> vec<int>"
constraints = ["0 <= len(nums) <= 100000", "-1000 <= nums[i] <= 1000"]
technique = "Prefix sums"
big_o = "O(n) time, O(n) space"
types = ["vec"]
builtins = ["push", "len"]
locked = [{ name = "sum", why = "Re-summing every prefix would be O(n^2); build it incrementally." }]
hints = [
  "Keep one running variable and push it after every number.",
  "`total += x; out.push(total);`",
  "Each answer reuses the previous one: that is the prefix-sum trick.",
]
reference = '''
fn running_total(nums: vec<int>) -> vec<int> {
    let out: vec<int> = [];
    let total = 0;
    for x in nums {
        total += x;
        out.push(total);
    }
    return out;
}
'''
naive = '''
fn running_total(nums: vec<int>) -> vec<int> {
    let out: vec<int> = [];
    for i in range(len(nums)) {
        let total = 0;
        for j in range(i + 1) {
            total += nums[j];
        }
        out.push(total);
    }
    return out;
}
'''
[medals]
size = [24, 19, 15]
speed = [97, 52, 37]
[[examples]]
args = ["[1, 2, 3, 4]"]
expect = "[1, 3, 6, 10]"
[[examples]]
args = ["[]"]
expect = "[]"
[[tests]]
