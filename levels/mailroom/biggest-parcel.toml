title = "Biggest Parcel"
order = 4
story = "A row of parcels waits on the scale. The courier only takes the heaviest one today."
statement = "Return the largest number on the shelf. The shelf is never empty. `std::max`, `std::min` and `std::max_element` are locked; compare as you go."
prelude = '''
#include <vector>
'''
signature = "int biggestParcel(const std::vector<int>& weights)"
constraints = ["1 <= weights.size() <= 100000", "-100000 <= weights[i] <= 100000"]
technique = "Running maximum"
big_o = "O(n) time, O(1) space"
locked = [
  { name = "std::max", why = "Finding the biggest is the lesson." },
  { name = "std::min", why = "Same family of tools." },
  { name = "std::max_element", why = "It would do the whole job for you." },
  { name = "std::min_element", why = "Same family of tools." },
  { name = "<algorithm>", why = "That drawer only holds tools that find the biggest for you." },
]
hints = [
  "Start by assuming the first parcel `weights[0]` is the biggest. (`weights` is a read-only `const std::vector<int>&`; the shelf is never empty, so index 0 exists.)",
  "Visit every parcel with `for (int w : weights)`; whenever one is heavier, remember it instead.",
  "`if (w > best) { best = w; }`",
]
reference = '''
int biggestParcel(const std::vector<int>& weights) {
    int best = weights[0];
    for (int w : weights) {
        if (w > best) {
            best = w;
        }
    }
    return best;
}
'''

[medals]
size = [24, 19, 15]
speed = [72, 39, 28]

[[examples]]
args = ["{3, 9, 4}"]
expect = "9"

[[examples]]
args = ["{-7}"]
expect = "-7"
note = "One parcel, so it is the biggest."

[[tests]]
args = ["{-3, -9, -1, -4}"]
expect = "-1"

[[generate]]
seed = 41
count = 10
args = [{ kind = "vec_int", len = [1, 15], range = [-100000, 100000] }]

[[generate]]
seed = 42
count = 2
large = true
n = 20000
args = [{ kind = "vec_int", len = "n", range = [-100000, 100000] }]
