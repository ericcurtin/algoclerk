title = "Reverse the Label"
order = 6
story = "The label printer feeds paper backwards. Every label has to be typed in reverse so it reads correctly when it comes out."
statement = "Return s written backwards. `std::reverse` and the reverse iterators are locked: build the new string yourself."
prelude = '''
#include <string>
'''
signature = "std::string reverseLabel(const std::string& s)"
constraints = ["0 <= s.size() <= 100000"]
technique = "Build a string, two pointers"
big_o = "O(n) time, O(n) space"
locked = [
  { name = "std::reverse", why = "That is the whole exercise." },
  { name = "std::string::rbegin", why = "Reverse iterators would do the whole exercise." },
  { name = "std::string::rend", why = "Reverse iterators would do the whole exercise." },
  { name = "<algorithm>", why = "That drawer only holds tools that reverse things for you." },
]
hints = [
  "Start with an empty result: `std::string out;`.",
  "Walk the indices from the end. An unsigned index cannot go below zero, so count down with `for (std::size_t i = s.size(); i > 0; --i)` and read `s[i - 1]`.",
  "Add each letter: `out += s[i - 1];` (appending one `char` is cheap). `s` is a `const std::string&`, so reading from it never copies it.",
]
reference = '''
std::string reverseLabel(const std::string& s) {
    std::string out;
    for (std::size_t i = s.size(); i > 0; --i) {
        out += s[i - 1];
    }
    return out;
}
'''

[medals]
size = [26, 20, 16]
speed = [108, 58, 41]

[[examples]]
args = ['"stamp"']
expect = '"pmats"'

[[examples]]
args = ['""']
expect = '""'

[[tests]]
args = ['"a"']
expect = '"a"'

[[tests]]
args = ['"Hello, World!"']
expect = '"!dlroW ,olleH"'

