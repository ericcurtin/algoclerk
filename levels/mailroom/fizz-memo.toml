title = "The Fizz Memo"
order = 7
story = "The CEO insists every memo is numbered, but numbers divisible by 3 must say Fizz, by 5 must say Buzz, and by both FizzBuzz. Nobody knows why."
statement = "Return a shelf of n words for the numbers 1 to n: \"FizzBuzz\" when divisible by 15, \"Fizz\" when divisible by 3, \"Buzz\" when divisible by 5, otherwise the number itself as a word (use `to_string`)."
signature = "fn fizz_memo(n: int) -> vec<string>"
constraints = ["0 <= n <= 100000"]
technique = "Loop with branching"
big_o = "O(n) time, O(n) space"
types = ["vec", "string"]
builtins = ["push", "to_string"]
hints = [
  "`let out: vec<string> = [];` makes an empty shelf of words.",
  "`for i in range(1, n + 1)` counts from 1 to n.",
  "Check divisibility by 15 first, then 3, then 5: `i % 15 == 0`.",
]
reference = '''
fn fizz_memo(n: int) -> vec<string> {
    let out: vec<string> = [];
    for i in range(1, n + 1) {
        if i % 15 == 0 {
            out.push("FizzBuzz");
        } else if i % 3 == 0 {
            out.push("Fizz");
        } else if i % 5 == 0 {
            out.push("Buzz");
        } else {
            out.push(to_string(i));
        }
    }
    return out;
}
'''
[medals]
size = [71, 55, 44]
speed = [587, 314, 217]
[[examples]]
args = ["5"]
expect = '["1", "2", "Fizz", "4", "Buzz"]'
[[examples]]
args = ["15"]
expect = '["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]'
note = "FizzBuzz appears at 15."
[[tests]]
args = ["0"]
expect = "[]"
[[tests]]
args = ["15"]
expect = '["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]'
[[generate]]
seed = 71
count = 8
args = [{ kind = "int", range = [0, 40] }]
[[generate]]
seed = 72
count = 1
large = true
n = 20000
args = [{ kind = "int", range = ["n", "n"] }]
