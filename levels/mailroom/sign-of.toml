id = "sign-of"
title = "Which Way Is Up"
order = 7
summary = "Output -1, 0 or 1 depending on the sign of each value."
story = "The filing cabinet only has three drawers: Owed, Settled and Due. Tiles 0 and 1 hold the numbers 1 and -1 so that you do not have to compute them."
statement = "For each value x in the inbox, output 1 if x is positive, -1 if x is negative and 0 if x is zero."
constraints = ["The inbox holds between 0 and 8 values.", "Every value is between -9 and 9.", "Tile 0 holds 1 and tile 1 holds -1 at the start."]
hints = [
  "JUMPZ jumps when you hold zero, JUMPN when you hold a negative number.",
  "If the value is zero you are already holding the answer: you can output it as is.",
  "Test for zero first, then negative. Everything else is positive.",
]

[[examples]]
input = [5, 0, -2]
output = [1, 0, -1]

[machine]
floor = 2
names = ["plus_one", "minus_one"]
allowed = ["inbox", "outbox", "copyfrom", "jump", "jumpz", "jumpn"]
[machine.prefill]
0 = 1
1 = -1

[tests]
seed = 107
[[tests.fixed]]
input = []
output = []
[[tests.fixed]]
input = [0, 0]
output = [0, 0]
[[tests.fixed]]
input = [9, -9, 1, -1]
output = [1, -1, 1, -1]
[[tests.generators]]
count = 8
inbox = [{ kind = "list", len = [1, 8], range = [-9, 9] }]

[targets]
size_par = 10
size_ace = 8
speed_par = 44
speed_ace = 29

[solution]
asm = """
again:
    INBOX
    JUMPZ out
    JUMPN negative
    COPYFROM 0
    JUMP out
negative:
    COPYFROM 1
out:
    OUTBOX
    JUMP again
"""

[code]
function = "signum_all"
doc = "Returns the sign (-1, 0 or 1) of every value."
params = [{ name = "values", kind = "list" }]
returns = "list"

[explain]
algorithm = "Three-way comparison"
text = "Comparing a value against zero gives three outcomes. Checking the cheapest or most common case first keeps the number of tests small."
