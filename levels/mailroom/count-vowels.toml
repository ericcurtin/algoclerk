title = "Count the Vowels"
order = 3
story = "The sign painter charges by the vowel, because vowels use the expensive blue paint. Count them before quoting."
statement = "Return how many letters of s are vowels: a, e, i, o or u, in either upper or lower case."
prelude = '''
#include <string>
'''
signature = "int countVowels(const std::string& s)"
constraints = ["0 <= s.size() <= 100000", "s holds plain ASCII letters, digits, spaces and punctuation"]
technique = "Scan a string"
big_o = "O(n) time, O(1) space"
unlocked = ["<cctype>"]
hints = [
  "A `std::string` is a shelf of `char`s: `for (char c : s) { ... }` visits each one.",
  "A string can answer questions too: `vowels.find(c) != std::string::npos` is true when `c` occurs in the string `vowels`.",
  "Do not forget capital letters: list both cases in `vowels`, or `#include <cctype>` and lower-case each letter with `std::tolower`.",
]
reference = '''
int countVowels(const std::string& s) {
    const std::string vowels = "aeiouAEIOU";
    int count = 0;
    for (char c : s) {
        if (vowels.find(c) != std::string::npos) {
            count += 1;
        }
    }
    return count;
}
'''

[medals]
size = [21, 17, 13]
speed = [376, 201, 139]

[[examples]]
args = ['"hello"']
expect = "2"

[[examples]]
args = ['"RHYTHM"']
expect = "0"
note = "No vowels at all."

[[tests]]
args = ['""']
expect = "0"

[[tests]]
args = ['"AEIOUaeiou"']
expect = "10"

[[generate]]
seed = 31
count = 10
args = [{ kind = "string", len = [0, 20], alphabet = "abcdeEAIOUxyz 1!" }]

[[generate]]
seed = 32
count = 2
large = true
n = 20000
args = [{ kind = "string", len = "n", alphabet = "abcdeEAIOUxyz 1!" }]
