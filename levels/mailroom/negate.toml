id = "negate"
title = "Mirror Image"
order = 5
summary = "Output the negative of every value."
story = "A clerk in the next wing keeps writing figures with the wrong sign. Tile 0 holds a spotless zero for you to use. Subtraction is now yours."
statement = "For each value x in the inbox, output -x."
constraints = ["The inbox holds between 0 and 8 values.", "Every value is between -9 and 9.", "Tile 0 holds 0 at the start."]
hints = [
  "SUB n subtracts the value on tile n from the value in your hand.",
  "0 - x is the same as -x. Pick up the zero, then subtract x, which you parked on another tile.",
]

[[examples]]
input = [4, -7, 0]
output = [-4, 7, 0]

[machine]
floor = 2
names = ["zero", "x"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "jump"]
[machine.prefill]
0 = 0

[tests]
seed = 105
[[tests.fixed]]
input = []
output = []
[[tests.fixed]]
input = [9, -9, 1]
output = [-9, 9, -1]
[[tests.fixed]]
input = [0]
output = [0]
[[tests.generators]]
count = 8
inbox = [{ kind = "list", len = [1, 8], range = [-9, 9] }]

[targets]
size_par = 7
size_ace = 6
speed_par = 35
speed_ace = 23

[solution]
asm = """
again:
    INBOX
    COPYTO 1
    COPYFROM 0
    SUB 1
    OUTBOX
    JUMP again
"""

[code]
function = "negate_all"
doc = "Negates every value."
params = [{ name = "values", kind = "list" }]
returns = "list"

[explain]
algorithm = "Additive inverse"
text = "Negation is subtraction from zero. Keeping a constant zero around is a common trick when an instruction set has no direct negate."
