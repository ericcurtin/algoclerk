title = "Sum the Bills"
order = 2
story = "Month end. A shelf of invoices sits on your desk and the boss wants one number: the total owed."
statement = "Return the sum of all numbers on the shelf. An empty shelf sums to 0. `std::accumulate` is locked; walk the shelf yourself."
prelude = '''
#include <vector>
'''
signature = "int sumTheBills(const std::vector<int>& bills)"
constraints = ["0 <= bills.size() <= 100000", "-1000 <= bills[i] <= 1000"]
technique = "Accumulator loop"
big_o = "O(n) time, O(1) space"
locked = [
  { name = "std::accumulate", why = "Adding things up is the whole exercise." },
  { name = "<numeric>", why = "That drawer holds the adding-up tools, and adding up is the exercise." },
]
hints = [
  "Keep a running total in an `int` that starts at 0.",
  "`for (int bill : bills) { ... }` visits every number once. The parameter is `const std::vector<int>&`: a read-only reference, so the shelf is not copied (a by-value `std::vector<int>` would cost the whole shelf on every call).",
  "Inside the loop: `total += bill;`. At most 100000 bills of at most 1000 fit easily in an `int`.",
]
reference = '''
int sumTheBills(const std::vector<int>& bills) {
    int total = 0;
    for (int bill : bills) {
        total += bill;
    }
    return total;
}
'''

[medals]
size = [15, 12, 9]
speed = [71, 38, 27]

[[examples]]
args = ["{3, 4, 5}"]
expect = "12"

[[examples]]
args = ["{}"]
expect = "0"
note = "An empty shelf adds up to nothing."

[[tests]]
args = ["{-5, 5}"]
expect = "0"

[[tests]]
args = ["{1000, 1000, 1000}"]
expect = "3000"

