title = "Is It In Order?"
order = 5
story = "The archivist wants to know if the file numbers on a shelf already run from small to large, so nobody has to reshuffle them."
statement = "Return true when every number is at least as large as the one before it (equal neighbours are fine). Empty and one-item shelves are in order."
signature = "fn is_sorted(nums: vec<int>) -> bool"
constraints = ["0 <= len(nums) <= 100000"]
technique = "Compare neighbours"
big_o = "O(n) time, O(1) space"
types = ["vec", "bool"]
builtins = ["len"]
locked = [{ name = "sorted", why = "Sorting a copy and comparing would hide the idea." }]
hints = [
  "Walk the indices: `for i in range(1, len(nums)) { ... }`.",
  "Compare `nums[i - 1]` with `nums[i]`.",
  "As soon as a pair is out of order you can `return false;`.",
]
reference = '''
fn is_sorted(nums: vec<int>) -> bool {
    for i in range(1, len(nums)) {
        if nums[i - 1] > nums[i] {
            return false;
        }
    }
    return true;
}
'''
[medals]
size = [29, 23, 18]
speed = [57, 31, 22]
[[examples]]
args = ["[1, 2, 2, 9]"]
expect = "true"
[[examples]]
args = ["[1, 3, 2]"]
expect = "false"
[[tests]]
args = ["[]"]
expect = "true"
[[tests]]
args = ["[5]"]
expect = "true"
[[tests]]
args = ["[2, 1]"]
expect = "false"
