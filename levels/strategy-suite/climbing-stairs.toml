title = "Stairs of the Skyscraper"
order = 1
story = "The skyscraper's staircase can be climbed one or two steps at a time. How many different ways are there to reach the top?"
statement = "Return the number of distinct ways to climb n steps taking 1 or 2 steps at a time, modulo 1000000007."
signature = "fn climb(n: int) -> int"
constraints = ["0 <= n <= 100000"]
technique = "Dynamic programming (Fibonacci)"
big_o = "O(n) time, O(1) space"
types = []
builtins = []
hints = [
  "The ways to reach step n are the ways to reach n-1 plus the ways to reach n-2.",
  "A naive recursion repeats the same sub-problems and explodes for n around 40.",
  "Keep just the last two answers in two variables and loop; take `% 1000000007` as you go.",
]
reference = '''
fn climb(n: int) -> int {
    let a = 1;
    let b = 1;
    for i in range(n) {
        let next = (a + b) % 1000000007;
        a = b;
        b = next;
    }
    return a;
}
'''
naive = '''
fn climb(n: int) -> int {
    if n <= 1 {
        return 1;
    }
    return (climb(n - 1) + climb(n - 2)) % 1000000007;
}
'''

