title = "Making Change"
order = 2
story = "The cashier has coins of a few values, as many of each as she likes. What is the fewest coins that make an exact amount?"
statement = "Return the fewest coins (values from coins, each usable any number of times) that add up to amount, or -1 if it cannot be done. amount 0 needs 0 coins."
signature = "fn min_coins(coins: vec<int>, amount: int) -> int"
constraints = ["1 <= len(coins) <= 12", "1 <= coins[i] <= 100", "0 <= amount <= 10000"]
technique = "Dynamic programming over amounts"
big_o = "O(n) time, O(n) space"
types = ["vec"]
builtins = []
hints = [
  "Let best[a] be the fewest coins for amount a. best[0] = 0.",
  "best[a] is 1 + the smallest best[a - c] over coins c that fit.",
  "Fill the table from 1 up to amount; use a big placeholder for 'impossible'.",
]
reference = '''
fn min_coins(coins: vec<int>, amount: int) -> int {
    let best = [amount + 1; amount + 1];
    best[0] = 0;
    for a in range(1, amount + 1) {
        for c in coins {
            if c <= a and best[a - c] + 1 < best[a] {
                best[a] = best[a - c] + 1;
            }
        }
    }
    if best[amount] > amount {
        return -1;
    }
    return best[amount];
}
'''
naive = '''
fn min_coins(coins: vec<int>, amount: int) -> int {
    if amount == 0 {
        return 0;
    }
    let best = -1;
    for c in coins {
        if c <= amount {
            let sub = min_coins(coins, amount - c);
            if sub >= 0 and (best < 0 or sub + 1 < best) {
                best = sub + 1;
            }
        }
    }
    return best;
}
'''

