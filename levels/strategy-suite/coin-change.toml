title = "Making Change"
order = 2
story = "The cashier has coins of a few values, as many of each as she likes. What is the fewest coins that make an exact amount?"
statement = "Return the fewest coins (values from coins, each usable any number of times) that add up to amount, or -1 if it cannot be done. amount 0 needs 0 coins."
prelude = '''
#include <vector>
'''
signature = "int minCoins(const std::vector<int>& coins, int amount)"
constraints = ["1 <= coins.size() <= 12", "1 <= coins[i] <= 100", "0 <= amount <= 10000"]
technique = "Dynamic programming over amounts"
big_o = "O(n) time, O(n) space"
unlocked = ["<algorithm>"]
unlock = { recursion = true }
hints = [
  "Let `best[a]` be the fewest coins for amount a. `best[0] = 0`: a `std::vector<int> best(amount + 1, ...)` gives you the table in one line.",
  "`best[a]` is 1 + the smallest `best[a - c]` over coins c that fit (`c <= a`). Pass `coins` as `const std::vector<int>&` and loop with `for (int c : coins)`: no copy of the coin list is made.",
  "Fill the table from 1 up to amount; use a big placeholder such as `amount + 1` for 'impossible' and return -1 if it is still there at the end.",
]
reference = '''
#include <algorithm>

int minCoins(const std::vector<int>& coins, int amount) {
    std::vector<int> best(amount + 1, amount + 1);
    best[0] = 0;
    for (int a = 1; a <= amount; ++a) {
        for (int c : coins) {
            if (c <= a) {
                best[a] = std::min(best[a], best[a - c] + 1);
            }
        }
    }
    return best[amount] > amount ? -1 : best[amount];
}
'''
naive = '''
int minCoins(const std::vector<int>& coins, int amount) {
    if (amount == 0) {
        return 0;
    }
    int best = -1;
    for (int c : coins) {
        if (c <= amount) {
            const int sub = minCoins(coins, amount - c);
            if (sub >= 0 && (best < 0 || sub + 1 < best)) {
                best = sub + 1;
            }
        }
    }
    return best;
}
'''

