title = "Can It Be Spelled?"
order = 8
story = "A telegram arrives with all the spaces missing. The dictionary clerk wants to know whether it can be cut into dictionary words."
statement = "Return true if s can be split into a sequence of one or more words from the shelf words (a word may be used many times)."
prelude = '''
#include <string>
#include <vector>
'''
signature = "bool wordBreak(const std::string& s, const std::vector<std::string>& words)"
constraints = ["1 <= s.size() <= 300", "1 <= words.size() <= 10", "1 <= words[i].size() <= 10"]
technique = "Dynamic programming over positions"
big_o = "O(n) time, O(n) space"
unlocked = ["<unordered_set>", "<algorithm>"]
unlock = { recursion = true }
hints = [
  "`ok[i]` says whether the first i letters can be split. `ok[0]` is true.",
  "`ok[i]` is true if some j < i has `ok[j]` and `s.substr(j, i - j)` is a word.",
  "Put the words in a `std::unordered_set<std::string>` so a lookup costs one step, and never look at pieces longer than the longest word (`std::max` from `<algorithm>` finds it).",
]
reference = '''
#include <algorithm>
#include <unordered_set>

bool wordBreak(const std::string& s, const std::vector<std::string>& words) {
    const int n = static_cast<int>(s.size());
    std::unordered_set<std::string> dict;
    int longest = 0;
    for (const std::string& w : words) {
        dict.insert(w);
        longest = std::max(longest, static_cast<int>(w.size()));
    }
    std::vector<char> ok(n + 1, 0);
    ok[0] = 1;
    for (int i = 1; i <= n; ++i) {
        for (int j = std::max(0, i - longest); j < i; ++j) {
            if (ok[j] != 0 && dict.count(s.substr(j, i - j)) > 0) {
                ok[i] = 1;
                break;
            }
        }
    }
    return ok[n] != 0;
}
'''
naive = '''
bool wordBreak(const std::string& s, const std::vector<std::string>& words) {
    if (s.empty()) {
        return true;
    }
    for (const std::string& w : words) {
        if (!w.empty() && s.substr(0, w.size()) == w) {
            if (wordBreak(s.substr(w.size()), words)) {
                return true;
            }
        }
    }
    return false;
}
'''

