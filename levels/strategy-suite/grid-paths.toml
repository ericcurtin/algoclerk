title = "Corridors to the Corner"
order = 7
story = "A robot vacuum starts in the top-left room of a grid of rooms and may only move right or down. How many different routes lead to the bottom-right room?"
statement = "Return the number of paths from the top-left to the bottom-right cell of a rows x cols grid moving only right or down, modulo 1000000007."
signature = "fn unique_paths(rows: int, cols: int) -> int"
constraints = ["1 <= rows, cols <= 300"]
technique = "Dynamic programming over a grid"
big_o = "O(n^2) time, O(n) space"
types = ["vec"]
builtins = []
hints = [
  "Every room in the first row or column can be reached in exactly one way.",
  "Any other room is reached from above or from the left: add the two counts.",
  "You only need one row of the table at a time.",
]
reference = '''
fn unique_paths(rows: int, cols: int) -> int {
    let row = [1; cols];
    for r in range(1, rows) {
        for c in range(1, cols) {
            row[c] = (row[c] + row[c - 1]) % 1000000007;
        }
    }
    return row[cols - 1];
}
'''
naive = '''
fn unique_paths(rows: int, cols: int) -> int {
    if rows == 1 or cols == 1 {
        return 1;
    }
    return (unique_paths(rows - 1, cols) + unique_paths(rows, cols - 1)) % 1000000007;
}
'''

