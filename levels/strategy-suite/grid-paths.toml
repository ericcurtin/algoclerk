title = "Corridors to the Corner"
order = 7
story = "A robot vacuum starts in the top-left room of a grid of rooms and may only move right or down. How many different routes lead to the bottom-right room?"
statement = "Return the number of paths from the top-left to the bottom-right cell of a rows x cols grid moving only right or down, modulo 1000000007."
signature = "int uniquePaths(int rows, int cols)"
constraints = ["1 <= rows, cols <= 300"]
technique = "Dynamic programming over a grid"
big_o = "O(n^2) time, O(n) space"
unlocked = ["<vector>"]
unlock = { recursion = true }
hints = [
  "Every room in the first row or column can be reached in exactly one way.",
  "Any other room is reached from above or from the left: add the two counts (take `% 1000000007`; the sum of two residues fits an `int`).",
  "You only need one row of the table at a time: `std::vector<int> row(cols, 1);` and update it in place, left to right.",
]
reference = '''
#include <vector>

int uniquePaths(int rows, int cols) {
    const int mod = 1000000007;
    std::vector<int> row(cols, 1);
    for (int r = 1; r < rows; ++r) {
        for (int c = 1; c < cols; ++c) {
            row[c] = (row[c] + row[c - 1]) % mod;
        }
    }
    return row[cols - 1];
}
'''
naive = '''
int uniquePaths(int rows, int cols) {
    if (rows == 1 || cols == 1) {
        return 1;
    }
    return (uniquePaths(rows - 1, cols) + uniquePaths(rows, cols - 1)) % 1000000007;
}
'''

