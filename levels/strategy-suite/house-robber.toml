title = "The Careful Burglar"
order = 5
story = "A row of houses each hold some cash, but neighbouring houses share an alarm: robbing two adjacent houses calls the police. (Please do not do this. It is an exercise.)"
statement = "Return the maximum total of nums you can pick when no two picked items are next to each other."
prelude = '''
#include <vector>
'''
signature = "int rob(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 20000", "0 <= nums[i] <= 1000"]
technique = "Dynamic programming with two variables"
big_o = "O(n) time, O(1) space"
unlocked = ["<algorithm>"]
unlock = { helpers = true, recursion = true }
hints = [
  "At each house you either take it (plus the best up to two houses ago) or skip it.",
  "So the best up to house i is `std::max(best two ago + nums[i], best one ago)` (`#include <algorithm>`).",
  "Two `int` variables are enough: no table needed. A range-for `for (int x : nums)` walks the houses without copying the vector.",
]
reference = '''
#include <algorithm>

int rob(const std::vector<int>& nums) {
    int take = 0;
    int skip = 0;
    for (int x : nums) {
        const int next = std::max(skip + x, take);
        skip = take;
        take = next;
    }
    return take;
}
'''
naive = '''
#include <algorithm>

int bestFrom(const std::vector<int>& nums, int i) {
    if (i >= static_cast<int>(nums.size())) {
        return 0;
    }
    return std::max(nums[i] + bestFrom(nums, i + 2), bestFrom(nums, i + 1));
}

int rob(const std::vector<int>& nums) {
    return bestFrom(nums, 0);
}
'''

