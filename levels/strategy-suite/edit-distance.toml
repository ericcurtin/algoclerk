title = "Fewest Corrections"
order = 4
story = "The spell-checker wants to know how many single-letter edits (insert, delete, replace) turn a misspelled word into the right one."
statement = "Return the minimum number of insertions, deletions and replacements of one character that turn a into b."
prelude = '''
#include <string>
'''
signature = "int editDistance(const std::string& a, const std::string& b)"
constraints = ["0 <= a.size(), b.size() <= 300"]
technique = "Dynamic programming on a grid"
big_o = "O(n^2) time, O(n^2) space"
unlocked = ["<vector>", "<algorithm>"]
unlock = { recursion = true }
hints = [
  "Let `dp[i][j]` be the edit distance between the first i letters of a and the first j letters of b: a `std::vector<std::vector<int>>` of size (n + 1) x (m + 1).",
  "The first row and column are just i and j: turning a prefix into nothing.",
  "If the letters match, copy `dp[i - 1][j - 1]`; otherwise take 1 + the smallest of the three neighbours (`std::min({x, y, z})` from `<algorithm>` takes three at once).",
]
reference = '''
#include <algorithm>
#include <vector>

int editDistance(const std::string& a, const std::string& b) {
    const int n = static_cast<int>(a.size());
    const int m = static_cast<int>(b.size());
    std::vector<std::vector<int>> dp(n + 1, std::vector<int>(m + 1, 0));
    for (int i = 0; i <= n; ++i) {
        dp[i][0] = i;
    }
    for (int j = 0; j <= m; ++j) {
        dp[0][j] = j;
    }
    for (int i = 1; i <= n; ++i) {
        for (int j = 1; j <= m; ++j) {
            if (a[i - 1] == b[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1];
            } else {
                dp[i][j] = 1 + std::min({dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]});
            }
        }
    }
    return dp[n][m];
}
'''
naive = '''
#include <algorithm>

int editDistance(const std::string& a, const std::string& b) {
    if (a.empty()) {
        return static_cast<int>(b.size());
    }
    if (b.empty()) {
        return static_cast<int>(a.size());
    }
    if (a[0] == b[0]) {
        return editDistance(a.substr(1), b.substr(1));
    }
    return 1 + std::min({editDistance(a.substr(1), b.substr(1)), editDistance(a.substr(1), b),
                         editDistance(a, b.substr(1))});
}
'''

