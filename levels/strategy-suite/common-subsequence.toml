title = "What Two Notes Share"
order = 6
story = "Two clerks wrote down the same dictated message from memory. How long is the longest run of letters, in order but not necessarily adjacent, that appears in both notes?"
statement = "Return the length of the longest common subsequence of a and b."
prelude = '''
#include <string>
'''
signature = "int lcs(const std::string& a, const std::string& b)"
constraints = ["0 <= a.size(), b.size() <= 300"]
technique = "Dynamic programming on a grid"
big_o = "O(n^2) time, O(n^2) space"
unlocked = ["<vector>", "<algorithm>"]
unlock = { recursion = true }
hints = [
  "`dp[i][j]` = longest common subsequence of the first i letters of a and the first j of b. A `std::vector<std::vector<int>> dp(n + 1, std::vector<int>(m + 1, 0))` is the whole table.",
  "If `a[i - 1] == b[j - 1]`, it is `dp[i - 1][j - 1] + 1`.",
  "Otherwise it is the larger of `dp[i - 1][j]` and `dp[i][j - 1]` (`std::max`, from `<algorithm>`). Take the strings as `const std::string&`: a by-value string is copied, and the copy costs its length.",
]
reference = '''
#include <algorithm>
#include <vector>

int lcs(const std::string& a, const std::string& b) {
    const int n = static_cast<int>(a.size());
    const int m = static_cast<int>(b.size());
    std::vector<std::vector<int>> dp(n + 1, std::vector<int>(m + 1, 0));
    for (int i = 1; i <= n; ++i) {
        for (int j = 1; j <= m; ++j) {
            if (a[i - 1] == b[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
                dp[i][j] = std::max(dp[i - 1][j], dp[i][j - 1]);
            }
        }
    }
    return dp[n][m];
}
'''
naive = '''
#include <algorithm>

int lcs(const std::string& a, const std::string& b) {
    if (a.empty() || b.empty()) {
        return 0;
    }
    if (a[0] == b[0]) {
        return 1 + lcs(a.substr(1), b.substr(1));
    }
    return std::max(lcs(a.substr(1), b), lcs(a, b.substr(1)));
}
'''

