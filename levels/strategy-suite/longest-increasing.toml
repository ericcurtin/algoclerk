title = "The Longest Climb"
order = 3
story = "A hiker records altitudes along a trail. What is the longest stretch of points she can choose, in order, so that each is higher than the one before?"
statement = "Return the length of the longest strictly increasing subsequence of nums (not necessarily contiguous)."
signature = "fn lis(nums: vec<int>) -> int"
constraints = ["0 <= len(nums) <= 3000"]
technique = "Patience sorting with binary search"
big_o = "O(n log n) time, O(n) space"
types = ["vec"]
builtins = ["len", "max", "push"]
hints = [
  "The simple table `best[i] = longest climb ending at i` takes O(n squared).",
  "Faster: keep `tails`, where tails[k] is the smallest possible last value of a climb of length k + 1.",
  "For each number, binary-search the first tail that is not smaller; replace it, or append if there is none.",
]
reference = '''
fn lis(nums: vec<int>) -> int {
    let tails: vec<int> = [];
    for x in nums {
        let lo = 0;
        let hi = len(tails);
        while lo < hi {
            let mid = lo + (hi - lo) / 2;
            if tails[mid] < x {
                lo = mid + 1;
            } else {
                hi = mid;
            }
        }
        if lo == len(tails) {
            tails.push(x);
        } else {
            tails[lo] = x;
        }
    }
    return len(tails);
}
'''
naive = '''
fn lis(nums: vec<int>) -> int {
    let n = len(nums);
    let best = [1; n];
    let answer = 0;
    for i in range(n) {
        for j in range(i) {
            if nums[j] < nums[i] and best[j] + 1 > best[i] {
                best[i] = best[j] + 1;
            }
        }
        answer = max(answer, best[i]);
    }
    return answer;
}
'''

