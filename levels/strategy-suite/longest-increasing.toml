title = "The Longest Climb"
order = 3
story = "A hiker records altitudes along a trail. What is the longest stretch of points she can choose, in order, so that each is higher than the one before?"
statement = "Return the length of the longest strictly increasing subsequence of nums (not necessarily contiguous)."
prelude = '''
#include <vector>
'''
signature = "int lis(const std::vector<int>& nums)"
constraints = ["0 <= nums.size() <= 3000"]
technique = "Patience sorting with binary search"
big_o = "O(n log n) time, O(n) space"
unlocked = ["<algorithm>"]
locked = [
  { name = "std::lower_bound", why = "The binary search is the lesson: write the halving loop yourself." },
  { name = "std::upper_bound", why = "The binary search is the lesson: write the halving loop yourself." },
  { name = "std::binary_search", why = "The binary search is the lesson: write the halving loop yourself." },
]
hints = [
  "The simple table `best[i] = longest climb ending at i` takes O(n squared).",
  "Faster: keep a `std::vector<int> tails`, where `tails[k]` is the smallest possible last value of a climb of length k + 1.",
  "For each number, binary-search the first tail that is not smaller (`lo`, `hi`, `mid`); replace it, or `push_back` if there is none. Take `nums` by `const&` so the input is not copied.",
]
reference = '''
int lis(const std::vector<int>& nums) {
    std::vector<int> tails;
    for (int x : nums) {
        int lo = 0;
        int hi = static_cast<int>(tails.size());
        while (lo < hi) {
            const int mid = lo + (hi - lo) / 2;
            if (tails[mid] < x) {
                lo = mid + 1;
            } else {
                hi = mid;
            }
        }
        if (lo == static_cast<int>(tails.size())) {
            tails.push_back(x);
        } else {
            tails[lo] = x;
        }
    }
    return static_cast<int>(tails.size());
}
'''
naive = '''
#include <algorithm>

int lis(const std::vector<int>& nums) {
    const int n = static_cast<int>(nums.size());
    std::vector<int> best(n, 1);
    int answer = 0;
    for (int i = 0; i < n; ++i) {
        for (int j = 0; j < i; ++j) {
            if (nums[j] < nums[i]) {
                best[i] = std::max(best[i], best[j] + 1);
            }
        }
        answer = std::max(answer, best[i]);
    }
    return answer;
}
'''

