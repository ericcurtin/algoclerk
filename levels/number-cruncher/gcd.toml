id = "gcd"
title = "Common Ground"
order = 4
summary = "Find the greatest common divisor of two numbers."
story = "Two gear wheels with a and b teeth are to be replaced by the smallest equivalent pair. The engineers need the biggest number that divides both tooth counts."
statement = "The inbox holds two positive numbers a and b. Output their greatest common divisor."
constraints = ["1 <= a, b <= 60."]
hints = [
  "gcd(a, b) = gcd(b, a mod b), and gcd(a, 0) = a.",
  "Keep a and b on tiles. In each round replace them by b and a mod b.",
  "Stop when b is zero; the answer is a.",
]

[[examples]]
input = [12, 18]
output = [6]

[machine]
floor = 3
names = ["first", "second", "remainder"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]

[tests]
seed = 304
[[tests.fixed]]
input = [7, 7]
output = [7]
[[tests.fixed]]
input = [1, 60]
output = [1]
[[tests.fixed]]
input = [60, 1]
output = [1]
[[tests.fixed]]
input = [35, 64]
output = [1]
[[tests.fixed]]
input = [48, 36]
output = [12]
[[tests.generators]]
count = 8
inbox = [
  { kind = "int", range = [1, 60] },
  { kind = "int", range = [1, 60] },
]

[targets]
size_par = 18
size_ace = 15
speed_par = 54
speed_ace = 36

[solution]
asm = """
    INBOX
    COPYTO 0
    INBOX
    COPYTO 1
loop:
    JUMPZ done
    COPYFROM 0
    MOD 1
    COPYTO 2
    COPYFROM 1
    COPYTO 0
    COPYFROM 2
    COPYTO 1
    JUMP loop
done:
    COPYFROM 0
    OUTBOX
"""

[code]
function = "gcd"
doc = "Returns the greatest common divisor of a and b."
params = [{ name = "a", kind = "scalar" }, { name = "b", kind = "scalar" }]
returns = "scalar"

[explain]
algorithm = "Euclid's algorithm"
text = "Replacing the larger number by its remainder shrinks the problem very quickly; the number of rounds grows only with the logarithm of the inputs. It is one of the oldest algorithms still in everyday use."
