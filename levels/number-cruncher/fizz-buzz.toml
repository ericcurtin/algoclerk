id = "fizz-buzz"
title = "Buzzword Bingo"
order = 6
summary = "Count from 1 to n, replacing multiples of 3 and 5 by codes."
story = "At the weekly meeting every employee in a circle says the next number, except that multiples of 3 say 'Synergy', multiples of 5 say 'Pivot' and multiples of both say 'Synergy Pivot'. The envelopes carry codes instead of words."
statement = "The inbox holds a single number n. For each i from 1 to n output: -3 if i is divisible by both 3 and 5, -1 if only by 3, -2 if only by 5, and i itself otherwise."
constraints = ["1 <= n <= 20.", "Tiles 2 to 6 hold 3, 5, -1, -2 and -3. Tile 1 holds 0."]
hints = [
  "Count i upwards with BUMPUP and stop when i is larger than n.",
  "MOD gives a remainder; JUMPZ detects divisibility.",
  "Test for 3 first. If it divides, test for 5 as well to catch multiples of 15.",
]

[[examples]]
input = [5]
output = [1, 2, -1, 4, -2]

[machine]
floor = 7
names = ["limit", "i", "three", "five", "fizz", "buzz", "fizzbuzz"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]
[machine.prefill]
1 = 0
2 = 3
3 = 5
4 = -1
5 = -2
6 = -3

[tests]
seed = 306
[[tests.fixed]]
input = [1]
output = [1]
[[tests.fixed]]
input = [15]
output = [1, 2, -1, 4, -2, -1, 7, 8, -1, -2, 11, -1, 13, 14, -3]
[[tests.fixed]]
input = [20]
output = [1, 2, -1, 4, -2, -1, 7, 8, -1, -2, 11, -1, 13, 14, -3, 16, 17, -1, 19, -2]
[[tests.generators]]
count = 5
inbox = [{ kind = "int", range = [1, 20] }]

[targets]
size_par = 30
size_ace = 24
speed_par = 212
speed_ace = 141

[solution]
asm = """
    INBOX
    COPYTO 0
loop:
    BUMPUP 1
    COPYFROM 0
    SUB 1
    JUMPN done
    COPYFROM 1
    MOD 2
    JUMPZ by3
    COPYFROM 1
    MOD 3
    JUMPZ by5
    COPYFROM 1
    JUMP out
by3:
    COPYFROM 1
    MOD 3
    JUMPZ by15
    COPYFROM 4
    JUMP out
by5:
    COPYFROM 5
    JUMP out
by15:
    COPYFROM 6
out:
    OUTBOX
    JUMP loop
done:
"""

[code]
function = "fizz_buzz_codes"
doc = "Returns 1..n with -1 for multiples of 3, -2 for multiples of 5 and -3 for both."
params = [{ name = "n", kind = "scalar" }]
returns = "list"

[explain]
algorithm = "Divisibility tests"
text = "The classic FizzBuzz exercise: the combined case must be tested first or together with its parts, otherwise the multiples of 15 are caught by the wrong branch."
