id = "digit-sum"
title = "Digit Dissection"
order = 7
summary = "Add up the decimal digits of a number."
story = "Check digits protect every parcel label. Yours is to slice the number into digits with division and add them up."
statement = "The inbox holds a single number n. Output the sum of the decimal digits of n."
constraints = ["0 <= n <= 9999.", "Tile 1 holds 0 and tile 2 holds 10 at the start."]
hints = [
  "n mod 10 is the last digit. n div 10 removes it.",
  "Repeat until the number becomes zero.",
]

[[examples]]
input = [4096]
output = [19]

[machine]
floor = 3
names = ["n", "sum", "ten"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]
[machine.prefill]
1 = 0
2 = 10

[tests]
seed = 307
[[tests.fixed]]
input = [0]
output = [0]
[[tests.fixed]]
input = [9]
output = [9]
[[tests.fixed]]
input = [9999]
output = [36]
[[tests.fixed]]
input = [1000]
output = [1]
[[tests.generators]]
count = 8
inbox = [{ kind = "int", range = [0, 9999] }]

[targets]
size_par = 13
size_ace = 11
speed_par = 48
speed_ace = 32

[solution]
asm = """
    INBOX
loop:
    JUMPZ done
    COPYTO 0
    MOD 2
    ADD 1
    COPYTO 1
    COPYFROM 0
    DIV 2
    JUMP loop
done:
    COPYFROM 1
    OUTBOX
"""

[code]
function = "digit_sum"
doc = "Returns the sum of the decimal digits of n."
params = [{ name = "n", kind = "scalar" }]
returns = "scalar"

[explain]
algorithm = "Digit extraction with div and mod"
text = "Taking the remainder by the base peels off the last digit and integer division drops it. The same loop converts a number into any base."
