id = "factorial"
title = "Pile It Up"
order = 1
summary = "Compute n factorial."
story = "The new calculating machine in the corner can multiply. The warehouse wants to know in how many different orders n crates can be stacked."
statement = "The inbox holds a single number n. Output n! = 1 * 2 * ... * n, where 0! = 1."
constraints = ["0 <= n <= 9.", "Tile 1 holds 1 at the start."]
hints = [
  "MUL n multiplies the value in your hand by the value on tile n.",
  "Keep the result on a tile that starts at 1. Multiply it by n, then n-1, and so on down to 1.",
  "BUMPDN leaves the lowered counter in your hand, where JUMPZ can test it for zero.",
]

[[examples]]
input = [5]
output = [120]

[machine]
floor = 2
names = ["n", "product"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]
[machine.prefill]
1 = 1

[tests]
seed = 301
[[tests.fixed]]
input = [0]
output = [1]
[[tests.fixed]]
input = [1]
output = [1]
[[tests.fixed]]
input = [9]
output = [362880]
[[tests.generators]]
count = 6
inbox = [{ kind = "int", range = [0, 9] }]

[targets]
size_par = 12
size_ace = 10
speed_par = 48
speed_ace = 32

[solution]
asm = """
    INBOX
    COPYTO 0
loop:
    JUMPZ done
    COPYFROM 1
    MUL 0
    COPYTO 1
    BUMPDN 0
    JUMP loop
done:
    COPYFROM 1
    OUTBOX
"""

[code]
function = "factorial"
doc = "Returns n!."
params = [{ name = "n", kind = "scalar" }]
returns = "scalar"

[explain]
algorithm = "Iterative product"
text = "A running product multiplied by a shrinking counter. Iteration avoids the call-stack depth of the recursive definition and runs in linear time."
