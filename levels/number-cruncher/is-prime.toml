id = "is-prime"
title = "Indivisible"
order = 5
summary = "Decide whether a number is prime."
story = "The vault only opens to codes that cannot be split into smaller factors. The guard wants a quick yes or no for every code."
statement = "The inbox holds a single number n. Output 1 if n is prime and 0 otherwise."
constraints = ["2 <= n <= 60.", "Tile 1 holds 1 and tile 2 holds 1 at the start."]
hints = [
  "Try divisors d = 2, 3, 4, ... and test n mod d.",
  "You only need divisors up to the square root of n: stop when d * d is larger than n.",
  "When d * d equals n exactly, n is composite and you are already holding 0, which is the answer.",
]

[[examples]]
input = [13]
output = [1]

[[examples]]
input = [15]
output = [0]

[machine]
floor = 3
names = ["number", "divisor", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]
[machine.prefill]
1 = 1
2 = 1

[tests]
seed = 305
[[tests.fixed]]
input = [2]
output = [1]
[[tests.fixed]]
input = [3]
output = [1]
[[tests.fixed]]
input = [4]
output = [0]
[[tests.fixed]]
input = [49]
output = [0]
[[tests.fixed]]
input = [59]
output = [1]
[[tests.fixed]]
input = [60]
output = [0]
[[tests.generators]]
count = 8
inbox = [{ kind = "int", range = [2, 60] }]

[targets]
size_par = 20
size_ace = 16
speed_par = 47
speed_ace = 31

[solution]
asm = """
    INBOX
    COPYTO 0
    BUMPUP 1
loop:
    COPYFROM 1
    MUL 1
    SUB 0
    JUMPZ out
    JUMPN test
    COPYFROM 2
    JUMP out
test:
    COPYFROM 0
    MOD 1
    JUMPZ out
    BUMPUP 1
    JUMP loop
out:
    OUTBOX
"""

[code]
function = "is_prime"
doc = "Returns true if n is prime."
params = [{ name = "n", kind = "scalar" }]
returns = "scalar"
return_type = "bool"

[explain]
algorithm = "Trial division up to sqrt(n)"
text = "A composite number always has a factor no larger than its square root, so testing divisors up to that point is enough. Sieves are faster when many numbers must be checked."
