id = "power"
title = "Raise the Roof"
order = 2
summary = "Compute base to the power of exponent."
story = "The architects want to know how many rooms a building has if every floor has b times as many rooms as the floor above, over e floors."
statement = "The inbox holds a base b followed by an exponent e. Output b raised to the power e. Any base to the power 0 is 1, including 0."
constraints = ["-4 <= b <= 5 and 0 <= e <= 8.", "Tile 2 holds 1 at the start."]
hints = [
  "Multiply a running result by the base, e times.",
  "BUMPDN on the exponent tile counts the multiplications down; JUMPZ stops at zero.",
  "A faster idea, squaring, is possible but not required for the staple.",
]

[[examples]]
input = [2, 5]
output = [32]

[machine]
floor = 3
names = ["base", "exponent", "result"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "sub", "mul", "div", "mod", "bumpup", "bumpdn", "jump", "jumpz", "jumpn"]
[machine.prefill]
2 = 1

[tests]
seed = 302
[[tests.fixed]]
input = [0, 0]
output = [1]
[[tests.fixed]]
input = [-4, 3]
output = [-64]
[[tests.fixed]]
input = [5, 8]
output = [390625]
[[tests.fixed]]
input = [3, 0]
output = [1]
[[tests.generators]]
count = 8
inbox = [
  { kind = "int", range = [-4, 5] },
  { kind = "int", range = [0, 8] },
]

[targets]
size_par = 15
size_ace = 12
speed_par = 47
speed_ace = 31

[solution]
asm = """
    INBOX
    COPYTO 0
    INBOX
    COPYTO 1
loop:
    JUMPZ done
    COPYFROM 2
    MUL 0
    COPYTO 2
    BUMPDN 1
    JUMP loop
done:
    COPYFROM 2
    OUTBOX
"""

[code]
function = "power"
doc = "Returns base raised to the power exponent."
params = [{ name = "base", kind = "scalar" }, { name = "exponent", kind = "scalar" }]
returns = "scalar"

[explain]
algorithm = "Repeated multiplication"
text = "Exponentiation as e repeated multiplications takes O(e) steps. Squaring the base and halving the exponent brings that down to O(log e)."
