title = "Mirror, Ignoring the Fuss"
order = 3
story = "The mail room labels have commas, spaces and mixed case. The painter says only the letters and digits count, and capitals equal small letters."
statement = "Return true if the letters and digits of s, ignoring case and everything else, read the same backwards."
prelude = '''
#include <string>
'''
signature = "bool isCleanPalindrome(const std::string& s)"
constraints = ["0 <= s.size() <= 20000", "plain ASCII text"]
technique = "Two pointers with filtering"
big_o = "O(n) time, O(1) space"
unlocked = ["<cctype>"]
hints = [
  "Same two-pointer walk as before, but skip anything that is not a letter or digit.",
  "`std::isalnum(c)` (from `<cctype>`) tells you whether a character counts; `std::tolower` removes case. The labels are plain ASCII.",
  "Move `i` forward while `s[i]` does not count, and `j` backward likewise, then compare. Keep `i` and `j` as `int`, so that `j` can go below 0 safely, and read the string through `const std::string&`: no copy is needed.",
]
reference = '''
#include <cctype>

bool isCleanPalindrome(const std::string& s) {
    int i = 0;
    int j = static_cast<int>(s.size()) - 1;
    while (i < j) {
        if (!std::isalnum(s[i])) {
            ++i;
        } else if (!std::isalnum(s[j])) {
            --j;
        } else {
            if (std::tolower(s[i]) != std::tolower(s[j])) {
                return false;
            }
            ++i;
            --j;
        }
    }
    return true;
}
'''

