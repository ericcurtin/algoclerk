title = "Mirror, Ignoring the Fuss"
order = 3
story = "The mail room labels have commas, spaces and mixed case. The painter says only the letters and digits count, and capitals equal small letters."
statement = "Return true if the letters and digits of s, ignoring case and everything else, read the same backwards."
signature = "fn is_clean_palindrome(s: string) -> bool"
constraints = ["0 <= len(s) <= 20000"]
technique = "Two pointers with filtering"
big_o = "O(n) time, O(1) space"
types = ["char", "string"]
builtins = ["is_alnum", "len", "lower"]
hints = [
  "Same two-pointer walk as before, but skip anything that is not a letter or digit.",
  "`c.is_alnum()` tells you whether a character counts; `c.lower()` removes case.",
  "Move `i` forward while `s[i]` does not count, and `j` backward likewise, then compare.",
]
reference = '''
fn is_clean_palindrome(s: string) -> bool {
    let i = 0;
    let j = len(s) - 1;
    while i < j {
        if !s[i].is_alnum() {
            i += 1;
        } else if !s[j].is_alnum() {
            j -= 1;
        } else {
            if s[i].lower() != s[j].lower() {
                return false;
            }
            i += 1;
            j -= 1;
        }
    }
    return true;
}
'''

[budgets]
large_steps = 2000000

[medals]
size = [79, 62, 49]
speed = [207, 111, 77]

[[examples]]
args = ["\"A man, a plan, a canal: Panama\""]
expect = "true"

[[examples]]
args = ["\"race a car\""]
expect = "false"

[[examples]]
args = ["\".,\""]
expect = "true"
note = "Nothing but punctuation reads the same both ways."

[[tests]]
