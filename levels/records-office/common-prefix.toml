title = "Shared Beginnings"
order = 6
story = "Filing codes in one drawer all start the same way. The clerk wants the longest start they share, so she can print it on the drawer label."
statement = "Return the longest string that every word in words starts with. Return \"\" for an empty shelf or when nothing is shared."
prelude = '''
#include <string>
#include <vector>
'''
signature = "std::string commonPrefix(const std::vector<std::string>& words)"
constraints = ["0 <= words.size() <= 1000", "0 <= words[i].size() <= 100"]
technique = "Vertical scan / shrinking prefix"
big_o = "O(n) time, O(1) space"
hints = [
  "Start with the first word as the candidate prefix (an empty shelf has no words: return \"\" first).",
  "For each other word, find how many leading letters agree with the candidate. Compare `std::size_t` indices with `prefix.size()` and `w.size()`, so no signed/unsigned warnings appear.",
  "`prefix.resize(i);` cuts the candidate down to its first i letters. Loop with `const auto& w` so no word is copied.",
]
reference = '''
std::string commonPrefix(const std::vector<std::string>& words) {
    if (words.empty()) {
        return "";
    }
    std::string prefix = words[0];
    for (const auto& w : words) {
        std::size_t i = 0;
        while (i < prefix.size() && i < w.size() && prefix[i] == w[i]) {
            ++i;
        }
        prefix.resize(i);
    }
    return prefix;
}
'''

[budgets]
large_steps = 1500000

[medals]
size = [76, 59, 47]
speed = [323, 173, 120]

[[examples]]
args = ["{\"flower\", \"flow\", \"flight\"}"]
expect = "\"fl\""

[[examples]]
args = ["{\"dog\", \"car\"}"]
expect = "\"\""

[[examples]]
args = ["{}"]
expect = "\"\""

[[tests]]
