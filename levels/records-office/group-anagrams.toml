title = "Family Folders"
order = 8
story = "Files whose names are rearrangements of each other belong in one folder. The records clerk needs the folders, not the order they come out in."
statement = "Group the words so that words that are anagrams of each other share a group. Return the groups in any order; words inside a group may also be in any order."
prelude = '''
#include <string>
#include <vector>
'''
signature = "std::vector<std::vector<std::string>> groupAnagrams(const std::vector<std::string>& words)"
constraints = ["0 <= words.size() <= 5000", "0 <= words[i].size() <= 20"]
technique = "Hash map keyed by sorted letters"
big_o = "O(n) time, O(n) space"
unlocked = ["<algorithm>", "<unordered_map>", "<map>"]
compare = "sort_all"
hints = [
  "Two words are anagrams exactly when their sorted letters are equal.",
  "Copy the word, sort the copy with `std::sort(key.begin(), key.end());` (from `<algorithm>`) and use the copy as the key of a `std::unordered_map<std::string, std::vector<std::string>>`.",
  "`groups[key].push_back(w);` collects the words per key. Finally walk the map with `for (const auto& entry : groups)` and push `entry.second` into the result.",
]
reference = '''
#include <algorithm>
#include <unordered_map>

std::vector<std::vector<std::string>> groupAnagrams(const std::vector<std::string>& words) {
    std::unordered_map<std::string, std::vector<std::string>> groups;
    for (const auto& w : words) {
        std::string key = w;
        std::sort(key.begin(), key.end());
        groups[key].push_back(w);
    }
    std::vector<std::vector<std::string>> result;
    for (const auto& entry : groups) {
        result.push_back(entry.second);
    }
    return result;
}
'''
naive = '''
#include <algorithm>

std::vector<std::vector<std::string>> groupAnagrams(const std::vector<std::string>& words) {
    std::vector<std::string> keys;
    std::vector<std::vector<std::string>> groups;
    for (const auto& w : words) {
        std::string key = w;
        std::sort(key.begin(), key.end());
        int found = -1;
        for (int i = 0; i < static_cast<int>(keys.size()); ++i) {
            if (keys[i] == key) {
                found = i;
                break;
            }
        }
        if (found < 0) {
            keys.push_back(key);
            groups.push_back({w});
        } else {
            groups[found].push_back(w);
        }
    }
    return groups;
}
'''

