title = "Family Folders"
order = 8
story = "Files whose names are rearrangements of each other belong in one folder. The records clerk needs the folders, not the order they come out in."
statement = "Group the words so that words that are anagrams of each other share a group. Return the groups in any order; words inside a group may also be in any order."
signature = "fn group_anagrams(words: vec<string>) -> vec<vec<string>>"
constraints = ["0 <= len(words) <= 5000", "0 <= len(words[i]) <= 20"]
technique = "Hash map keyed by sorted letters"
big_o = "O(n) time, O(n) space"
compare = "sort_all"
types = ["map", "string", "vec"]
builtins = ["contains", "len", "push", "sorted", "values"]
hints = [
  "Two words are anagrams exactly when their sorted letters are equal.",
  "`sorted(w)` gives the letters of a word in order: use that as the map key.",
  "A `map<string, vec<string>>` collects the words per key; `groups.values()` returns the groups.",
]
reference = '''
fn group_anagrams(words: vec<string>) -> vec<vec<string>> {
    let groups = map<string, vec<string>>();
    for w in words {
        let key = sorted(w);
        if !groups.contains(key) {
            groups[key] = [];
        }
        groups[key].push(w);
    }
    return groups.values();
}
'''
naive = '''
fn group_anagrams(words: vec<string>) -> vec<vec<string>> {
    let keys: vec<string> = [];
    let groups: vec<vec<string>> = [];
    for w in words {
        let key = sorted(w);
        let found = -1;
        for i in range(len(keys)) {
            if keys[i] == key {
                found = i;
                break;
            }
        }
        if found < 0 {
            keys.push(key);
            groups.push([w]);
        } else {
            groups[found].push(w);
        }
    }
    return groups;
}
'''

