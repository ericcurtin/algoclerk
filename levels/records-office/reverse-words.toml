title = "Reverse the Memo"
order = 4
story = "The boss dictates memos from the last word to the first when he is in a mood. The typist needs the words in reverse order, each word spelled normally."
statement = "The words of s are separated by single spaces. Return the same words in reverse order, separated by single spaces."
prelude = '''
#include <string>
#include <vector>
'''
signature = "std::string reverseWords(const std::string& s)"
constraints = ["0 <= s.size() <= 20000", "words are separated by exactly one space; no leading or trailing space"]
technique = "Split and join"
big_o = "O(n) time, O(n) space"
hints = [
  "First split s into a `std::vector<std::string>` of words: walk the characters, append letters to a `current` word and, at every ' ', push the word and `clear()` it. Do not forget the last word.",
  "Walk the vector from the last index to the first. With an unsigned index count down like this: `for (std::size_t i = words.size(); i > 0; --i) { words[i - 1]; }`.",
  "Append a ' ' before every word except the first one, and use `out += word;` (in place) rather than `out = out + word;` (a fresh copy each time).",
]
reference = '''
std::string reverseWords(const std::string& s) {
    std::vector<std::string> words;
    std::string current;
    for (char c : s) {
        if (c == ' ') {
            words.push_back(current);
            current.clear();
        } else {
            current += c;
        }
    }
    words.push_back(current);
    std::string out;
    for (std::size_t i = words.size(); i > 0; --i) {
        if (i != words.size()) {
            out += ' ';
        }
        out += words[i - 1];
    }
    return out;
}
'''
naive = '''
std::string reverseWords(const std::string& s) {
    std::vector<std::string> words;
    std::string current;
    for (char c : s) {
        if (c == ' ') {
            words.push_back(current);
            current.clear();
        } else {
            current += c;
        }
    }
    words.push_back(current);
    std::string out;
    bool first = true;
    for (const auto& w : words) {
        if (first) {
            out = w;
            first = false;
        } else {
            out = w + " " + out;
        }
    }
    return out;
}
'''

