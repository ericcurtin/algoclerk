title = "Mirror Mirror"
order = 2
story = "The office sign painter loves symmetric names on doors. Check whether a name reads the same backwards before he buys the paint."
statement = "Return true if s reads the same forwards and backwards (case and punctuation count). The empty string is a palindrome."
prelude = '''
#include <string>
'''
signature = "bool isPalindrome(const std::string& s)"
constraints = ["0 <= s.size() <= 20000"]
technique = "Two pointers"
big_o = "O(n) time, O(1) space"
hints = [
  "Compare the first letter with the last, the second with the second to last...",
  "Keep two indices: `int i = 0` and `int j = static_cast<int>(s.size()) - 1`, and move them towards each other. `s.size()` is unsigned, so subtracting from an empty string would wrap around: cast first.",
  "Stop with `false` at the first mismatch; when they cross, return `true`. Taking `s` by `const&` costs 1, a by-value copy would cost the whole length.",
]
reference = '''
bool isPalindrome(const std::string& s) {
    int i = 0;
    int j = static_cast<int>(s.size()) - 1;
    while (i < j) {
        if (s[i] != s[j]) {
            return false;
        }
        ++i;
        --j;
    }
    return true;
}
'''
naive = '''
bool isPalindrome(const std::string& s) {
    std::string rest = s;
    while (rest.size() > 1) {
        if (rest.front() != rest.back()) {
            return false;
        }
        rest = rest.substr(1, rest.size() - 2);
    }
    return true;
}
'''

