title = "Anagram Check"
order = 1
story = "The records clerk swears two files with the same letters in a different order are the same family. Prove it before she stamps them as duplicates."
statement = "Return true when b is a rearrangement of the letters of a: same letters, same number of each. Case matters."
prelude = '''
#include <string>
'''
signature = "bool isAnagram(const std::string& a, const std::string& b)"
constraints = ["0 <= a.size(), b.size() <= 20000", "plain ASCII text"]
technique = "Hash map counting"
big_o = "O(n) time, O(k) space"
unlocked = ["<unordered_map>"]
hints = [
  "Two words are anagrams when every letter occurs equally often in both.",
  "Count the letters of a in a `std::unordered_map<char, int>`: `++counts[c];` (a missing key starts at 0).",
  "Walk b and count down; if a letter has no count left (`counts.find(c)` is `end()` or its value is 0), return false. Take both strings by `const&`: copying them would cost their lengths.",
]
reference = '''
#include <unordered_map>

bool isAnagram(const std::string& a, const std::string& b) {
    if (a.size() != b.size()) {
        return false;
    }
    std::unordered_map<char, int> counts;
    for (char c : a) {
        ++counts[c];
    }
    for (char c : b) {
        auto it = counts.find(c);
        if (it == counts.end() || it->second == 0) {
            return false;
        }
        --it->second;
    }
    return true;
}
'''
naive = '''
bool isAnagram(const std::string& a, const std::string& b) {
    if (a.size() != b.size()) {
        return false;
    }
    std::string rest = b;
    for (char c : a) {
        const std::size_t pos = rest.find(c);
        if (pos == std::string::npos) {
            return false;
        }
        rest.erase(pos, 1);
    }
    return true;
}
'''

[budgets]
large_steps = 2000000

[medals]
size = [77, 60, 48]
speed = [201, 108, 75]

[[examples]]
args = ["\"listen\"", "\"silent\""]
expect = "true"

