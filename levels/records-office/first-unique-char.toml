title = "The Lonely Letter"
order = 5
story = "One letter in every title is printed only once and the archivist wants to know which, so she can start filing from it."
statement = "Return the index of the first character of s that occurs exactly once in s, or -1 if there is none."
prelude = '''
#include <string>
'''
signature = "int firstUnique(const std::string& s)"
constraints = ["0 <= s.size() <= 20000"]
technique = "Hash map counting"
big_o = "O(n) time, O(k) space"
unlocked = ["<unordered_map>", "<algorithm>"]
hints = [
  "Counting how often each letter appears needs one pass.",
  "A `std::unordered_map<char, int>` (from `<unordered_map>`) keeps the counts: `++counts[c];` starts a missing letter at 0 for you.",
  "A second pass finds the first position whose letter has count 1. Loop with `int i` up to `static_cast<int>(s.size())` to avoid signed/unsigned warnings.",
]
reference = '''
#include <unordered_map>

int firstUnique(const std::string& s) {
    std::unordered_map<char, int> counts;
    for (char c : s) {
        ++counts[c];
    }
    for (int i = 0; i < static_cast<int>(s.size()); ++i) {
        if (counts[s[i]] == 1) {
            return i;
        }
    }
    return -1;
}
'''
naive = '''
#include <algorithm>

int firstUnique(const std::string& s) {
    for (int i = 0; i < static_cast<int>(s.size()); ++i) {
        if (std::count(s.begin(), s.end(), s[i]) == 1) {
            return i;
        }
    }
    return -1;
}
'''

