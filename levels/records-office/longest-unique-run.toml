title = "The Longest Clean Stretch"
order = 7
story = "A ticker tape prints letters all day. The supervisor wants the longest stretch of tape where no letter appears twice, to test a new typewriter."
statement = "Return the length of the longest substring of s in which all characters are different."
signature = "fn longest_unique(s: string) -> int"
constraints = ["0 <= len(s) <= 20000"]
technique = "Sliding window"
big_o = "O(n) time, O(k) space"
types = ["char", "map", "set", "string"]
builtins = ["add", "contains", "len", "max"]
hints = [
  "Keep a window [start, i] of unique letters and slide it right.",
  "Remember the last index where each letter was seen in a map.",
  "When the current letter was last seen inside the window, move `start` just past that spot.",
]
reference = '''
fn longest_unique(s: string) -> int {
    let last = map<char, int>();
    let best = 0;
    let start = 0;
    for i in range(len(s)) {
        let c = s[i];
        if last.contains(c) and last[c] >= start {
            start = last[c] + 1;
        }
        last[c] = i;
        best = max(best, i - start + 1);
    }
    return best;
}
'''
naive = '''
fn longest_unique(s: string) -> int {
    let best = 0;
    for i in range(len(s)) {
        let seen = set<char>();
        let j = i;
        while j < len(s) and !seen.contains(s[j]) {
            seen.add(s[j]);
            j += 1;
        }
        best = max(best, j - i);
    }
    return best;
}
'''

