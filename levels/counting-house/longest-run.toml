id = "longest-run"
title = "Streak Counter"
order = 6
summary = "Find the longest streak of equal neighbours."
story = "The quality inspector wants to know the longest streak of identical envelopes that came down the belt in a row."
statement = "The inbox holds a list of at least one number, followed by a 0 marker. Output the length of the longest run of equal numbers that sit next to each other."
constraints = ["The list has between 1 and 10 numbers.", "Every number is 1, 2 or 3.", "Tile 4 holds 1 at the start."]
hints = [
  "Remember the previous number and the length of the current streak.",
  "If the new number equals the previous one the streak grows; otherwise it restarts at 1.",
  "Keep a second tile with the best streak so far and update it whenever the current streak is at least as long.",
]

[[examples]]
input = [1, 1, 2, 2, 2, 1, 0]
output = [3]

[machine]
floor = 5
names = ["previous", "streak", "best", "candidate", "one"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "bumpup", "jump", "jumpz", "jumpn"]
[machine.prefill]
4 = 1

[tests]
seed = 206
[[tests.fixed]]
input = [2, 0]
output = [1]
[[tests.fixed]]
input = [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 0]
output = [10]
[[tests.fixed]]
input = [1, 2, 1, 2, 1, 2, 0]
output = [1]
[[tests.fixed]]
input = [1, 1, 2, 3, 3, 0]
output = [2]
[[tests.generators]]
count = 10
inbox = [{ kind = "list", len = [1, 10], range = [1, 3], terminator = 0 }]

[targets]
size_par = 28
size_ace = 23
speed_par = 90
speed_ace = 60

[solution]
asm = """
    INBOX
    COPYTO 0
    COPYFROM 4
    COPYTO 1
    COPYTO 2
again:
    INBOX
    JUMPZ done
    COPYTO 3
    SUB 0
    JUMPZ same
    COPYFROM 3
    COPYTO 0
    COPYFROM 4
    COPYTO 1
    JUMP again
same:
    BUMPUP 1
    SUB 2
    JUMPN again
    COPYFROM 1
    COPYTO 2
    JUMP again
done:
    COPYFROM 2
    OUTBOX
"""

[code]
function = "longest_run"
doc = "Returns the length of the longest run of equal neighbours (the list is never empty)."
params = [{ name = "values", kind = "terminated" }]
returns = "scalar"

[explain]
algorithm = "Run-length scan"
text = "One pass tracks the current run and the best run so far. This is the same state machine used for run-length encoding and for longest-streak questions."
