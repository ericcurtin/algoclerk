id = "min-and-max"
title = "Range Finder"
order = 4
summary = "Output the smallest, then the largest number of a list."
story = "The auditors want to know how far apart the smallest and largest figures were. They will do the subtraction themselves; you just report both ends."
statement = "The inbox holds a list of at least one non-zero number, followed by a 0 marker. Output the smallest number, then the largest."
constraints = ["The list has between 1 and 8 numbers.", "Every number is between -9 and 9 and is not 0."]
hints = [
  "Track two tiles, one for the smallest and one for the largest, both starting from the first number.",
  "Compare each new number with the smallest first. If it is not smaller, compare it with the largest.",
  "A number that is a new minimum can never be a new maximum, so you can skip the second test.",
]

[[examples]]
input = [3, -2, 7, 5, 0]
output = [-2, 7]

[machine]
floor = 3
names = ["smallest", "largest", "candidate"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "jump", "jumpz", "jumpn"]

[tests]
seed = 204
[[tests.fixed]]
input = [4, 0]
output = [4, 4]
[[tests.fixed]]
input = [-9, 9, 0]
output = [-9, 9]
[[tests.fixed]]
input = [5, 5, 5, 0]
output = [5, 5]
[[tests.fixed]]
input = [9, 8, 7, 6, 5, 4, 3, 2, 0]
output = [2, 9]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [1, 8], range = [-9, 9], nonzero = true, terminator = 0 }]

[targets]
size_par = 26
size_ace = 21
speed_par = 71
speed_ace = 47

[solution]
asm = """
    INBOX
    COPYTO 0
    COPYTO 1
again:
    INBOX
    JUMPZ done
    COPYTO 2
    SUB 0
    JUMPN newmin
    COPYFROM 2
    SUB 1
    JUMPN again
    COPYFROM 2
    COPYTO 1
    JUMP again
newmin:
    COPYFROM 2
    COPYTO 0
    JUMP again
done:
    COPYFROM 0
    OUTBOX
    COPYFROM 1
    OUTBOX
"""

[code]
function = "min_and_max"
doc = "Returns the smallest value followed by the largest."
params = [{ name = "values", kind = "terminated" }]
returns = "list"

[explain]
algorithm = "Single pass min/max"
text = "Tracking both extremes in one pass needs only two variables. Skipping the maximum test for new minimums is the same trick that tournament-style min/max algorithms use to save comparisons."
