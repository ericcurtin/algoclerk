id = "max-of"
title = "Top of the Pile"
order = 3
summary = "Find the largest number in a list."
story = "The Counting House gives a bonus to whoever submitted the largest figure. You have to find it before the afternoon tea trolley arrives."
statement = "The inbox holds a list of at least one non-zero number, followed by a 0 marker. Output the largest number in the list."
constraints = ["The list has between 1 and 8 numbers.", "Every number is between -9 and 9 and is not 0."]
hints = [
  "Keep the best value seen so far on a tile. The first number starts as the best.",
  "SUB the best from the new number: JUMPN tells you if the new one is smaller.",
  "Only replace the best when the new number is not smaller.",
]

[[examples]]
input = [3, -2, 7, 5, 0]
output = [7]

[machine]
floor = 2
names = ["best", "candidate"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "sub", "jump", "jumpz", "jumpn"]

[tests]
seed = 203
[[tests.fixed]]
input = [-5, 0]
output = [-5]
[[tests.fixed]]
input = [-9, -8, -7, -9, 0]
output = [-7]
[[tests.fixed]]
input = [1, 2, 3, 4, 5, 6, 7, 8, 0]
output = [8]
[[tests.fixed]]
input = [9, 1, 1, 1, 1, 1, 1, 1, 0]
output = [9]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [1, 8], range = [-9, 9], nonzero = true, terminator = 0 }]

[targets]
size_par = 15
size_ace = 12
speed_par = 36
speed_ace = 24

[solution]
asm = """
    INBOX
    COPYTO 0
again:
    INBOX
    JUMPZ done
    COPYTO 1
    SUB 0
    JUMPN again
    COPYFROM 1
    COPYTO 0
    JUMP again
done:
    COPYFROM 0
    OUTBOX
"""

[code]
function = "max_of"
doc = "Returns the largest value (the list is never empty)."
params = [{ name = "values", kind = "terminated" }]
returns = "scalar"

[explain]
algorithm = "Linear scan for the maximum"
text = "Walk the list once, remembering the biggest value seen so far. It takes one pass and constant extra space, which is optimal for an unsorted list."
