id = "running-sum"
title = "Running Total"
order = 2
summary = "After each envelope, output the total so far."
story = "The bookkeeper wants a receipt after every single envelope showing how much has come in since the morning bell."
statement = "For each value in the inbox, output the sum of that value and all values before it (the prefix sums)."
constraints = ["The inbox holds between 0 and 8 values.", "Every value is between -9 and 9.", "Tile 0 holds 0 at the start."]
hints = [
  "This is the previous level without the final output: output inside the loop.",
  "ADD the total, COPYTO the total, then OUTBOX.",
]

[[examples]]
input = [1, 2, 3, 4]
output = [1, 3, 6, 10]

[machine]
floor = 1
names = ["total"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "jump", "jumpz"]
[machine.prefill]
0 = 0

[tests]
seed = 202
[[tests.fixed]]
input = []
output = []
[[tests.fixed]]
input = [-9, 9, -9, 9]
output = [-9, 0, -9, 0]
[[tests.fixed]]
input = [0, 0, 5]
output = [0, 0, 5]
[[tests.generators]]
count = 8
inbox = [{ kind = "list", len = [1, 8], range = [-9, 9] }]

[targets]
size_par = 6
size_ace = 5
speed_par = 32
speed_ace = 21

[solution]
asm = """
again:
    INBOX
    ADD 0
    COPYTO 0
    OUTBOX
    JUMP again
"""

[code]
function = "prefix_sums"
doc = "Returns the running total after each value."
params = [{ name = "values", kind = "list" }]
returns = "list"

[explain]
algorithm = "Prefix sums"
text = "Prefix sums turn 'sum of a range' queries into a subtraction of two stored totals. The clerk builds them with a single accumulator that is reported after every step."
