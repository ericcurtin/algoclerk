id = "sum-list"
title = "Tally Sheet"
order = 1
summary = "Add up a list of numbers that ends with a zero."
story = "The Counting House runs on totals. A stack of envelopes arrives, closed by a blank envelope marked 0, and the head accountant wants one number: the grand total."
statement = "The inbox holds a list of non-zero numbers followed by a single 0 that marks the end of the list. Output the sum of the list. An empty list sums to 0."
constraints = ["The list has between 0 and 8 numbers.", "Every number is between -9 and 9 and is not 0.", "Tile 0 holds 0 at the start."]
hints = [
  "Keep a running total on a tile. Tile 0 starts at zero, so it is already a valid total.",
  "For each number: ADD the total, then COPYTO the total tile to save the new total.",
  "When INBOX gives you the 0 marker, JUMPZ to a label that fetches the total and sends it out.",
]

[[examples]]
input = [4, -1, 3, 0]
output = [6]

[[examples]]
input = [0]
output = [0]
note = "An empty list sums to zero."

[machine]
floor = 1
names = ["total"]
allowed = ["inbox", "outbox", "copyto", "copyfrom", "add", "jump", "jumpz"]
[machine.prefill]
0 = 0

[tests]
seed = 201
[[tests.fixed]]
input = [9, 9, 9, 9, 9, 9, 9, 9, 0]
output = [72]
[[tests.fixed]]
input = [-9, -9, 0]
output = [-18]
[[tests.fixed]]
input = [5, -5, 0]
output = [0]
[[tests.generators]]
count = 9
inbox = [{ kind = "list", len = [0, 8], range = [-9, 9], nonzero = true, terminator = 0 }]

[targets]
size_par = 8
size_ace = 7
speed_par = 41
speed_ace = 27

[solution]
asm = """
again:
    INBOX
    JUMPZ done
    ADD 0
    COPYTO 0
    JUMP again
done:
    COPYFROM 0
    OUTBOX
"""

[code]
function = "sum_list"
doc = "Returns the sum of the values."
params = [{ name = "values", kind = "terminated" }]
returns = "scalar"

[explain]
algorithm = "Accumulator (fold)"
text = "One variable remembers the total so far and every element is folded into it. Summing, counting, taking a maximum and joining strings are all folds with different update rules."
